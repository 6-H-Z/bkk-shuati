<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二建 · 知识卡</title>
<style>
  *{box-sizing:border-box}
  :root{--ink:#12263A;--ink-2:#3C5A75;--paper:#FAFAF7;--line:#E2E0D6;--accent:#F2B01E;
        --ok:#1F7A4C;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto;padding:16px 14px 28px;max-width:640px;background:var(--paper);color:var(--ink);
       font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .back{font-size:12px;color:var(--ink-2);text-decoration:none;font-family:var(--mono);letter-spacing:.04em}
  h1{font-size:20px;margin:10px 0 6px;font-weight:650;letter-spacing:.01em}
  .sub{font-size:11.5px;color:var(--ink-2);margin:0 0 16px;font-family:var(--mono);letter-spacing:.02em;
       padding-bottom:10px;border-bottom:1px solid var(--line)}
  .ch{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:2px;
      padding:14px 16px;margin-bottom:10px}
  .ch.off{border-left-color:var(--line);opacity:.62;padding:12px 16px}
  .ch h2{font-size:14.5px;margin:0;display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
  .ch h2 .n{color:#9A9789;font-weight:400;font-size:11px;font-family:var(--mono)}
  .sec{display:block;margin-top:8px;padding:11px 12px;border-radius:2px;background:#FAFAF7;
       text-decoration:none;color:var(--ink);font-size:15px;border:1px solid var(--line)}
  .sec:active{background:#F2F1EA}
  .sec .p{font-size:11px;color:#8C897C;margin-top:3px;font-family:var(--mono);letter-spacing:.02em}
  .sec.todo{color:#9A9789;background:transparent;border-style:dashed}
  .pill{font-size:10.5px;padding:1px 7px;border:1px solid var(--ok);color:var(--ok);border-radius:2px;
        font-family:var(--mono);letter-spacing:.02em}
  footer{margin-top:16px;font-size:11px;color:#9A9789;line-height:1.8;font-family:var(--mono)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<h1>二建 · 知识卡</h1>
<p class="sub">2027 版教材 · 按节出卡 · 手机直接刷</p>

<a class="sub-card" href="sw/">
  <div class="t">机电工程管理与实务 <span class="pill">16 章</span></div>
  <div class="m">已开：1.1 金属材料（32 张 + 验收）</div>
</a>

<a class="sub-card off" href="#">
  <div class="t">建设工程施工管理 <span class="pill todo">8 章</span></div>
  <div class="m">未开始 · 计划 W1 起并行</div>
</a>

<a class="sub-card off" href="#">
  <div class="t">建设工程法规及相关知识 <span class="pill todo">10 章</span></div>
  <div class="m">未开始 · 计划 W14 起并行</div>
</a>

<footer>
  用法：先看问题自己答，再翻面核对。<br>
  每节右上角有「验收」，6 题全对才算通关。<br>
  进度存在本机浏览器，换设备不同步。
</footer>
</body>
</html>
