<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif'%3E2%3C/text%3E%3C/svg%3E">
<title>备考刷题站</title>
<style>
  :root{
    --bg:#F2F2F7;--card:#FFFFFF;--label:#000000;--label2:rgba(60,60,67,.60);--label3:rgba(60,60,67,.30);
    --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);
    --blue:#007AFF;--green:#34C759;--purple:#AF52DE;--teal:#30B0C7;--indigo:#5856D6;--orange:#FF9500;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#000000;--card:#1C1C1E;--label:#FFFFFF;--label2:rgba(235,235,245,.60);--label3:rgba(235,235,245,.30);
      --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);
      --blue:#0A84FF;--green:#30D158;--purple:#BF5AF2;--teal:#40C8E0;--indigo:#5E5CE6;--orange:#FF9F0A}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--label);
    font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom))}
  header{margin:6px 4px 20px}
  header h1{margin:0;font-size:34px;line-height:1.18;font-weight:700;letter-spacing:-.5px}
  header p{margin:5px 0 0;font-size:15px;color:var(--label2)}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 8px;
    font-size:13px;font-weight:600;color:var(--label2)}
  .card{background:var(--card);border-radius:16px;padding:18px 18px 16px;margin-bottom:12px}
  .card.top{padding:20px 18px 18px}
  .zhead{display:flex;align-items:center;gap:12px}
  .appicon{width:56px;height:56px;flex:0 0 56px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:26px;font-weight:700;letter-spacing:-1px;
    background:linear-gradient(160deg,#5E9BFF,#007AFF);box-shadow:0 6px 16px rgba(0,122,255,.28)}
  .zhead .ht{flex:1;min-width:0}
  .zhead h2{margin:0;font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.3px}
  .zhead .desc{margin:3px 0 0;font-size:13px;color:var(--label2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
  .chips span{font-size:12px;color:var(--label2);background:var(--fill);border-radius:7px;padding:4px 9px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:12px;
    font-size:17px;font-weight:600;text-decoration:none;transition:transform .12s cubic-bezier(.32,.72,0,1),opacity .12s}
  .btn:active{transform:scale(.975);opacity:.85}
  .btn.primary{background:var(--blue);color:#fff}
  .group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:13px;padding:12px 15px;text-decoration:none;color:var(--label)}
  .row+.row{border-top:.5px solid var(--sep)}
  .row:active{background:var(--fill)}
  .icon{width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:600;color:var(--c);background:var(--cbg)}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-size:17px;font-weight:600;letter-spacing:-.2px}
  .row .t small{display:block;font-size:12.5px;color:var(--label2);margin-top:1px}
  .chev{color:var(--label3);font-size:19px;line-height:1;margin-left:2px}
  footer{margin:20px 4px 0;font-size:12px;line-height:1.65;color:var(--label3)}
  footer b{color:var(--label2);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>备考刷题站</h1>
    <p>两个分区，各刷各的 · 手机打开就能用</p>
  </header>

  <div class="section-head"><span>单招 2027</span><span>1 区</span></div>
  <div class="zone z1 card top">
    <div class="zhead">
      <div class="appicon">1</div>
      <div class="ht">
        <h2>媛媛 · 四川单招</h2>
        <p class="desc">数学 · 英语 · 信息技术 · 通用技术</p>
      </div>
    </div>
    <div class="chips"><span>440 题</span><span>背诵 393 条</span><span>错题讲解</span><span>变式训练</span></div>
    <a class="btn primary" href="danzhao/">进入 1 区刷题</a>
  </div>

  <div class="section-head"><span>我的</span><span>2 区</span></div>
  <div class="zone z2 group">
    <a class="z2main row" href="zikao/">
      <span class="icon" style="--c:#007AFF;--cbg:rgba(0,122,255,.12)">自</span>
      <span class="t">
        <b>自考本科刷题</b>
        <small>四科 1018 题 · 单选 / 多选 / 判断 / 简答</small>
      </span>
      <span class="chev">›</span>
    </a>
    <a class="row" href="erjian/">
      <span class="icon" style="--c:#34C759;--cbg:rgba(52,199,89,.14)">建</span>
      <span class="t">
        <b>二建机电知识卡</b>
        <small>2027 版教材 · 已开 12 节 / 411 张卡</small>
      </span>
      <span class="chev">›</span>
    </a>
  </div>

  <footer>
    <b>进度只存本机：</b>两个区的做题记录各存各的浏览器里，换手机清缓存会丢，记得在各自页面里备份。<br>
    1 区题目按 2027 四川单招（普高类）基础自编，不是官方真题，以官方考试大纲为准。
  </footer>
</div>
</body>
</html>
