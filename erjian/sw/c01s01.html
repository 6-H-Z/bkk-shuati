<script>
const CARDS = [
  {id:1, g:"分类", q:"金属材料分为哪三类？", a:"黑色金属、有色金属、特种金属材料。", k:"黑、有、特", s:"P1"},
  {id:2, g:"分类", q:"黑色金属又称什么？按含碳量怎么分？", a:"又称钢铁材料。\n碳 ≤ 0.0218% 为纯铁；\n0.0218%～2.11% 为钢；\n> 2.11% 为铸铁。", k:"零点零二一八是纯铁顶，二点一一钢铁分家", s:"P1"},
  {id:3, g:"分类", q:"钢和铸铁的分界线含碳量是多少？", a:"2.11%。钢的含碳量一般在 2.11% 以下。", k:"二一一，分钢铁", s:"P1–P2"},
  {id:4, g:"分类", q:"有色金属的定义是什么？", a:"除铁、铬、锰以外的所有金属及其合金。", k:"铁铬锰之外，都是有色", s:"P1"},
  {id:5, g:"分类", q:"有色金属通常分为哪几类？", a:"轻金属、重金属、贵金属、半金属、稀有金属、稀土金属。", k:"轻、重、贵、半、稀、土", s:"P1"},
  {id:6, g:"分类", q:"与纯金属相比，有色合金的性能有什么特点？", a:"强度和硬度一般更高；\n电阻大、电阻温度系数小。", k:"更硬更阻，阻不随温", s:"P1"},
  {id:7, g:"分类", q:"特种金属材料包括哪些？", a:"非晶态、准晶、微晶、纳米晶金属材料；\n隐身、抗氢、超导、形状记忆、耐磨、减振阻尼等功能合金；\n金属基复合材料。", k:"非准微纳，加功能，加复合", s:"P1"},
  {id:8, g:"性能", q:"金属材料的性能分为哪两类？", a:"工艺性能和使用性能。", k:"工、使两类", s:"P1"},
  {id:9, g:"性能", q:"工艺性能包括哪些？", a:"铸造性能、可焊性、可锻性、热处理性能、切削加工性能。", k:"铸、焊、锻、热、切", s:"P1"},
  {id:10, g:"性能", q:"使用性能包括哪三类？", a:"机械性能、物理性能、化学性能。", k:"机、物、化", s:"P1"},
  {id:11, g:"性能", q:"机械性能（力学性能）的常用指标有哪些？", a:"强度、塑性、硬度、冲击韧性、多次冲击抗力、疲劳极限。", k:"强、塑、硬、冲、多次、疲劳", s:"P1"},
  {id:12, g:"性能", q:"物理性能主要包括什么？", a:"密度、熔点、热膨胀性、磁性、电学性能。", k:"密、熔、胀、磁、电", s:"P1"},
  {id:13, g:"性能", q:"化学性能主要看哪两项？", a:"耐腐蚀性、抗氧化性（又称氧化抗力）。", k:"腐、氧", s:"P1"},
  {id:14, g:"钢", q:"钢按化学成分分为哪三类？", a:"非合金钢、低合金钢、合金钢。", k:"非、低、合", s:"P2"},
  {id:15, g:"钢", q:"非合金钢按含碳量怎么分类？", a:"低碳钢 Wc < 0.25%；\n中碳钢 0.25% ≤ Wc ≤ 0.60%；\n高碳钢 Wc > 0.60%。", k:"二五、六零两个坎", s:"P2"},
  {id:16, g:"钢", q:"碳素结构钢和碳素工具钢的用途区别？", a:"结构钢：机械零件和工程结构件，一般属低、中碳钢；\n工具钢：刀具、量具、模具，一般属高碳钢。", k:"结构低中，工具高碳", s:"P2"},
  {id:17, g:"钢", q:"非合金钢按质量等级分几类？硫磷限量各是多少？", a:"三类：\n普通质量 Ws ≤ 0.045%、Wp ≤ 0.045%；\n优质：硫磷比普通质量少，需特别控制质量；\n特殊质量 Ws ≤ 0.02%、Wp ≤ 0.025%。", k:"普四四五，特二二五", s:"P2"},
  {id:18, g:"钢", q:"碳素结构钢的牌号由哪几部分组成？", a:"屈服强度字母 Q + 屈服强度数值（MPa）+ 质量等级符号（A、B、C、D，质量依次提高）+ 脱氧方法（F 沸腾钢、Z 镇静钢、TZ 特殊镇静钢）。", k:"屈、值、级、脱；脱氧：沸、镇、特镇", s:"P2"},
  {id:19, g:"钢", q:"Q235AF 每个字符什么意思？", a:"碳素结构钢；屈服强度 ≥ 235MPa；质量等级 A 级；脱氧方法为沸腾钢。", k:"Q 数 A F，四段读完", s:"P2–P3"},
  {id:20, g:"钢", q:"Q235 常用在什么地方？", a:"强度稍高，可做螺栓、螺母、销子、吊钩和不太重要的机械零件；\n建筑结构中的螺纹钢、型钢、钢筋等；\n质量较好的 Q235C、D 级可作重要焊接结构用材。", k:"螺栓吊钩螺纹钢", s:"P3"},
  {id:21, g:"钢", q:"优质碳素结构钢的牌号数字代表什么？", a:"平均含碳量的万分数。\n如 45 钢表示 Wc = 0.45%；08 钢表示 Wc = 0.08%。", k:"万分数，念出来就是含碳量", s:"P3"},
  {id:22, g:"钢", q:"20 钢的特点和典型用途？", a:"冷塑性变形和焊接性好；\n用于强度要求不高的零件及渗碳零件：机罩、焊接容器、小轴、螺母、垫圈、渗碳齿轮。", k:"二零渗碳，焊接容器", s:"P3"},
  {id:23, g:"钢", q:"45 钢为什么用来做齿轮、连杆、轴？", a:"经调质后可获得良好的综合力学性能，属中碳钢，用于受力较大的机械零件。", k:"四五调质，齿轮连杆轴", s:"P3"},
  {id:24, g:"钢", q:"不锈钢的含铬量门槛是多少？", a:"含铬量 Wcr > 12%，才具有不锈钢的特点。", k:"十二铬，才不锈", s:"P3"},
  {id:25, g:"钢", q:"不锈钢按热处理后的显微组织分为哪五类？", a:"铁素体不锈钢、马氏体不锈钢、奥氏体不锈钢、奥氏体-铁素体不锈钢、沉淀硬化不锈钢。", k:"铁、马、奥、双、沉", s:"P3"},
  {id:26, g:"钢", q:"锅炉钢的含碳量范围？高压锅炉用什么钢？", a:"含碳量 Wc 在 0.16%～0.26%；\n高压锅炉采用珠光体耐热钢或奥氏体耐热钢。", k:"一六到二六，高压上耐热", s:"P3"},
  {id:27, g:"钢", q:"耐热钢分为哪两类？", a:"抗氧化钢（高温不起皮，化学稳定性好但承载较低）；\n热强钢（高温强度高，并有相应抗氧化性）。", k:"抗氧 + 热强，两兄弟", s:"P4"},
  {id:28, g:"有色", q:"纯铜的密度、熔点、外观和主要性能？", a:"玫瑰红色，表面氧化呈紫红色（故称紫铜）；\n密度 8.89 g/cm³，熔点 1083℃；\n导电性、导热性好，可进行各种冷、热加工。", k:"八八九，一零八三，紫铜导热", s:"P4"},
  {id:29, g:"有色", q:"黄铜是什么合金？主要用途？", a:"铜和锌组成的合金，耐磨性能较强。\n无缝管：换热器、冷凝器、低温管路、海底管道；\n板材、条材、棒材、管材及铸造零件；\n铸件常做阀门和管道配件。", k:"黄铜加锌，换热冷凝", s:"P4"},
  {id:30, g:"有色", q:"白铜以什么为主要添加元素？分哪两类？", a:"以镍为主要添加元素。\n结构白铜：机械性能和耐蚀性好，色泽美观；\n电工白铜：热电性能好（锰铜、康铜、考铜）。", k:"白铜加镍，结构 + 电工", s:"P4"},
  {id:31, g:"有色", q:"青铜以什么为主要添加元素？四种青铜各用在什么地方？", a:"以锡为主要添加元素。\n锡青铜：轴承、蜗轮、齿轮；\n铅青铜：发动机和磨床轴承；\n铝青铜：高载荷齿轮、轴套、船用螺旋桨；\n铍青铜：精密弹簧、电接触元件。", k:"青铜加锡，锡铅铝铍", s:"P4"},
  {id:32, g:"有色", q:"铝的密度、熔点和性能特点？", a:"银白色轻金属，密度 2.698 g/cm³，熔点 660.24℃；\n化学性能活泼，塑性好、强度低，适合冷加工成型（轧制、挤压、模锻、冷冲、弯曲）。", k:"二点七，六六零，轻而软", s:"P4"}
];

const EXAM = [
  { type:"正向", cardIds:[17],
    q:"非合金钢按质量等级分为哪几类？普通质量和特殊质量的硫、磷限量各是多少？",
    answer:"三类：\n普通质量 Ws ≤ 0.045%、Wp ≤ 0.045%；\n优质：硫磷比普通质量少，需特别控制质量；\n特殊质量 Ws ≤ 0.02%、Wp ≤ 0.025%。",
    keys:["普通","特殊","优质","0.045","0.02","0.025"], need:5 },
  { type:"选择", cardIds:[18,19],
    q:"某批钢材标记为 Q235AF，下列说法正确的是：",
    options:["屈服强度 235MPa，A 级质量，沸腾钢","抗拉强度 235MPa，F 级质量，镇静钢","屈服强度 235MPa，F 级质量，沸腾钢","抗拉强度 235MPa，A 级质量，镇静钢"],
    correct:0,
    why:"Q = 屈服强度，235 = 数值（MPa），A = 质量等级，F = 沸腾钢。\nB、D 把「屈服」换成了「抗拉」；C 把质量等级 A 与脱氧符号 F 对调。" },
  { type:"选择", cardIds:[24,25],
    q:"下列关于不锈钢的说法，错误的是：",
    options:["含铬量 Wcr > 12%，才具有不锈钢的特点","按热处理后的显微组织可分为五类，其中包括沉淀硬化不锈钢","不锈钢就是耐酸钢，两者是同一个概念","奥氏体不锈钢是五类之一"],
    correct:2,
    why:"教材：不锈钢是（狭义）不锈钢和耐酸钢的「总称」，不能等同。\n能抵抗大气腐蚀的叫不锈钢，抵抗化学介质腐蚀的叫耐酸钢——两者范围不同。" },
  { type:"反向", cardIds:[2,3,32],
    q:"说出下面三个数字各自代表什么：\n2.11%　／　0.0218%　／　660.24℃",
    answer:"2.11% —— 钢与铸铁的含碳量分界线；\n0.0218% —— 黑色金属中纯铁的含碳量上限；\n660.24℃ —— 铝的熔点。",
    keys:["2.11","铸铁","0.0218","纯铁","660.24","铝"], need:5 },
  { type:"反向", cardIds:[25,29,30,31],
    q:"把口诀展开：\n「铁马奥双沉」是哪五类？\n「黄锌白镍青是锡」分别指哪三种铜合金的主要添加元素？",
    answer:"五类：铁素体、马氏体、奥氏体、奥氏体-铁素体、沉淀硬化不锈钢。\n黄铜—锌；白铜—镍；青铜—锡。",
    keys:["铁素体","马氏体","奥氏体","沉淀硬化","锌","镍","锡"], need:6 },
  { type:"场景", cardIds:[20,23],
    q:"工地上两批钢材：一批 Q235D，要做重要焊接结构；另一批 45 钢，想拿来替代。\n监理问你行不行，依据是什么？",
    answer:"Q235D 可以 —— 教材：质量较好的 Q235C、D 级可作重要焊接结构用材。\n45 钢不宜替代 —— 教材中 45 钢是优质碳素结构钢，调质后用于受力较大的机械零件（齿轮、连杆、轴）；它属中碳钢（Wc 0.45%），焊接性远不如低碳钢。\n（后半句按常识推断，非教材原文。）",
    keys:["Q235D","可以","45","不宜","焊接"], need:3 }
];

const KEY_STATUS = "erjian_mec_1_1_status";
const KEY_PASS = "erjian_mec_1_1_pass";

let status = {};
try { status = JSON.parse(localStorage.getItem(KEY_STATUS) || "{}"); } catch (e) { status = {}; }
let passInfo = null;
try { passInfo = JSON.parse(localStorage.getItem(KEY_PASS) || "null"); } catch (e) { passInfo = null; }

let mode = "all";
let queue = CARDS.map(c => c.id);
let pos = 0;

const el = id => document.getElementById(id);

function buildQueue() {
  let ids = CARDS.map(c => c.id);
  if (mode === "review") ids = ids.filter(id => status[id] === 0);
  if (mode === "shuffle") ids = ids.sort(() => Math.random() - 0.5);
  queue = ids;
  pos = 0;
}

function renderBadge() {
  if (passInfo && passInfo.pass) {
    el("passBadge").innerHTML = '<span class="badge">已通关 ' + passInfo.date + '</span>';
    el("gateBtn").classList.add("passed");
    if (!el("exam").classList.contains("on")) el("gateBtn").textContent = "已通关";
  } else {
    el("passBadge").textContent = "";
    el("gateBtn").classList.remove("passed");
    if (!el("exam").classList.contains("on")) el("gateBtn").textContent = "验收";
  }
}

function render() {
  const good = CARDS.filter(c => status[c.id] === 1).length;
  const bad = CARDS.filter(c => status[c.id] === 0).length;
  el("total").textContent = CARDS.length;
  el("nNew").textContent = CARDS.length - good - bad;
  el("nGood").textContent = good;
  el("nBad").textContent = bad;

  if (!queue.length) {
    el("tag").textContent = "没有卡";
    el("q").textContent = "这一组是空的 —— 换「全部」或「随机」。";
    el("a").hidden = true; el("kk").hidden = true;
    el("hint").textContent = ""; el("src").textContent = "";
    return;
  }
  if (pos < 0) pos = queue.length - 1;
  if (pos >= queue.length) pos = 0;

  const c = CARDS.find(x => x.id === queue[pos]);
  el("tag").textContent = c.g;
  el("q").textContent = c.q;
  el("a").textContent = c.a;
  el("a").hidden = true;
  el("kk").textContent = c.k ? "口诀：" + c.k : "";
  el("kk").hidden = true;
  el("hint").textContent = "点卡片任意位置翻面";
  el("src").textContent = "出处：" + c.s + "　（第 " + (pos + 1) + " / " + queue.length + " 张）";
  el("flip").textContent = "翻面";
  window.scrollTo(0, 0);
}

function toggle() {
  if (!queue.length) return;
  const show = el("a").hidden;
  el("a").hidden = !show;
  el("kk").hidden = !show || !el("kk").textContent;
  el("flip").textContent = show ? "收起" : "翻面";
  el("hint").textContent = show ? "" : "点卡片任意位置翻面";
}

function next(step) {
  if (!queue.length) return;
  pos = (pos + step + queue.length) % queue.length;
  render();
}

function mark(v) {
  if (!queue.length) return;
  status[queue[pos]] = v;
  try { localStorage.setItem(KEY_STATUS, JSON.stringify(status)); } catch (e) {}
  pos = (pos + 1) % queue.length;
  render();
}

let ex = { i:0, score:0, answered:false, wrongCards:[] };

function startExam() {
  ex = { i:0, score:0, answered:false, wrongCards:[] };
  el("study").classList.add("off");
  el("exam").classList.add("on");
  el("dock").style.display = "none";
  el("gateBtn").textContent = "退出验收";
  renderExam();
  window.scrollTo(0, 0);
}

function exitExam() {
  el("study").classList.remove("off");
  el("exam").classList.remove("on");
  el("dock").style.display = "flex";
  renderBadge();
  render();
}

function renderExam() {
  const q = EXAM[ex.i];
  el("exPos").textContent = "第 " + (ex.i + 1) + " / " + EXAM.length + " 题";
  el("exScore").textContent = "已对 " + ex.score;
  el("exTag").textContent = q.type;
  el("exQ").textContent = q.q;
  el("exOpts").innerHTML = "";
  el("exWhy").hidden = true;
  el("exWhy").textContent = "";
  ex.answered = false;

  const dock = el("exDock");
  dock.innerHTML = "";

  if (q.options) {
    q.options.forEach((opt, idx) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = String.fromCharCode(65 + idx) + ". " + opt;
      b.onclick = () => answerChoice(idx);
      el("exOpts").appendChild(b);
    });
    const skip = document.createElement("button");
    skip.textContent = "不会";
    skip.onclick = () => answerChoice(-1);
    dock.appendChild(skip);
  } else {
    const ta = document.createElement("textarea");
    ta.id = "exInput";
    ta.rows = 4;
    ta.placeholder = "用你自己的话写下来，写完点「提交」——空着提交也算没答。";
    el("exOpts").appendChild(ta);
    const sub = document.createElement("button");
    sub.className = "primary";
    sub.textContent = "提交答案";
    sub.onclick = () => gradeOpen(q, ta.value);
    dock.appendChild(sub);
  }
}

function norm(s) {
  return (s || "").toLowerCase().replace(/\s+/g, "").replace(/％/g, "%");
}

function gradeOpen(q, input) {
  if (ex.answered) return;
  ex.answered = true;
  const t = norm(input);
  const keys = q.keys || [];
  const hits = keys.filter(k => t.includes(norm(k)));
  const miss = keys.filter(k => !t.includes(norm(k)));
  const need = q.need || keys.length;
  const pass = hits.length >= need;

  let txt = "命中 " + hits.length + " / " + keys.length + " 个关键词（需要 " + need + " 个）\n";
  if (hits.length) txt += "✅ 命中：" + hits.join("、") + "\n";
  if (miss.length) txt += "❌ 漏掉：" + miss.join("、") + "\n";
  txt += "\n—— 参考答案 ——\n" + q.answer;

  el("exWhy").textContent = txt;
  el("exWhy").hidden = false;

  const dock = el("exDock");
  dock.innerHTML = "";
  const nextBtn = document.createElement("button");
  nextBtn.className = "primary";
  nextBtn.textContent = ex.i === EXAM.length - 1 ? "看结果" : "下一题";
  nextBtn.onclick = () => finishQuestion(pass);
  dock.appendChild(nextBtn);
}

function answerChoice(idx) {
  if (ex.answered) return;
  ex.answered = true;
  const q = EXAM[ex.i];
  const opts = el("exOpts").querySelectorAll(".opt");
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add("ok");
    if (i === idx && idx !== q.correct) b.classList.add("no");
  });
  el("exWhy").textContent = q.why || q.answer || "";
  el("exWhy").hidden = false;

  const dock = el("exDock");
  dock.innerHTML = "";
  const nextBtn = document.createElement("button");
  nextBtn.className = "primary";
  nextBtn.textContent = ex.i === EXAM.length - 1 ? "看结果" : "下一题";
  nextBtn.onclick = () => finishQuestion(idx === q.correct);
  dock.appendChild(nextBtn);
}

function finishQuestion(right) {
  if (right) ex.score++;
  else ex.wrongCards = ex.wrongCards.concat(EXAM[ex.i].cardIds || []);
  ex.i++;
  if (ex.i >= EXAM.length) showResult();
  else renderExam();
}

function showResult() {
  const total = EXAM.length;
  const pass = ex.score === total;
  el("exPos").textContent = "验收结束";
  el("exScore").textContent = "";
  el("exTag").textContent = pass ? "通关" : "未通过";
  el("exQ").textContent = "";
  el("exOpts").innerHTML = "";

  const uniq = [...new Set(ex.wrongCards)].sort((a, b) => a - b);
  let txt = "答对 " + ex.score + " / " + total + " 题\n";
  if (pass) {
    const d = new Date();
    const ds = (d.getMonth() + 1) + "-" + String(d.getDate()).padStart(2, "0");
    passInfo = { pass:true, date:ds, score:ex.score };
    try { localStorage.setItem(KEY_PASS, JSON.stringify(passInfo)); } catch (e) {}
    txt += "\n✅ 本节通关。7 天后再验一次。\n\n";
    txt += "额外一道人工关：拿张白纸，3 分钟写出这节结构，拍照发给教练——程序判不了这一步。";
  } else {
    txt += "\n❌ 没过。错题对应的卡：卡 " + uniq.join("、卡 ") + "\n\n";
    txt += "回卡片区按编号核对，重点看这几张。";
  }

  const why = el("exWhy");
  why.textContent = txt;
  why.hidden = false;

  const dock = el("exDock");
  dock.innerHTML = "";
  const again = document.createElement("button");
  again.textContent = pass ? "再验一次" : "重来";
  again.onclick = () => startExam();
  const back = document.createElement("button");
  back.className = "primary";
  back.textContent = "回卡片";
  back.onclick = () => exitExam();
  dock.appendChild(again);
  dock.appendChild(back);
  renderBadge();
}

el("card").addEventListener("click", toggle);
el("flip").onclick = e => { e.stopPropagation(); toggle(); };
el("good").onclick = () => mark(1);
el("bad").onclick = () => mark(0);
el("prev").onclick = () => next(-1);
el("gateBtn").onclick = () => {
  if (el("exam").classList.contains("on")) exitExam(); else startExam();
};

document.querySelectorAll(".tools button[data-mode]").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".tools button[data-mode]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    mode = b.dataset.mode;
    buildQueue();
    render();
  };
});

let x0 = null;
el("card").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
el("card").addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 60) next(dx < 0 ? 1 : -1);
  x0 = null;
});

buildQueue();
render();
renderBadge();
</script>
</body>
</html>
