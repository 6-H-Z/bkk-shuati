<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">
<title>二建 · 知识卡</title>
<style>
  :root{--bg:#F2F2F7;--card:#FFF;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
    --sep:rgba(60,60,67,.18);--blue:#007AFF;--green:#34C759;--fill:rgba(120,120,128,.12)}
  @media (prefers-color-scheme:dark){
    :root{--bg:#000;--card:#1C1C1E;--label:#FFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
      --sep:rgba(84,84,88,.65);--blue:#0A84FF;--green:#30D158;--fill:rgba(120,120,128,.24)}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--label);
    font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    padding:calc(8px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .back{display:inline-flex;align-items:center;font-size:15px;color:var(--blue);text-decoration:none;padding:3px 0;margin-bottom:4px}
  header{margin:4px 2px 20px}
  h1{font-size:32px;line-height:1.16;font-weight:700;letter-spacing:-.5px;margin:0}
  .sub{font-size:13px;color:var(--label2);margin:5px 0 0}
  .group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
  a.subject{display:block;padding:13px 15px;text-decoration:none;color:var(--label);transition:background .12s}
  a.subject+a.subject{border-top:.5px solid var(--sep)}
  a.subject:active{background:var(--fill)}
  a.subject.off{opacity:.55}
  .row{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
  .name{font-size:17px;font-weight:600;letter-spacing:-.2px}
  .ch{font-size:12px;color:var(--label2);background:var(--fill);border-radius:6px;padding:2px 8px;white-space:nowrap}
  .meta{font-size:13px;color:var(--label2)}
  .bar{height:3px;background:var(--fill);border-radius:2px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
  footer{margin-top:18px;font-size:12px;color:var(--label3);line-height:1.7;text-align:center}
</style>
</head>
<body>
<a class="back" href="../">‹ 分区</a>
<header>
  <h1>二建 · 知识卡</h1>
  <p class="sub">2027 版教材 · 按节出卡 · 手机直接刷</p>
</header>

<div class="group">
  <a class="subject" href="sw/">
    <div class="row">
      <span class="name">机电工程管理与实务</span>
      <span class="ch">16 章</span>
    </div>
    <div class="meta">已开 13 节 · 450 张卡 · 78 道验收</div>
    <div class="bar"><i style="width:81%"></i></div>
  </a>
  <a class="subject off" href="#">
    <div class="row">
      <span class="name">建设工程施工管理</span>
      <span class="ch">8 章</span>
    </div>
    <div class="meta">未开始 · 计划 W1 起并行</div>
    <div class="bar"><i style="width:0%"></i></div>
  </a>
  <a class="subject off" href="#">
    <div class="row">
      <span class="name">建设工程法规及相关知识</span>
      <span class="ch">10 章</span>
    </div>
    <div class="meta">未开始 · 计划 W14 起并行</div>
    <div class="bar"><i style="width:0%"></i></div>
  </a>
</div>

<footer>
  先看问题自己答，再翻面核对。<br>
  每节右上角「验收」，6 题全对才算通关。<br>
  进度存在本机浏览器，换设备不同步。
</footer>
</body>
</html>
