<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3E1%3C/text%3E%3C/svg%3E">
<title>1区 · 媛媛刷题 · 四川单招 2027</title>
<style>
  /* ============ iOS 设计变量 ============ */
  :root{
    --bg:#F2F2F7;
    --card:#FFFFFF;
    --card2:#FFFFFF;
    --label:#000000;
    --label2:rgba(60,60,67,.60);
    --label3:rgba(60,60,67,.30);
    --sep:rgba(60,60,67,.29);
    --fill:rgba(120,120,128,.12);
    --fill2:rgba(120,120,128,.20);
    --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
    --purple:#AF52DE; --teal:#30B0C7; --pink:#FF2D55; --indigo:#5856D6;
    --blue-t:rgba(0,122,255,.12); --green-t:rgba(52,199,89,.14); --red-t:rgba(255,59,48,.12);
    --shadow:0 1px 2px rgba(0,0,0,.04);
    --r:12px; --r-lg:16px;
    --spring:cubic-bezier(.32,.72,0,1);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
      --label:#FFFFFF; --label2:rgba(235,235,245,.60); --label3:rgba(235,235,245,.30);
      --sep:rgba(84,84,88,.65);
      --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
      --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
      --purple:#BF5AF2; --teal:#40C8E0; --pink:#FF375F; --indigo:#5E5CE6;
      --blue-t:rgba(10,132,255,.22); --green-t:rgba(48,209,88,.22); --red-t:rgba(255,69,58,.20);
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--label);font:17px/1.47 var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  a{color:var(--blue);text-decoration:none}
  .ic{width:20px;height:20px;flex:0 0 auto;display:block}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .screen{
    max-width:680px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;min-height:100dvh;
    animation:screenIn .3s var(--spring);
  }
  @keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hide{display:none!important}

  /* ============ 顶部大标题 / 导航 ============ */
  .big-header{display:flex;align-items:flex-start;gap:10px;padding:18px 0 6px}
  .big-header .htext{flex:1;min-width:0}
  .big-header h1{margin:0;font-size:34px;line-height:1.18;font-weight:700;letter-spacing:-.4px}
  .big-header p{margin:4px 0 0;font-size:15px;line-height:1.35;color:var(--label2)}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;background:var(--fill);display:flex;align-items:center;
    justify-content:center;color:var(--label);margin-top:4px;transition:transform .15s var(--spring),background .15s
  }
  .icon-btn:active{transform:scale(.9);background:var(--fill2)}
  .icon-btn .ic{width:19px;height:19px}

  .nav{display:flex;align-items:center;gap:8px;height:44px;margin:0 -8px}
  .nav .back{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;padding:6px 8px;border-radius:10px}
  .nav .back:active{background:var(--fill)}
  .nav .back .ic{width:22px;height:22px}
  .nav .title{flex:1;text-align:center;min-width:0}
  .nav .title b{display:block;font-size:17px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav .title span{display:block;font-size:12px;color:var(--label2);margin-top:1px}
  .nav .trail{display:flex;align-items:center;gap:5px;justify-content:flex-end}
  .nav-cap{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-t);padding:4px 9px;border-radius:99px;white-space:nowrap}
  .nav-cap.gray{color:var(--label2);background:var(--fill)}
  .nav-cap.orange{color:var(--orange);background:rgba(255,149,0,.14)}

  /* ============ 卡片 / 列表（iOS 分组） ============ */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
  .list-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .list-group>*+*{border-top:.5px solid var(--sep)}
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:13px;font-weight:600;color:var(--label2);letter-spacing:.1px;
    padding:22px 4px 8px;text-transform:none
  }
  .footnote{font-size:13px;line-height:1.5;color:var(--label2)}
  .caption{font-size:12px;line-height:1.4;color:var(--label2)}

  /* 今日卡 */
  .today{display:flex;align-items:center;gap:16px;padding:16px}
  .ring{
    width:58px;height:58px;flex:0 0 58px;border-radius:50%;position:relative;
    background:conic-gradient(var(--blue) calc(var(--p,0)*1%),var(--fill) 0);
    transition:background .4s var(--spring)
  }
  .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;z-index:1;letter-spacing:-.2px}
  .today-info{flex:1;min-width:0}
  .today-line{display:flex;align-items:baseline;gap:6px}
  .today-line .num{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
  .today-line .of{font-size:15px;color:var(--label2)}
  .today-info .sub{margin-top:3px}
  .today-rate{margin-left:auto;text-align:right;font-size:13px;color:var(--label2);line-height:1.4}
  .today-rate b{display:block;font-size:17px;color:var(--label);letter-spacing:-.2px}

  /* 科目行 */
  .subj{display:flex;align-items:center;gap:12px;padding:12px 14px;transition:background .12s}
  .subj:active{background:var(--fill)}
  .sicon{
    width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:600;color:var(--c);background:var(--cbg)
  }
  .sinfo{flex:1;min-width:0}
  .srow{display:flex;align-items:baseline;gap:8px}
  .srow b{font-size:17px;font-weight:600;letter-spacing:-.2px}
  .srow .cnt{margin-left:auto;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
  .srow.small{margin-top:2px}
  .srow.small span{font-size:12.5px;color:var(--label2);font-variant-numeric:tabular-nums}
  .bar{height:3px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:7px}
  .bar>i{display:block;height:100%;border-radius:2px;background:var(--blue);transition:width .35s var(--spring)}
  .sbtns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .mini{
    font-size:13px;font-weight:600;line-height:1.2;padding:5px 10px;border-radius:99px;
    background:var(--fill);color:var(--label);white-space:nowrap;transition:transform .12s var(--spring)
  }
  .mini:active{transform:scale(.94)}
  .mini.tint{background:var(--blue-t);color:var(--blue)}

  /* 大按钮 */
  .quick{display:flex;gap:10px;margin-top:18px}
  .btn-filled,.btn-tinted{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    height:50px;border-radius:var(--r);font-size:17px;font-weight:600;letter-spacing:-.2px;
    transition:transform .12s var(--spring),opacity .12s
  }
  .btn-filled{background:var(--blue);color:#fff}
  .btn-tinted{background:var(--blue-t);color:var(--blue)}
  .btn-filled:active,.btn-tinted:active{transform:scale(.975);opacity:.85}
  .btn-filled .ic,.btn-tinted .ic{width:19px;height:19px}
  .btn-tinted em{font-style:normal;background:var(--red);color:#fff;font-size:11px;font-weight:700;
    min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .tip{margin:18px 4px 0;font-size:12.5px;line-height:1.55;color:var(--label2);opacity:.85}

  /* ============ 刷题 ============ */
  .qprog{height:3px;border-radius:2px;background:var(--fill);overflow:hidden;margin:2px 0 14px}
  .qprog>i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .3s var(--spring)}
  .qcard{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 16px 15px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--fill);color:var(--label2)}
  .tag.gray{background:var(--fill);color:var(--label2)}
  .tag.blue{background:var(--blue-t);color:var(--blue)}
  .passage{font-size:15px;line-height:1.55;background:var(--fill);border-radius:10px;padding:11px 13px;margin-bottom:13px;max-height:250px;overflow:auto;white-space:pre-wrap;color:var(--label2);-webkit-overflow-scrolling:touch}
  .stem{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.3px;margin:2px 0 14px;white-space:pre-wrap;word-break:break-word}
  .opts{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin:0 -1px}
  .opt{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:12px 13px;font-size:17px;line-height:1.4;background:var(--card);
    transition:background .12s,transform .1s var(--spring)
  }
  .opt+.opt{border-top:.5px solid var(--sep)}
  .opt:active{background:var(--fill)}
  .opt .ltr{
    width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:var(--fill);color:var(--label2);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center
  }
  .opt .txt{flex:1;min-width:0;word-break:break-word}
  .opt .mark{width:22px;height:22px;flex:0 0 22px;display:none;align-items:center;justify-content:center}
  .opt .mark .ic{width:20px;height:20px;stroke-width:2.3}
  .opt.locked{opacity:1}
  .opt.right{background:var(--green-t)}
  .opt.right .ltr{background:var(--green);color:#fff}
  .opt.right .mark{display:flex;color:var(--green)}
  .opt.wrong{background:var(--red-t)}
  .opt.wrong .ltr{background:var(--red);color:#fff}
  .opt.wrong .mark{display:flex;color:var(--red)}
  .judge .opt{justify-content:center;font-size:17px;font-weight:500;padding:14px 13px}
  .judge .opt .ltr{display:none}
  @keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .fb{margin-top:12px;border-radius:var(--r);padding:12px 14px;font-size:15px;line-height:1.5;animation:reveal .25s var(--spring)}
  .fb.ok{background:var(--green-t);color:var(--green)}
  .fb.bad{background:var(--red-t);color:var(--red)}
  .fb .fb-head{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
  .fb .fb-head .ic{width:18px;height:18px;stroke-width:2.4}
  .fb b{font-weight:700}
  .fb .ex{display:block;margin-top:6px;color:var(--label);font-size:15px;line-height:1.5}
  .teach{margin-top:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:reveal .3s var(--spring)}
  .teach summary{
    list-style:none;display:flex;align-items:center;gap:8px;padding:13px 14px;
    font-size:15px;font-weight:600;color:var(--label);cursor:pointer
  }
  .teach summary::-webkit-details-marker{display:none}
  .teach summary .cap{font-size:13px;color:var(--label2);font-weight:400;margin-left:auto}
  .teach summary .card-chev{color:var(--label3);transition:transform .25s var(--spring)}
  .teach[open] summary .card-chev{transform:rotate(90deg)}
  .teach .body{padding:0 14px 14px;border-top:.5px solid var(--sep)}
  .teach .blk{padding-top:11px}
  .teach .blk .lb{font-size:12px;font-weight:600;color:var(--label2);letter-spacing:.2px}
  .teach .blk p{margin:3px 0 0;font-size:15px;line-height:1.55;color:var(--label)}
  .teach .blk.must .lb{color:var(--blue)}
  .teach .blk.mis .lb{color:var(--red)}
  .qfoot{display:flex;gap:10px;margin-top:16px}
  .qfoot button{
    flex:1;height:50px;border-radius:var(--r);font-size:17px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s var(--spring),opacity .12s
  }
  .qfoot button:active{transform:scale(.975);opacity:.85}
  .qfoot .prev,.qfoot .ghost{background:var(--fill);color:var(--label)}
  .qfoot .next{background:var(--blue);color:#fff}
  .qfoot button:disabled{opacity:.35}
  .multi{font-size:12px;color:var(--label2);opacity:.8;text-align:center;margin-top:12px}

  /* ============ 背诵 ============ */
  .seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:6px 0 14px}
  .seg button{
    flex:1;font-size:13px;font-weight:600;padding:6px 2px;border-radius:7px;color:var(--label);
    transition:background .2s var(--spring),box-shadow .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  @media (prefers-color-scheme:dark){ .seg button.on{background:#636366;box-shadow:none} }
  .rev-units{display:flex;gap:7px;overflow:auto;padding:2px 2px 8px;margin:0 -2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .rev-units::-webkit-scrollbar{display:none}
  .rev-unit{
    background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:7px 11px;
    font-size:13px;font-weight:600;color:var(--label);white-space:nowrap;line-height:1.3;
    transition:transform .12s var(--spring)
  }
  .rev-unit:active{transform:scale(.96)}
  .rev-unit em{font-style:normal;display:block;font-size:11px;font-weight:400;color:var(--label2);margin-top:1px;font-variant-numeric:tabular-nums}
  .rev-unit.on{background:var(--blue);color:#fff}
  .rev-unit.on em{color:rgba(255,255,255,.8)}
  .rev-meta{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 10px;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
  .rev-meta a{font-size:13px;color:var(--blue)}
  .rev-card{
    background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);
    padding:26px 20px;min-height:236px;display:flex;flex-direction:column;justify-content:center;text-align:center;
    transition:transform .12s var(--spring)
  }
  .rev-card:active{transform:scale(.995)}
  .rev-q{font-size:21px;line-height:1.45;font-weight:600;letter-spacing:-.3px;white-space:pre-wrap;word-break:break-word}
  @keyframes flipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .rev-a{
    margin-top:20px;padding-top:18px;border-top:.5px solid var(--sep);
    font-size:18px;line-height:1.5;color:var(--blue);white-space:pre-wrap;word-break:break-word;text-align:left;
    animation:flipIn .28s var(--spring)
  }
  .rev-hint{color:var(--label3);font-size:13px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:5px}
  .rev-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);opacity:.65;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}
  .rev-foot{display:flex;gap:10px;margin-top:14px}
  .rev-foot button{flex:1;height:50px;border-radius:var(--r);font-size:17px;font-weight:600;transition:transform .12s var(--spring),opacity .12s}
  .rev-foot button:active{transform:scale(.975);opacity:.85}
  .rev-foot .again{background:var(--fill);color:var(--label)}
  .rev-foot .again .ic{color:var(--red)}
  .rev-foot .know{background:var(--green);color:#fff}

  /* ============ 弹层 ============ */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .22s ease
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    background:var(--card);width:100%;max-width:680px;border-radius:16px 16px 0 0;
    padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
    animation:sheetIn .38s var(--spring);-webkit-overflow-scrolling:touch
  }
  @keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
  .grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);opacity:.6;margin:0 auto 14px}
  .sheet h2{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0 0 2px}
  .sheet .sub{font-size:13px;color:var(--label2);margin:0 0 16px}
  .res{text-align:center;padding:8px 0 2px}
  .res .big{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.1}
  .res .big em{font-style:normal;font-size:19px;color:var(--label2);font-weight:500;margin-left:6px}
  .res p{font-size:15px;color:var(--label2);margin:8px 0 0;line-height:1.45}
  .res .acts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .res .acts button{height:50px;border-radius:var(--r);font-size:17px;font-weight:600}
  .res .acts .primary{background:var(--blue);color:#fff}
  .res .acts .plain{background:var(--fill);color:var(--label)}
  .set-list{background:var(--card);border-radius:var(--r);overflow:hidden;margin:4px 0 16px}
  .set-list>*+*{border-top:.5px solid var(--sep)}
  .set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:17px}
  .set-row .txt{flex:1;min-width:0}
  .set-row small{display:block;font-size:12px;color:var(--label2);margin-top:1px;line-height:1.35}
  .set-row .ic{width:20px;height:20px}
  .sw{position:relative;width:51px;height:31px;flex:0 0 51px}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw i{position:absolute;inset:0;background:var(--fill2);border-radius:99px;transition:background .25s}
  .sw i::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;
    top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .25s var(--spring)}
  .sw input:checked+i{background:var(--green)}
  .sw input:checked+i::after{transform:translateX(20px)}
  .act-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;font-size:17px;text-align:left}
  .act-row:active{background:var(--fill)}
  .act-row .ic{width:20px;height:20px;color:var(--blue)}
  .act-row.danger,.act-row.danger .ic{color:var(--red)}
  .act-row .chev{margin-left:auto;color:var(--label3);width:16px;height:16px}
  .about{font-size:12px;line-height:1.6;color:var(--label2);margin:16px 2px 0}

  #toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(14px);
    background:rgba(0,0,0,.82);color:#fff;font-size:14px;font-weight:500;padding:10px 18px;border-radius:99px;
    opacity:0;transition:.28s var(--spring);z-index:60;pointer-events:none;max-width:86vw;text-align:center;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<section id="home" class="screen">
  <div class="big-header">
    <div class="htext">
      <h1>1区 · 媛媛</h1>
      <p>四川单招 2027 · 数学 / 英语 / 信息技术 / 通用技术</p>
    </div>
    <button class="icon-btn" id="btnSet" aria-label="设置"></button>
  </div>

  <div class="card today">
    <div class="ring" id="tdRing"><b id="tdPct">0%</b></div>
    <div class="today-info">
      <div class="today-line"><span class="num" id="tdN">0</span><span class="of">/ 20 题</span></div>
      <div class="sub footnote">今日目标 · 保持每天 20 题</div>
    </div>
    <div class="today-rate"><b id="tdRate">—</b>正确率</div>
  </div>

  <div class="section-head"><span>四科 · 刷 / 背 / 变</span><span id="allDone">—</span></div>
  <div class="list-group" id="subjList"></div>

  <div class="quick">
    <button id="btnWrong" class="btn-tinted"></button>
    <button id="btnSmart" class="btn-filled"></button>
  </div>

  <p class="tip">「智能」按你的薄弱点抽题；「变式」每次都换数字/换词出新题，答对升难度、答错降难度。<br>题目按 2027 四川单招（普高类）基础自编，不是官方真题。进度只存这台设备。</p>
</section>

<!-- ============ 刷题 ============ -->
<section id="quiz" class="screen hide">
  <div class="nav">
    <button class="back" id="btnQuit" aria-label="返回"></button>
    <div class="title"><b id="qSubj">数学</b><span id="qPos">1 / 110</span></div>
    <div class="trail"><span class="nav-cap gray" id="qMode">顺序练</span><span class="nav-cap orange hide" id="qLv">L1</span></div>
  </div>

    <button id="btnPrev" class="prev"></button>

<section id="recite" class="screen hide">
  <div class="nav">
    <button class="back" id="btnRecBack" aria-label="返回"></button>
    <div class="title"><b>背诵</b><span id="recSubjSub">先看提示，想一遍再翻答案</span></div>
    <div class="trail"></div>
  </div>
  <div class="seg" id="revTabs"></div>
  <div class="rev-units" id="revUnits"></div>
  <div class="rev-meta"><span id="revProg">—</span><a href="javascript:;" id="revReset">重置本单元</a></div>
  <div class="rev-card" id="revCard"></div>

    <button class="again" id="revAgain"></button>
    <button class="know" id="revKnow"></button>
  </div>

<div id="mask" class="mask hide"></div>
<div id="toast"></div>

<script src="bank/data.js"></script>
<script src="js/variants-core.js"></script>
<script src="js/variants-math.js"></script>
<script src="js/variants-it.js"></script>
<script src="js/variants-english.js"></script>
<script src="js/variants-gt.js"></script>
<script>
(function () {
  "use strict";
  var DATA = window.DZ_DATA || null;
  var VAR = window.DZ_VARIANTS || {};
  var SUBJECTS = [
    { key: "math", name: "数学", ico: "数", c: "#007AFF", cbg: "rgba(0,122,255,.12)" },
    { key: "english", name: "英语", ico: "英", c: "#AF52DE", cbg: "rgba(175,82,222,.13)" },
    { key: "it", name: "信息技术", ico: "信", c: "#30B0C7", cbg: "rgba(48,176,199,.14)" },
    { key: "gt", name: "通用技术", ico: "通", c: "#34C759", cbg: "rgba(52,199,89,.14)" }
  ];
  var K = { q: "dz1.q", day: "dz1.day", set: "dz1.set", vr: "dz1.var", rec: "dz1.rec" };
  var DAY_TARGET = 20;

  var $ = function (s) { return document.querySelector(s); };
  function each(n, f) { for (var i = 0; i < n.length; i++) f(n[i], i); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function read(key, dflt) { try { var v = JSON.parse(localStorage.getItem(key)); return v && typeof v === "object" ? v : dflt; } catch (e) { return dflt; } }
  function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { toast("保存失败，可能是隐私模式"); } }

  /* ---------- SF 风图标 ---------- */
  var ICONS = {
    gear: '<path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.1 13.2a7.2 7.2 0 0 0 .05-1.2 7.2 7.2 0 0 0-.05-1.2l1.9-1.45-1.9-3.3-2.25.9a7.4 7.4 0 0 0-2.1-1.2L14.4 3h-4.8l-.35 2.75a7.4 7.4 0 0 0-2.1 1.2l-2.25-.9-1.9 3.3 1.9 1.45a7.2 7.2 0 0 0 0 2.4l-1.9 1.45 1.9 3.3 2.25-.9a7.4 7.4 0 0 0 2.1 1.2L9.6 21h4.8l.35-2.75a7.4 7.4 0 0 0 2.1-1.2l2.25.9 1.9-3.3-1.9-1.45Z"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    x: '<path d="M18 6L6 18M6 6l12 12"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/><path d="M4 19.5V21h16"/>',
    shuffle: '<path d="M3 7h3.5l9 10H19"/><path d="M16 14l3 3-3 3"/><path d="M3 17h3.5l2-2.2"/><path d="M14 8.2L15.5 7H19"/><path d="M16 4l3 3-3 3"/>',
    sparkles: '<path d="M12 3.5l1.7 4.6 4.6 1.7-4.6 1.7L12 16.1l-1.7-4.6L5.7 9.8l4.6-1.7L12 3.5Z"/><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z"/>',
    refresh: '<path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>',
    download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/>',
    upload: '<path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M4 3h16"/>',
    trash: '<path d="M4 6h16"/><path d="M9 6V4h6v2"/><path d="M6.5 6l1 14h9l1-14"/>',
    play: '<path d="M7 4.5l12 7.5-12 7.5V4.5Z"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h11l-2 3.5L16 11H5"/>'
  };
  function ic(name, cls) {
    var p = ICONS[name] || "";
    return '<svg class="ic ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + "</svg>";
  }

  var state = {
    q: read(K.q, {}),
    day: read(K.day, {}),
    set: read(K.set, { auto: true }),
    vr: read(K.vr, {}),
    rec: read(K.rec, {})
  };
  if (typeof state.set.auto !== "boolean") state.set.auto = true;
  function saveQ() { write(K.q, state.q); }
  function saveDay() { write(K.day, state.day); }
  function saveSet() { write(K.set, state.set); }
  function saveVar() { write(K.vr, state.vr); }
  function saveRec() { write(K.rec, state.rec); }

  function todayKey() {
    var d = new Date(), p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function today() { var k = todayKey(); state.day[k] = state.day[k] || { n: 0, ok: 0 }; return state.day[k]; }

  function bankOf(k) { return (DATA && DATA.bank && DATA.bank[k]) || []; }
  function notesOf(k) { return (DATA && DATA.notes && DATA.notes[k]) || []; }
  function reciteOf(k) { return (DATA && DATA.recite && DATA.recite[k]) || []; }
  function teachOf(k) { return (DATA && DATA.teach && DATA.teach[k]) || []; }
  function allQ() {
    var out = [];
    each(SUBJECTS, function (s) {
      each(bankOf(s.key), function (q, i) { q.__s = s.key; q.__id = s.key + "-" + i; out.push(q); });
    });
    return out;
  }
  function subjOf(k) { for (var i = 0; i < SUBJECTS.length; i++) if (SUBJECTS[i].key === k) return SUBJECTS[i]; return SUBJECTS[0]; }
  function stt(id) { return state.q[id] || null; }
  function isWrong(id) { var s = stt(id); return !!(s && s.n > 0 && s.ok === 0); }
  function hasVar(k) { return !!(VAR[k] && VAR[k].length); }
  function varLevel(k) { return (state.vr[k] && state.vr[k].level) || 1; }

  function show(id) {
    each(document.querySelectorAll(".screen"), function (el) { el.classList.add("hide"); });
    var el = $("#" + id); el.classList.remove("hide");
    el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
    window.scrollTo(0, 0);
    if (id === "home") renderHome();
  }
  var toastT;
  function toast(msg) {
    var el = $("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove("show"); }, 1900);
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function teachFor(k, topic) {
    var arr = teachOf(k);
    for (var i = 0; i < arr.length; i++) if (arr[i].topic === topic) return arr[i];
    return null;
  }

  /* ---------- 首页 ---------- */
  function renderHome() {
    if (!DATA) { $("#subjList").innerHTML = '<div style="padding:16px" class="footnote">题库没加载出来（bank/data.js 缺失），请重新发布网站。</div>'; return; }
    var t = today(), rate = t.n ? pct(t.ok, t.n) : null;
    var p = Math.min(100, Math.round(t.n / DAY_TARGET * 100));
    $("#tdN").textContent = t.n;
    $("#tdPct").textContent = p + "%";
    $("#tdRing").style.setProperty("--p", p);
    $("#tdRate").textContent = rate === null ? "—" : rate + "%";

    var done = 0, total = 0, wrong = 0, html = "";
    each(SUBJECTS, function (s) {
      var bank = bankOf(s.key), d = 0, okN = 0, wN = 0;
      each(bank, function (q, i) {
        var st = state.q[s.key + "-" + i];
        if (st && st.n > 0) { d++; if (st.ok === 1) okN++; else wN++; }
      });
      done += d; total += bank.length; wrong += wN;
      var varBtn = hasVar(s.key)
        ? '<button class="mini tint" data-var="' + s.key + '">变式 L' + varLevel(s.key) + '</button>'
        : '<button class="mini tint" data-smart="' + s.key + '">智能练</button>';
      html += '<div class="subj" data-key="' + s.key + '">'
        + '<span class="sicon" style="--c:' + s.c + ';--cbg:' + s.cbg + '">' + s.ico + '</span>'
        + '<div class="sinfo">'
        + '<div class="srow"><b>' + s.name + '</b><span class="cnt">' + d + " / " + bank.length + '</span></div>'
        + '<div class="srow small"><span>正确率 ' + (d ? pct(okN, d) : 0) + '% · 错题 ' + wN + '</span></div>'
        + '<div class="bar"><i style="width:' + (bank.length ? d / bank.length * 100 : 0) + '%"></i></div>'
        + '</div>'
        + '<div class="sbtns"><button class="mini" data-rev="' + s.key + '">背诵</button>' + varBtn + '</div>'
        + '</div>';
    });
    $("#subjList").innerHTML = html;
    $("#allDone").textContent = total ? "已练 " + done + " / " + total : "—";
    $("#wrongN").textContent = wrong;
  }

  /* ---------- 智能抽题 ---------- */
  function masteryMap(onlyKey) {
    var m = {};
    each(SUBJECTS, function (s) {
      if (onlyKey && s.key !== onlyKey) return;
      m[s.key] = {};
      each(bankOf(s.key), function (q, i) {
        var st = state.q[s.key + "-" + i];
        if (!st || !st.n) return;
        var rec = m[s.key][q.topic] || (m[s.key][q.topic] = { n: 0, ok: 0 });
        rec.n++; if (st.ok === 1) rec.ok++;
      });
    });
    return m;
  }
  function pickSmart(n, onlyKey) {
    var m = masteryMap(onlyKey);
    var pool = allQ().filter(function (q) { return !onlyKey || q.__s === onlyKey; });
    var items = pool.map(function (q) {
      var st = stt(q.__id);
      var w = (!st || !st.n) ? 2 : (st.ok === 0 ? 4 : 0.6);
      var rec = m[q.__s] && m[q.__s][q.topic];
      if (rec && rec.n >= 2) {
        var acc = rec.ok / rec.n;
        if (acc < 0.6) w *= 1.9; else if (acc < 0.8) w *= 1.3;
      }
      return { q: q, w: w };
    });
    var out = [];
    for (var k = 0; k < n && items.length; k++) {
      var sum = 0; each(items, function (it) { sum += it.w; });
      var r = Math.random() * sum, pick = 0;
      for (var i = 0; i < items.length; i++) { r -= items[i].w; if (r <= 0) { pick = i; break; } }
      out.push(items[pick].q);
      items.splice(pick, 1);
    }
    return out;
  }

  /* ---------- 变式生成 ---------- */
  var genSeq = 0;
  function genVariant(key, level) {
    var arr = VAR[key];
    if (!arr || !arr.length) return null;
    for (var tries = 0; tries < 12; tries++) {
      var t = arr[Math.floor(Math.random() * arr.length)];
      var lv = Math.max(t.min || 1, Math.min(t.max || 3, level));
      try {
        var q = t.gen(lv);
        if (q && q.options && q.options.length === 4 && q.answer) {
          q.__s = key; q.__id = "gen-" + (++genSeq); q.__gen = true;
          return q;
        }
      } catch (e) { /* 换模板再试 */ }
    }
    return null;
  }

  /* ---------- 刷题 ---------- */
  var S = null;

  function start(mode, key) {
    var all = allQ(), list = [], title = "";
    if (mode === "wrong") {
      list = all.filter(function (q) { return isWrong(q.__id); });
      if (!list.length) { toast("还没有错题，先练几道吧"); return; }
      title = "错题重练";
    } else if (mode === "smart") {
      list = pickSmart(20, key || null);
      title = key ? "智能练" : "智能 20 题";
    } else if (mode === "var") {
      if (!hasVar(key)) { start("smart", key); toast("这一科没有变式题，改智能练"); return; }
      var q0 = genVariant(key, varLevel(key));
      if (!q0) { toast("变式题生成失败，先用普通题"); start("seq", key); return; }
      S = { gen: true, key: key, list: [q0], pos: 0, ans: {}, right: 0, wrong: 0, streak: 0, level: varLevel(key), title: "变式" };
      show("quiz"); renderQ(); return;
    } else {
      list = all.filter(function (q) { return q.__s === key; });
      title = "顺序练";
      if (list.length) {
        var startIdx = 0;
        for (var i = 0; i < list.length; i++) { if (!stt(list[i].__id)) { startIdx = i; break; } }
        list = list.slice(startIdx).concat(list.slice(0, startIdx));
      }
    }
    if (!list.length) { toast("这一科还没有题目"); return; }
    S = { mode: mode, key: key, list: list, pos: 0, ans: {}, right: 0, wrong: 0, title: title, done: false, gen: false };
    show("quiz");
    renderQ();
  }

  function renderQ() {
    var q = S.list[S.pos];
    var s = subjOf(q.__s);
    var chosen = S.ans[q.__id];
    var answered = chosen !== undefined;

    $("#qSubj").textContent = S.mode === "smart" ? (S.key ? s.name + " · 智能" : "综合") : (S.gen ? s.name + " · 变式" : s.name);
    if (S.gen) {
      $("#qPos").textContent = "第 " + (S.pos + 1) + " 题";
      $("#qLv").classList.remove("hide");
      $("#qLv").textContent = "L" + S.level;
      $("#qLv").className = "nav-cap" + (S.level >= 2 ? " orange" : "");
      $("#qHint").textContent = "答对 2 题升一档 · 答错降一档 · 左右滑/按 A-D";
    } else {
      $("#qPos").textContent = (S.pos + 1) + " / " + S.list.length;
      $("#qLv").classList.add("hide");
      $("#qHint").textContent = "左右滑动切题 · 电脑上按 A/B/C/D 选答案";
    }
    $("#qMode").textContent = S.title;
    $("#qMode").className = "nav-cap gray";
    $("#qBar").style.width = S.gen ? "100%" : ((S.pos + 1) / S.list.length * 100) + "%";
    $("#btnPrev").disabled = S.pos === 0;
    $("#btnPrev").innerHTML = ic("back") + "上一题";
    $("#btnNext").innerHTML = (S.gen ? "换一题" : (S.pos === S.list.length - 1 ? "看结果" : "下一题")) + ic("chevron");

    var h = '<div class="qcard">';
    h += '<div class="tags"><span class="tag blue">' + esc(q.topic || "综合") + '</span><span class="tag">' + (q.type === "judge" ? "判断" : "单选") + '</span></div>';
    if (q.passage) h += '<div class="passage">' + esc(q.passage) + '</div>';
    h += '<div class="stem">' + esc(q.stem) + '</div>';

    if (q.type === "judge") {
      h += '<div class="opts judge">';
      each(["对", "错"], function (v) { h += optHtml(v, v, answered, chosen, q.answer); });
      h += '</div>';
    } else {
      h += '<div class="opts">';
      each(q.options || [], function (v, i) { h += optHtml("ABCD"[i], v, answered, chosen, q.answer); });
      h += '</div>';
    }
    h += '</div>';

    if (answered) {
      var ok = chosen === q.answer;
      h += '<div class="fb ' + (ok ? "ok" : "bad") + '">'
        + '<div class="fb-head">' + ic(ok ? "check" : "x") + (ok ? "答对了" : "答错了")
        + ' <b>正确答案：' + esc(q.answer) + '</b></div>'
        + '<span class="ex">' + esc(q.explain || "") + '</span></div>';
      if (!ok) {
        var tt = teachFor(q.__s, q.topic);
        if (tt) {
          h += '<details class="teach" open><summary>'
            + ic("book") + '考点讲解<span class="cap">' + esc(q.topic) + '</span>'
            + ic("chevron", "card-chev") + '</summary>'
            + '<div class="body">'
            + (tt.point ? '<div class="blk"><div class="lb">这个考点怎么考</div><p>' + esc(tt.point) + '</p></div>' : '')
            + (tt.must ? '<div class="blk must"><div class="lb">必背</div><p class="must">' + esc(tt.must) + '</p></div>' : '')
            + (tt.mistake ? '<div class="blk mis"><div class="lb">常见错法</div><p class="mis">' + esc(tt.mistake) + '</p></div>' : '')
            + '</div></details>';
        }
      }
    }
    $("#qBody").innerHTML = h;

    each(document.querySelectorAll("#qBody .opt"), function (btn) {
      if (!answered) btn.addEventListener("click", function () { answer(btn.dataset.v); });
    });
    window.scrollTo(0, 0);
  }

  function optHtml(ltr, text, answered, chosen, correct) {
    var cls = "opt";
    if (answered) {
      cls += " locked";
      if (ltr === correct) cls += " right";
      else if (ltr === chosen) cls += " wrong";
    }
    var mark = answered ? '<span class="mark">' + (ltr === correct ? ic("check") : (ltr === chosen ? ic("x") : "")) + "</span>" : "";
    return '<button class="' + cls + '" data-v="' + esc(ltr) + '"><span class="ltr">' + ltr + '</span><span class="txt">' + esc(text) + "</span>" + mark + "</button>";
  }

  function answer(v) {
    var q = S.list[S.pos];
    if (S.ans[q.__id] !== undefined) return;
    S.ans[q.__id] = v;
    var ok = v === q.answer;
    var t = today(); t.n++; if (ok) t.ok++;
    saveDay();

    if (S.gen) {
      if (ok) {
        S.right++; S.streak++;
        if (S.streak >= 2) { S.level = Math.min(3, S.level + 1); S.streak = 0; }
      } else {
        S.wrong++; S.streak = 0;
        S.level = Math.max(1, S.level - 1);
      }
      state.vr[S.key] = { level: S.level };
      saveVar();
    } else {
      var st = state.q[q.__id] || { n: 0, ok: 1 };
      st.n++; st.ok = ok ? 1 : 0;
      state.q[q.__id] = st;
      saveQ();
      if (ok) S.right++; else S.wrong++;
    }
    renderQ();
    if (ok && state.set.auto) {
      var pos0 = S.pos;
      setTimeout(function () {
        if (!S || S.done || S.pos !== pos0) return;
        next();
      }, 750);
    }
  }

  function next() {
    if (!S) return;
    if (S.gen) {
      if (S.pos < S.list.length - 1) { S.pos++; renderQ(); return; }
      var nq = genVariant(S.key, S.level);
      if (!nq) { toast("生成失败，稍后再试"); return; }
      S.list.push(nq); S.pos++; renderQ(); return;
    }
    if (S.pos >= S.list.length - 1) { finish(); return; }
    S.pos++;
    renderQ();
  }
  function prev() { if (!S || S.pos === 0) return; S.pos--; renderQ(); }

  function finish() {
    if (!S || S.done) return;
    S.done = true;
    var total = S.list.length, right = S.right, wrong = S.wrong;
    var untouched = total - right - wrong;
    var score = total ? Math.round(right / total * 100) : 0;
    var isTest = (S.mode === "smart");
    var h = '<div class="sheet"><div class="grabber"></div><div class="res">'
      + '<div class="big">' + right + '<em>/ ' + total + '</em></div>'
      + '<p>' + (isTest ? "得分 " + score + " 分" : "本轮答对 " + right + " 题") + (untouched ? "（还有 " + untouched + " 题没答）" : "") + '</p>'
      + '<div class="acts">'
      + '<button id="resAgain" class="primary">' + (isTest ? "再来一组" : (S.mode === "wrong" ? "再练错题" : "再练一科")) + '</button>'
      + '<button id="resHome" class="plain">回首页</button>'
      + '</div></div></div>';
    openSheet(h);
    $("#resHome").onclick = function () { closeSheet(); show("home"); };
    $("#resAgain").onclick = function () {
      closeSheet();
      if (isTest) start("smart", S.key || null);
      else if (S.mode === "wrong") start("wrong");
      else start("seq", S.key);
    };
  }

  /* ---------- 背诵 ---------- */
  var R = null;
  function reciteUnits(k) {
    var arr = [];
    var nts = notesOf(k);
    if (nts.length) arr.push({ name: "速记卡", items: nts.map(function (n) { return { q: n.title, a: n.content }; }) });
    each(reciteOf(k), function (u) { arr.push({ name: u.name, items: u.items || [] }); });
    return arr;
  }
  function recKey(k, ui, ii) { return k + "|" + ui + "|" + ii; }
  function recIsKnown(k, ui, ii) { return state.rec[recKey(k, ui, ii)] === 1; }

  function showRecite(k) { R = { key: k, unit: 0, pos: 0, reveal: false }; show("recite"); renderRecite(); }
  function renderRecite() {
    var units = reciteUnits(R.key);
    var s = subjOf(R.key);
    $("#recSubjSub").textContent = s.name + " · 先看提示，想一遍再翻答案";
    var tabs = "";
    each(SUBJECTS, function (x) {
      tabs += '<button class="' + (x.key === R.key ? "on" : "") + '" data-rk="' + x.key + '">' + x.name + '</button>';
    });
    $("#revTabs").innerHTML = tabs;
    each(document.querySelectorAll("#revTabs button"), function (b) {
      b.onclick = function () { R = { key: b.getAttribute("data-rk"), unit: 0, pos: 0, reveal: false }; renderRecite(); };
    });

    if (!units.length) {
      $("#revUnits").innerHTML = "";
      $("#revCard").innerHTML = '<div class="rev-hint">这一科还没写背诵卡。</div>';
      $("#revProg").textContent = "—";
      return;
    }
    var uhtml = "";
    each(units, function (u, i) {
      var known = 0;
      each(u.items, function (it, j) { if (recIsKnown(R.key, i, j)) known++; });
      uhtml += '<button class="rev-unit ' + (i === R.unit ? "on" : "") + '" data-ru="' + i + '">' + esc(u.name)
        + '<em>' + known + "/" + u.items.length + '</em></button>';
    });
    $("#revUnits").innerHTML = uhtml;
    each(document.querySelectorAll("#revUnits .rev-unit"), function (b) {
      b.onclick = function () { R.unit = Number(b.getAttribute("data-ru")); R.pos = 0; R.reveal = false; renderRecite(); };
    });

    var u = units[R.unit];
    if (R.pos >= u.items.length) R.pos = 0;
    var item = u.items[R.pos] || { q: "", a: "" };
    var knownN = 0;
    each(u.items, function (it, j) { if (recIsKnown(R.key, R.unit, j)) knownN++; });
    $("#revProg").textContent = "第 " + (R.pos + 1) + " / " + u.items.length + " 条 · 已记 " + knownN;
    var h = '<div class="rev-q">' + esc(item.q) + '</div>';
    if (R.reveal) h += '<div class="rev-a">' + esc(item.a) + '</div>';
    else h += '<div class="rev-hint"><span class="dot"></span>点一下卡片看答案</div>';
    $("#revCard").innerHTML = h;
    $("#revCard").onclick = function () { R.reveal = !R.reveal; renderRecite(); };
    $("#revAgain").innerHTML = ic("refresh") + "还没记住";
    $("#revKnow").innerHTML = ic("check") + "记住了";
  }
  function recMark(known) {
    var units = reciteUnits(R.key), u = units[R.unit];
    if (!u) return;
    state.rec[recKey(R.key, R.unit, R.pos)] = known ? 1 : 0;
    saveRec();
    if (R.pos >= u.items.length - 1) {
      var knownN = 0;
      each(u.items, function (it, j) { if (recIsKnown(R.key, R.unit, j)) knownN++; });
      showReciteResult(u.name, knownN, u.items.length);
      return;
    }
    R.pos++; R.reveal = false; renderRecite();
  }
  function showReciteResult(name, known, total) {
    var h = '<div class="sheet"><div class="grabber"></div><div class="res">'
      + '<div class="big">' + known + '<em>/ ' + total + '</em></div>'
      + '<p>「' + esc(name) + '」记住了 ' + known + ' 条，没记住的下一轮再背一遍。</p>'
      + '<div class="acts">'
      + '<button id="resAgain" class="primary">再背一轮</button>'
      + '<button id="resHome" class="plain">回首页</button>'
      + '</div></div></div>';
    openSheet(h);
    $("#resHome").onclick = function () { closeSheet(); show("home"); };
    $("#resAgain").onclick = function () { closeSheet(); R.pos = 0; R.reveal = false; renderRecite(); };
  }

  /* ---------- 设置 ---------- */
  function openSheet(html) {
    $("#mask").classList.remove("hide"); $("#mask").innerHTML = html;
    $("#mask").onclick = function (e) { if (e.target === $("#mask")) closeSheet(); };
  }
  function closeSheet() { $("#mask").classList.add("hide"); $("#mask").innerHTML = ""; }

  function openSet() {
    var reciteCount = DATA ? Object.keys(DATA.recite || {}).reduce(function (a, k) {
      return a + (DATA.recite[k] || []).reduce(function (b, u) { return b + (u.items || []).length; }, 0);
    }, 0) : 0;
    var varCount = 0; each(Object.keys(VAR), function (k) { varCount += (VAR[k] || []).length; });
    var h = '<div class="sheet"><div class="grabber"></div><h2>设置</h2><p class="sub">进度只存在这台设备</p>'
      + '<div class="set-list">'
      + '<div class="set-row"><span class="txt">答对自动跳下一题<small>答错会停住，方便看解析和考点讲解</small></span>'
      + '<label class="sw"><input type="checkbox" id="swAuto" ' + (state.set.auto ? "checked" : "") + '><i></i></label></div>'
      + '<button class="act-row" id="btnBk">' + ic("download") + '备份进度' + ic("chevron", "chev") + '</button>'
      + '<button class="act-row" id="btnRs">' + ic("upload") + '恢复进度' + ic("chevron", "chev") + '</button>'
      + '<button class="act-row danger" id="btnClr">' + ic("trash") + '清空进度</button>'
      + '</div>'
      + '<input type="file" id="fileIn" accept=".json,application/json" class="hide">'
      + '<p class="about">题库：' + (DATA ? Object.keys(DATA.counts).length : 0) + ' 科 / '
      + (DATA ? Object.keys(DATA.counts).reduce(function (a, k) { return a + DATA.counts[k]; }, 0) : 0) + ' 题'
      + '；背诵 ' + reciteCount + ' 条；变式 ' + varCount + ' 个模板'
      + (DATA && DATA.built ? '<br>构建于 ' + esc(DATA.built) : '')
      + '<br>题目为自编练习，不是官方真题。以四川省教育考试院 2027 年单招文件为准。记得隔几天备份一次。</p>'
      + '</div>';
    openSheet(h);
    $("#swAuto").onchange = function () { state.set.auto = this.checked; saveSet(); toast(this.checked ? "已开启自动跳题" : "已关闭自动跳题"); };
    $("#btnBk").onclick = backup;
    $("#btnRs").onclick = function () { $("#fileIn").click(); };
    $("#fileIn").onchange = restore;
    $("#btnClr").onclick = function () {
      if (!confirm("清空本机所有做题/背诵进度？题库不受影响。")) return;
      state.q = {}; state.day = {}; state.rec = {}; saveQ(); saveDay(); saveRec(); renderHome(); closeSheet(); toast("已清空进度");
    };
  }
  function backup() {
    var blob = new Blob([JSON.stringify({ v: 2, ts: new Date().toISOString(), q: state.q, day: state.day, set: state.set, vr: state.vr, rec: state.rec })], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "媛媛刷题进度_" + todayKey() + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast("已导出备份文件");
  }
  function restore(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || typeof d.q !== "object") throw new Error("格式不对");
        if (!confirm("用这个备份覆盖本机进度？")) return;
        state.q = d.q || {}; state.day = d.day || {};
        if (d.set && typeof d.set.auto === "boolean") state.set = d.set;
        if (d.vr && typeof d.vr === "object") state.vr = d.vr;
        if (d.rec && typeof d.rec === "object") state.rec = d.rec;
        saveQ(); saveDay(); saveSet(); saveVar(); saveRec(); renderHome(); closeSheet(); toast("已恢复进度");
      } catch (err) { toast("恢复失败：文件格式不对"); }
    };
    r.readAsText(f);
  }

  /* ---------- 事件 ---------- */
  function bind() {
    document.querySelector("#btnSet").innerHTML = ic("gear");
    document.querySelector("#btnQuit").innerHTML = ic("back") + "返回";
    document.querySelector("#btnRecBack").innerHTML = ic("back") + "返回";
    document.querySelector("#btnWrong").innerHTML = ic("flag") + "错题重练 <em id=\"wrongN\">0</em>";
    document.querySelector("#btnSmart").innerHTML = ic("sparkles") + "智能 20 题";
    document.querySelector("#btnPrev").innerHTML = ic("back") + "上一题";
    document.querySelector("#btnNext").innerHTML = "下一题" + ic("chevron");

    $("#btnSet").onclick = openSet;
    $("#btnRecBack").onclick = function () { show("home"); };
    $("#btnQuit").onclick = function () {
      if (S && !S.gen && S.right + S.wrong > 0) { if (!confirm("退出本轮？已答的题会保存。")) return; }
      S = null; show("home");
    };
    $("#btnPrev").onclick = prev;
    $("#btnNext").onclick = next;
    $("#btnWrong").onclick = function () { start("wrong"); };
    $("#btnSmart").onclick = function () { start("smart"); };
    $("#revAgain").onclick = function () { recMark(false); };
    $("#revKnow").onclick = function () { recMark(true); };
    $("#revReset").onclick = function () {
      if (!confirm("重置本单元的「已记住」标记？")) return;
      var units = reciteUnits(R.key), u = units[R.unit]; if (!u) return;
      each(u.items, function (it, j) { delete state.rec[recKey(R.key, R.unit, j)]; });
      saveRec(); renderRecite(); toast("已重置本单元");
    };

    $("#subjList").addEventListener("click", function (e) {
      var rev = e.target.closest("[data-rev]");
      if (rev) { showRecite(rev.getAttribute("data-rev")); return; }
      var vb = e.target.closest("[data-var]");
      if (vb) { start("var", vb.getAttribute("data-var")); return; }
      var sb = e.target.closest("[data-smart]");
      if (sb) { start("smart", sb.getAttribute("data-smart")); return; }
      var card = e.target.closest(".subj");
      if (card) start("seq", card.getAttribute("data-key"));
    });

    document.addEventListener("keydown", function (e) {
      if ($("#quiz").classList.contains("hide")) return;
      var k = e.key;
      if (k === "ArrowRight" || k === " " || k === "Enter") { e.preventDefault(); next(); return; }
      if (k === "ArrowLeft") { e.preventDefault(); prev(); return; }
      var map = { a: "A", b: "B", c: "C", d: "D", "1": "A", "2": "B", "3": "C", "4": "D" };
      var v = map[String(k).toLowerCase()];
      if (v) answer(v);
    });

    var tx = 0, ty = 0;
    $("#quiz").addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    $("#quiz").addEventListener("touchend", function (e) {
      var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 55 && Math.abs(dy) < 45) { if (dx < 0) next(); else prev(); }
    }, { passive: true });
  }

  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

  bind();
  if (!DATA) { $("#subjList").innerHTML = '<div style="padding:16px" class="footnote">题库没加载出来，请确认 bank/data.js 与首页在同一目录。</div>'; }
  renderHome();

  window.__DZ_DEBUG = { getS: function () { return S; }, getR: function () { return R; }, state: state };
})();
</script>
</body>
</html>
