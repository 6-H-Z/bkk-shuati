<script>
const CARDS = [
  {id:1, g:"腐蚀与防腐方法", q:"防腐蚀方法分为哪几类？", a:"分为介质处理、覆盖层、电化学保护和添加缓蚀剂四类。缓蚀剂保护是在腐蚀环境中，通过添加少量能阻止或减缓金属腐蚀速度的物质以保护金属的方法。", k:"介质处理、覆盖层、电化学保护、添加缓蚀剂", s:"P143"},
  {id:2, g:"腐蚀与防腐方法", q:"介质处理包括哪些内容？教材举了哪两个例子？", a:"包括去除介质中促进腐蚀的有害成分、调节介质的pH值及改变介质的湿度等。例如：锅炉给水的除氧；在管道输送原油前，脱出原油中水及其他腐蚀性成分。", k:"除有害成分、调pH值、改湿度", s:"P143"},
  {id:3, g:"腐蚀与防腐方法", q:"金属表面覆盖层有哪几种形式？涂料涂层有什么特点和适用场合？", a:"覆盖层是在金属表面喷、衬、渗、镀、涂一层耐蚀性较好的金属或非金属物质，使被保护金属表面与介质隔离，从而降低金属被腐蚀的速度；设备及管道覆盖层主要有涂料涂层、金属涂层、衬里三种形式。涂料涂层是以各种非金属涂料涂覆形成的涂层，如以环氧树脂类涂料涂覆形成的环氧涂层、以聚氨酯类涂料涂覆形成的聚氨酯涂层等；涂料涂层一般比较薄，常用于设备及架空管道的防腐。", k:"涂料涂层、金属涂层、衬里", s:"P143"},
  {id:4, g:"腐蚀与防腐方法", q:"金属涂层是如何形成的？常用于哪些部位的防腐？", a:"利用某种热源，如电弧、等离子弧、燃烧火焰等将粉末状或丝状的金属涂层材料加热到熔融或半熔融状态，然后借助焰流本身的动力或外加的高速气流雾化，并以一定的速度喷射到经过预处理的基体材料表面，与基体材料结合而形成具有各种功能的表面金属覆盖层。金属涂层常用于设备或储罐的外壁防腐。", k:"", s:"P143"},
  {id:5, g:"腐蚀与防腐方法", q:"衬里防腐分哪两类？金属衬里与非金属衬里各包括什么？", a:"衬里是一种综合利用不同材料特性、具有较长使用寿命的防腐方法，根据不同介质条件，在金属设备及管道内衬金属或非金属材料，将其金属表面与工艺介质隔开，以防止金属的腐蚀。金属衬里用于温度、压力较高的场合，可衬耐蚀金属，如不锈钢、钛、铅等；非金属衬里包括块材衬里、纤维增强塑料衬里、橡胶衬里、塑料衬里、玻璃鳞片衬里、喷涂聚脲衬里、氯丁胶乳水泥砂浆衬里等。", k:"块材、纤维增强塑料、橡胶、塑料、玻璃鳞片、喷涂聚脲、氯丁胶乳水泥砂浆", s:"P143"},
  {id:6, g:"腐蚀与防腐方法", q:"电化学保护分哪两种？阳极保护如何实现？各适用于什么设备和管道？", a:"分为阳极保护和阴极保护两种形式。阳极保护是把被保护金属与外加电源正极相连接，或用强氧化剂处理，使它作为电解池的阳极，进行阳极极化形成一层致密的氧化膜，从而起到保护作用。硫酸设备等化工设备和设施可采用阳极保护技术；埋地钢质管道、管网以及钢制储罐常采用阴极保护技术。", k:"", s:"P143"},
  {id:7, g:"表面处理", q:"什么是表面处理？表面处理的方法有哪几类？", a:"表面处理是指在涂装前，除去工件表面附着物、生成的氧化物以及提高表面粗糙度，提高工件表面与涂层的附着力或赋予表面以一定的耐蚀性能的过程。方法有清洗（脱脂处理）、工具除锈、喷（抛）射除锈、化学除锈等。", k:"清洗、工具除锈、喷（抛）射除锈、化学除锈", s:"P144"},
  {id:8, g:"表面处理", q:"脱脂处理包括哪些方式？手工除锈与动力工具除锈各用什么工具？工具处理分为哪两个质量等级？", a:"脱脂处理包括浸泡脱脂、喷淋脱脂。工具除锈包括手工除锈和动力工具除锈两种：手工除锈工具包括钢丝刷、粗砂纸、铲刀、刮刀或类似的手工工具；动力除锈工具包括旋转钢丝轮、电动砂轮或除锈机等。工具处理分为St2级、St3级两个质量等级。", k:"浸泡、喷淋；St2级、St3级", s:"P144"},
  {id:9, g:"表面处理", q:"喷射除锈常用磨料有哪些？敞开式干喷射对压缩空气和金属表面温度有什么要求？", a:"常用的磨料有铸钢丸、铸铁丸、铸钢砂、铸铁砂、石英砂及钢丝段等。敞开式干喷射是用压缩空气通过喷射清洁干燥的磨料进行除锈，所用的压缩空气应是无油、干燥的，且金属表面的温度应高于露点温度3℃以上。", k:"无油干燥、高于露点3℃以上", s:"P144"},
  {id:10, g:"表面处理", q:"喷射处理分为哪几个质量等级？", a:"喷射处理分为Sa1级、Sa2级、Sa2.5级、Sa3级四个质量等级。", k:"Sa1、Sa2、Sa2.5、Sa3", s:"P145"},
  {id:11, g:"表面处理", q:"酸洗除锈的施工要点有哪些？", a:"酸洗处理前，金属表面应采用工具或喷射除锈除掉表面上大部分氧化皮、锈和旧涂层，以缩短酸洗除锈时间；将金属表面浸入常温酸洗液中，直至氧化皮和锈全部除掉，酸洗液中应加入足够的缓蚀剂，以减少对金属的腐蚀；金属表面达到要求后，用淡水充分冲洗干净，然后分别浸入磷化液和钝化液进行磷化和钝化处理；酸洗液中溶入铁的含量不超过10%；酸洗后的金属表面应用干净的高压空气吹干水分，且不应码垛堆放。", k:"除锈→酸洗→淡水冲洗→磷化钝化→吹干、不码垛", s:"P145"},
  {id:12, g:"表面处理", q:"焊缝表面处理有哪些要求？", a:"对接焊缝表面应平整，并应无气孔、焊瘤和夹渣，焊缝高度应小于或等于2mm，并平滑过渡；设备转角和接管部位的焊缝应饱满、圆滑，不得有毛刺，应将棱角打磨成钝角并形成圆弧过渡；角焊缝的圆角部位、焊角高度、突出角的焊接圆弧半径以及内角的焊接圆弧半径应满足要求；切除组装卡具时，不得损伤基体母材。", k:"焊缝高度≤2mm、平滑过渡", s:"P145"},
  {id:13, g:"涂装", q:"涂装方法有哪些？现场常用的有哪几种？喷涂方法有哪些？", a:"涂装方法有手工刷涂、喷涂、电泳涂装、自泳涂装、浸涂、淋涂、搓涂、帘涂装、辊涂等，其中手工刷涂、辊涂、喷涂是现场常用的涂装方法。喷涂方法有空气喷涂、高压无气喷涂、加热喷涂、静电喷涂、粉末静电喷涂、火焰喷涂、自动喷涂。", k:"手工刷涂、辊涂、喷涂（现场常用）", s:"P145"},
  {id:14, g:"涂装", q:"涂装工艺包括哪些工序？涂料进场时供方应提供哪些文件？", a:"涂装工艺是涂装作业中涂料涂覆的整个工艺过程，包括工件刮腻子、涂料的调配、工件的输送、各种方法的涂覆、干燥或固化、打磨等工序。涂料进场时，供方除提供产品质量证明文件外，尚应提供涂装的基体表面处理和施工工艺等要求；产品质量证明文件应包括产品质量合格证、质量技术指标及检测方法、材料检测报告或技术鉴定文件。", k:"刮腻子、调配、输送、涂覆、干燥或固化、打磨", s:"P145"},
  {id:15, g:"涂装", q:"涂装施工对环境温度和相对湿度有什么要求？钢结构用水性防腐涂料分为哪几层？", a:"施工环境温度宜为5~30℃，相对湿度不大于85%，或涂覆的基体表面温度比露点温度高3℃。钢结构用水性防腐涂料可分为底漆、中间漆和面漆。", k:"5~30℃、85%、比露点高3℃；底漆、中间漆、面漆", s:"P145"},
  {id:16, g:"衬里", q:"水泥砂浆衬里可采用哪两种方式？现场施工管段在衬里施工前应完成哪些工序？", a:"水泥砂浆衬里可采用单根预制或管道整体涂敷方式；现场施工的管段中，钢管规格应相同，不同口径的管段应分别组对、分段进行施工。现场施工管段在水泥砂浆衬里施工前应完成清扫、组对、焊接、无损检测、强度试验、严密性试验、外防腐层补口补伤并验收合格。", k:"清扫、组对、焊接、无损检测、强度试验、严密性试验、补口补伤、验收", s:"P145"},
  {id:17, g:"衬里", q:"橡胶衬里分为哪几种？各自的施工要点是什么？", a:"加热硫化橡胶衬里：加热工艺、硫化温度及硫化时间应符合要求。自然硫化橡胶衬里：胶板衬砌时应用专用压滚或刮板依次压合，排净粘结面间的空气，不得漏压；压滚或刮板的用力程度应以胶板压合面见到压（刮）痕为限，前后两次滚压应有一定尺寸的重叠。预硫化橡胶衬里：胶板下料尺寸应合理、准确，应减少贴衬应力，形状复杂的工件应制作样板，并应按样板下料。", k:"加热硫化、自然硫化、预硫化", s:"P146"},
  {id:18, g:"衬里", q:"块材衬里的块材品种有哪些？接管部位衬管与本体衬砌的先后顺序如何？块材衬里工程包括哪些衬里层？", a:"块材的品种包括耐酸砖、耐酸耐温砖、铸石板、防腐蚀炭砖。设备接管部位衬管的施工，应在设备本体衬砌前进行。块材衬里工程应包括：水玻璃胶泥衬砌块材的设备、管道及管件的衬里层；树脂胶泥衬砌块材的设备、管道及管件的衬里层。", k:"耐酸砖、耐酸耐温砖、铸石板、防腐蚀炭砖", s:"P146"},
  {id:19, g:"绝热层施工", q:"绝热层在什么情况下应分两层或多层逐层施工？硬质或半硬质绝热制品的拼缝宽度限值是多少？", a:"当采用一种绝热制品，保温层厚度大于或等于100mm，保冷层厚度大于或等于80mm时，应分为两层或多层逐层施工，各层的厚度宜接近；采用两种或多种绝热材料复合结构的绝热层时，每种材料的厚度必须符合设计文件的规定。硬质或半硬质绝热制品的拼缝宽度，当作为保温层时不应大于5mm，当作为保冷层时不应大于2mm。", k:"保温≥100mm、保冷≥80mm分层；拼缝保温≤5mm、保冷≤2mm", s:"P146"},
  {id:20, g:"绝热层施工", q:"绝热层接缝的错缝、压缝与纵向接缝位置有什么要求？各层表面如何做严缝处理？", a:"绝热层施工时，同层应错缝，上下层应压缝，其搭接的长度不宜小于100mm。水平管道的纵向接缝位置，不得布置在管道垂直中心线45°范围内；当采用大管径的多块硬质成型绝热制品时，绝热层的纵向接缝位置可不受此限制，但应偏离管道垂直中心线位置。绝热层各层表面均应做严缝处理：干拼缝应采用性能相近的矿物棉填塞严密，填缝前应清除缝内杂物；湿砌灰浆胶泥应采用与砌体材质相同的材料拼砌，灰缝应饱满。", k:"同层错缝、上下层压缝、搭接≥100mm", s:"P146"},
  {id:21, g:"绝热层施工", q:"哪些部位应留设伸缩缝？", a:"设备或管道采用硬质绝热制品时，应留设伸缩缝；两固定管架间水平管道绝热层的伸缩缝，至少应留设一道；立式设备及垂直管道，应在支承件、法兰下面留设伸缩缝；弯头两端的直管段上，应各留一道伸缩缝，当两弯头之间的间距较小时，其直管段上的伸缩缝可根据介质温度确定仅留一道或不留设伸缩缝；球形容器的伸缩缝，必须按设计规定留设。", k:"硬质制品必留、固定管架间≥一道、支承件法兰下、弯头两端各一道、球罐按设计", s:"P146"},
  {id:22, g:"绝热层施工", q:"伸缩缝的留设宽度是多少？保温层与保冷层的伸缩缝各如何处理？", a:"伸缩缝留设的宽度，设备宜为25mm，管道宜为20mm；浇注或喷涂的绝热层可用嵌条留设。保温层的伸缩缝，应采用矿物纤维毡条、绳等填塞严密，并应捆扎固定，高温设备及管道保温层的伸缩缝外，应再进行保温。保冷层的伸缩缝，应采用软质绝热制品填塞严密或挤入发泡型胶粘剂，外面应用50mm宽的不干性胶带粘贴密封，保冷层的伸缩缝外应再进行保冷。", k:"设备25mm、管道20mm；保温再保温、保冷再保冷", s:"P147"},
  {id:23, g:"绝热层施工", q:"多层绝热层的伸缩缝应如何留设？", a:"多层绝热层伸缩缝的留设：中、低温保温层的各层伸缩缝，可不错开；保冷层及高温保温层的各层伸缩缝，必须错开，错开距离应大于100mm。", k:"中低温可不错开、保冷与高温必错开>100mm", s:"P147"},
  {id:24, g:"绝热层施工", q:"哪些情况下必须在膨胀移动方向的另一侧留有膨胀间隙？", a:"①填料式补偿器和波形补偿器；②当滑动支座高度小于绝热层厚度时；③相邻管道的绝热结构之间；④绝热结构与墙、梁、栏杆、平台、支撑等固定构件和管道所通过的孔洞之间。", k:"补偿器、滑动支座、相邻管道、固定构件与孔洞", s:"P147"},
  {id:25, g:"绝热层施工", q:"保温设备与保冷设备管道上的附件各有什么要求？设备铭牌与保温层、保冷层的关系如何？", a:"保温设备及管道上的裙座、支座、吊耳、仪表管座、支吊架等附件，应进行保温，当设计无规定时，可不必保温。保冷设备及管道上的上述附件，必须进行保冷，其保冷层长度不得小于保冷层厚度的4倍或敷设至垫块处，保冷层厚度应为邻近保冷层厚度的1/2，但不得小于40mm；设备裙座里外均应进行保冷。施工后的保温层不得覆盖设备铭牌，当保温层厚度高于设备铭牌时，可将铭牌周围的保温层切割成喇叭形开口，开口处应规整，并应设置密封的防雨水盖；施工后的保冷层应将设备铭牌处覆盖，设备铭牌应粘贴在保冷系统的外表面，粘贴铭牌时不得刺穿防潮层。", k:"保冷附件：长度≥4倍、厚度取1/2且≥40mm、裙座里外均保冷", s:"P147"},
  {id:26, g:"绝热层施工", q:"捆扎法施工的捆扎间距是多少？对捆扎件数量和捆扎方式有什么规定？", a:"捆扎间距：对硬质绝热制品不应大于400mm；对半硬质绝热制品不应大于300mm；对软质绝热制品宜为200mm。每块绝热制品上的捆扎件不得少于两道；对有振动的部位应加强捆扎。不得采用螺旋式缠绕捆扎。双层或多层绝热层的绝热制品，应逐层捆扎，并应对各层表面进行找平和严缝处理。", k:"硬质≤400mm、半硬质≤300mm、软质200mm；每块≥两道、禁螺旋缠绕", s:"P147"},
  {id:27, g:"绝热层施工", q:"设备绝热层施工时，立式设备、垂直管道与卧式设备在拼装方向和捆扎材料上有什么不同？", a:"立式设备或垂直管道的绝热层采用硬质、半硬质绝热制品施工时，应从支承件开始，自下而上拼装；保温应采用镀锌铁丝或包装钢带进行环向捆扎，保冷应采用不锈钢丝或不锈钢带进行环向捆扎。当卧式设备有托架时，绝热层应从托架开始拼装，保温宜采用镀锌铁丝网状捆扎，保冷宜采用不锈钢带环向或纵向捆扎。", k:"保温用镀锌铁丝（网）、保冷用不锈钢丝（带）", s:"P148"},
  {id:28, g:"绝热层施工", q:"蒸汽伴热管采用软质绝热制品保温、电伴热管采用硬质绝热制品保温时各应怎么做？", a:"当蒸汽伴热管采用软质绝热制品保温时，应先采用镀锌铁丝网或V形金属件伴热罩将伴热管包裹在主管上并扎紧，不得将加热空间堵塞，然后再进行保温。当电伴热管采用硬质绝热制品保温时，可根据伴热管的多少，现场适当放大制品规格进行保温。", k:"", s:"P148"},
  {id:29, g:"防潮层施工", q:"防潮层施工的一般要求有哪些？", a:"室外施工不宜在雨雪天或阳光暴晒中进行，施工时的环境温度应符合设计文件和产品说明书的规定；防潮层外不得设置钢丝、钢带等硬质捆扎件；设备筒体、管道上的防潮层应连续施工，不得有断开或断层等现象，防潮层封口处应封闭。当涂抹沥青胶或防水冷胶料时，应满涂至规定厚度，其表面应均匀平整；粘贴的方式可采用螺旋形缠绕法或平铺法，待干燥后，应在玻璃布表面再涂抹沥青胶或防水冷胶料。", k:"雨雪天、暴晒不施工；防潮层外禁硬质捆扎件；连续施工不断层", s:"P148"},
  {id:30, g:"防潮层施工", q:"防潮层胶泥涂抹结构对玻璃纤维布和胶泥厚度有什么要求？", a:"玻璃纤维布宜选用经纬密度不小于88根/cm²、厚度为0.10~0.20mm的中碱粗格平纹玻璃布，或采用塑料网格布。防潮层胶泥涂抹的厚度每层一般为2~3mm，施工时依据设计文件的要求确定；沥青玛蹄脂的主要技术参数有挥发物含量、氧指数、粘结力、相对密度、耐热性、抗冻性、吸水率、施工厚度、干燥时间等，必须符合设计文件和产品标准的规定。", k:"88根/cm²、0.10~0.20mm、每层2~3mm", s:"P148"},
  {id:31, g:"防潮层施工", q:"玻璃纤维布复合胶泥涂抹结构的搭接和粘贴方式有什么要求？", a:"立式设备和垂直管道的环向接缝，应为上下搭接；卧式设备和水平管道的纵向接缝位置，应在两侧，并应缝口朝下。玻璃纤维布应随第一层胶泥层边涂边贴，其环向、纵向缝的搭接宽度不应小于50mm，搭接处应粘贴密实，不得出现气泡或空鼓。粘贴的方式可采用螺旋形缠绕法或平铺法：公称直径小于800mm的设备或管道宜采用螺旋形缠绕法，玻璃布的宽度宜为120~350mm；公称直径大于或等于800mm的设备或管道可采用平铺法，玻璃布的宽度宜为500~1000mm。", k:"搭接≥50mm；DN<800螺旋缠绕、DN≥800平铺", s:"P148"},
  {id:32, g:"保护层施工", q:"金属保护层的接缝形式、安装及防踩踏有什么要求？", a:"金属保护层的接缝可选用搭接、咬接、插接及嵌接的形式，安装应紧贴保温层或防潮层；金属保护层纵向接缝可采用搭接或咬接，环向接缝可采用插接或搭接，室内的外保护层结构宜采用搭接形式。当金属保护层采用支撑环固定时，支撑环的布置间距应和金属保护层的环向搭接位置相一致，钻孔应对准支撑环。在已安装的金属护壳上，严禁踩踏和堆放物品，对于不可避免的踩踏部位，应采取正式防护措施。垂直管道或设备金属保护层的敷设，应由下而上进行施工，接缝应顺水搭接。", k:"搭接、咬接、插接、嵌接；室内宜搭接；由下而上顺水搭接", s:"P149"},
  {id:33, g:"保护层施工", q:"金属压型板的安装方向和固定方式是什么？宽波、窄波何时装在外面？", a:"压型板应由下而上进行安装，压型板可采用螺栓与胶垫、自攻螺钉或抽芯铆钉固定。当采用硬质绝热制品时，其金属压型板的宽波应安装在外面；当采用半硬质和软质绝热制品时，其压型板的窄波应安装在外面。", k:"由下而上；硬质宽波在外、半硬质软质窄波在外", s:"P149"},
  {id:34, g:"保护层施工", q:"设备绝热保护层施工有哪些要求？", a:"设备及大型储罐金属保护层的接缝和凸筋，应呈棋盘形错列布置；立式设备、垂直管道或斜度大于45°的斜立管道上的金属保护层，应分段将其固定在支承件上。静置设备和转动机械的绝热层，其金属保护层应自下而上进行敷设；环向接缝宜采用搭接或插接，纵向接缝可咬接或搭接，搭接或插接尺寸应为30~50mm；平顶设备顶部绝热层的金属保护层，应按设计规定的坡度进行施工。", k:"棋盘形错列、>45°斜立段固定于支承件、搭接或插接30~50mm", s:"P149"},
  {id:35, g:"保护层施工", q:"水平管道金属保护层的接缝位置和固定方式有什么要求？", a:"水平管道金属保护层的环向接缝应沿管道坡向顺水搭接，其纵向接缝宜布置在水平中心线下方的15°~45°处，并应缝口朝下；当侧面或底部有障碍物时，纵向接缝可移至管道水平中心线上方60°以内。管道金属保护层的纵向接缝，当为保冷结构时，应采用金属抱箍固定，间距宜为250~300mm；当为保温结构时，可采用自攻螺钉或抽芯铆钉固定，间距宜为150~200mm，间距应均匀一致。", k:"15°~45°缝口朝下、障碍物时上移60°内；保冷抱箍250~300mm、保温自攻钉150~200mm", s:"P149"},
  {id:36, g:"保护层施工", q:"支管与主管相交时，金属保护层的施工顺序和收口做法有什么不同？", a:"水平支管与垂直主管相交时，水平支管保护层先施工，垂直主管应按支管保护层外径开口，水平支管保护层应插入垂直主管保护层开口内。垂直支管与水平主管在水平主管下部相交时，垂直支管保护层应先施工，水平主管应按垂直支管保护层外径开口，垂直支管保护层应插入水平主管保护层开口内，上端口向外折边不应小于10mm。垂直支管与水平主管在水平主管上部相交时，水平主管保护层应先施工，垂直支管端部应按马鞍形剪口与水平主管对接。", k:"水平支管先、垂直支管先、水平主管先（下部折边≥10mm、上部马鞍形剪口）", s:"P149"},
  {id:37, g:"保护层施工", q:"金属保护层膨胀部位的接缝如何处理？半硬质和软质绝热制品的活动接缝间距是多少？", a:"管道金属保护层膨胀部位的环向接缝，静置设备及转动机构保护层的膨胀部位，均应采用活动接缝，接缝应满足热膨胀的要求，不得固定；其间距应符合硬质绝热制品的活动接缝，且与保温层伸缩缝的位置相一致。半硬质和软质绝热制品的活动接缝间距，中低温管道应为4000~6000mm，高温管道应为3000~4000mm。", k:"膨胀部位活动接缝不得固定；中低温4000~6000mm、高温3000~4000mm", s:"P150"},
  {id:38, g:"保护层施工", q:"非金属保护层施工有哪些要求？", a:"当采用箔、毡、布类包缠型保护层时：当在绝热层上直接包缠时，应清除绝热层表面的灰尘、污泥，并应修饰平整；当在抹面层上包缠时，应在抹面层表面干燥后进行；包缠施工应层层压缝，压缝宜为30~50mm，且必须在其起点和终端有紧固措施。当采用阻燃型防水卷材及涂膜弹性体作保护层时：当施工防水涂料时，绝热层接缝处应嵌平、光滑，并不得高出绝热层表面。", k:"层层压缝30~50mm、起点与终端有紧固措施", s:"P150"},
  {id:39, g:"保护层施工", q:"设备、管道采用卷材保护层时，环向、纵向接缝的搭接尺寸要求是多少？接缝怎么封口？", a:"卷材包扎的环向、纵向接缝的搭接尺寸不应小于50mm；接缝处可采用专用涂料粘贴封口。", k:"卷材搭接≥50mm", s:"P151"},
  {id:40, g:"保护层施工", q:"大型设备抹面保护层的伸缩缝有什么要求？", a:"应留出纵横交错的方格形或环形伸缩缝；伸缩缝应做成凹槽，其深度应为5~8mm，宽度应为8~12mm。", k:"深5~8mm、宽8~12mm", s:"P151"},
];

    options:["A. 100~150mm", "B. 150~200mm", "C. 250~300mm", "D. 400~600mm"],
    correct:2,
    why:"当为保冷结构时，应采用金属抱箍固定，间距宜为250~300mm；当为保温结构时，可采用自攻螺钉或抽芯铆钉固定，间距宜为150~200mm，间距应均匀一致。" },
  { type:"反向", cardIds:[29],
    q:"某工程为固定保护层，在防潮层外侧加设了钢丝、钢带作捆扎件。按教材规定，这一做法错在哪里？",
    answer:"错误在于防潮层外设置了钢丝、钢带等硬质捆扎件。正确要求：防潮层外不得设置钢丝、钢带等硬质捆扎件；设备筒体、管道上的防潮层应连续施工，不得有断开或断层，防潮层封口处应封闭。",
    keys:["防潮层外不得设置钢丝、钢带等硬质捆扎件", "防潮层应连续施工，不得断开或断层", "封口处应封闭"],
    need:2 },
  { type:"场景", cardIds:[19],
    q:"某管道保冷层设计厚度为90mm，施工班组一次单层成型完成。该做法是否符合要求？应如何施工？",
    answer:"不符合要求。当采用一种绝热制品，保冷层厚度大于或等于80mm时，应分为两层或多层逐层施工，各层的厚度宜接近。该管道保冷层厚90mm，应分层施工，不应一次单层成型。",
    keys:["保冷层厚度≥80mm应分层施工", "分为两层或多层逐层施工", "各层厚度宜接近"],
    need:3 }
];

const KEY_STATUS = "erjian_sw_4_5_status";
const KEY_PASS = "erjian_sw_4_5_pass";

let status = {};
try { status = JSON.parse(localStorage.getItem(KEY_STATUS) || "{}"); } catch (e) { status = {}; }
let passInfo = null;
try { passInfo = JSON.parse(localStorage.getItem(KEY_PASS) || "null"); } catch (e) { passInfo = null; }

let mode = "all";
let queue = CARDS.map(c => c.id);
let pos = 0;

const el = id => document.getElementById(id);

function buildQueue() {
  let ids = CARDS.map(c => c.id);
  if (mode === "review") ids = ids.filter(id => status[id] === 0);
  if (mode === "shuffle") ids = ids.sort(() => Math.random() - 0.5);
  queue = ids;
  pos = 0;
}

function renderBadge() {
  if (passInfo && passInfo.pass) {
    el("passBadge").innerHTML = '<span class="badge">已通关 ' + passInfo.date + '</span>';
    el("gateBtn").classList.add("passed");
    if (!el("exam").classList.contains("on")) el("gateBtn").textContent = "已通关";
  } else {
    el("passBadge").textContent = "";
    el("gateBtn").classList.remove("passed");
    if (!el("exam").classList.contains("on")) el("gateBtn").textContent = "验收";
  }
}

function render() {
  const good = CARDS.filter(c => status[c.id] === 1).length;
  const bad = CARDS.filter(c => status[c.id] === 0).length;
  el("total").textContent = CARDS.length;
  el("nNew").textContent = CARDS.length - good - bad;
  el("nGood").textContent = good;
  el("nBad").textContent = bad;

  if (!queue.length) {
    el("tag").textContent = "没有卡";
    el("q").textContent = "这一组是空的 —— 换「全部」或「随机」。";
    el("a").hidden = true; el("kk").hidden = true;
    el("hint").textContent = ""; el("src").textContent = "";
    return;
  }
  if (pos < 0) pos = queue.length - 1;
  if (pos >= queue.length) pos = 0;

  const c = CARDS.find(x => x.id === queue[pos]);
  el("tag").textContent = c.g;
  el("q").textContent = c.q;
  el("a").textContent = c.a;
  el("a").hidden = true;
  el("kk").textContent = c.k ? "口诀：" + c.k : "";
  el("kk").hidden = true;
  el("hint").textContent = "点卡片任意位置翻面";
  el("src").textContent = "出处：" + c.s + "　（第 " + (pos + 1) + " / " + queue.length + " 张）";
  el("flip").textContent = "翻面";
  window.scrollTo(0, 0);
}

function toggle() {
  if (!queue.length) return;
  const show = el("a").hidden;
  el("a").hidden = !show;
  el("kk").hidden = !show || !el("kk").textContent;
  el("flip").textContent = show ? "收起" : "翻面";
  el("hint").textContent = show ? "" : "点卡片任意位置翻面";
}

function next(step) {
  if (!queue.length) return;
  pos = (pos + step + queue.length) % queue.length;
  render();
}

function mark(v) {
  if (!queue.length) return;
  status[queue[pos]] = v;
  try { localStorage.setItem(KEY_STATUS, JSON.stringify(status)); } catch (e) {}
  pos = (pos + 1) % queue.length;
  render();
}

let ex = { i:0, score:0, answered:false, wrongCards:[] };

function startExam() {
  ex = { i:0, score:0, answered:false, wrongCards:[] };
  el("study").classList.add("off");
  el("exam").classList.add("on");
  el("dock").style.display = "none";
  el("gateBtn").textContent = "退出验收";
  renderExam();
  window.scrollTo(0, 0);
}

function exitExam() {
  el("study").classList.remove("off");
  el("exam").classList.remove("on");
  el("dock").style.display = "flex";
  renderBadge();
  render();
}

function renderExam() {
  const q = EXAM[ex.i];
  el("exPos").textContent = "第 " + (ex.i + 1) + " / " + EXAM.length + " 题";
  el("exScore").textContent = "已对 " + ex.score;
  el("exTag").textContent = q.type;
  el("exQ").textContent = q.q;
  el("exOpts").innerHTML = "";
  el("exWhy").hidden = true;
  el("exWhy").textContent = "";
  ex.answered = false;

  const dock = el("exDock");
  dock.innerHTML = "";

  if (q.options) {
    q.options.forEach((opt, idx) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = String.fromCharCode(65 + idx) + ". " + opt;
      b.onclick = () => answerChoice(idx);
      el("exOpts").appendChild(b);
    });
    const skip = document.createElement("button");
    skip.textContent = "不会";
    skip.onclick = () => answerChoice(-1);
    dock.appendChild(skip);
  } else {
    const ta = document.createElement("textarea");
    ta.id = "exInput";
    ta.rows = 4;
    ta.placeholder = "用你自己的话写下来，写完点「提交」——空着提交也算没答。";
    el("exOpts").appendChild(ta);
    const sub = document.createElement("button");
    sub.className = "primary";
    sub.textContent = "提交答案";
    sub.onclick = () => gradeOpen(q, ta.value);
    dock.appendChild(sub);
  }
}

function norm(s) {
  return (s || "").toLowerCase().replace(/\s+/g, "").replace(/％/g, "%");
}

function gradeOpen(q, input) {
  if (ex.answered) return;
  ex.answered = true;
  const t = norm(input);
  const keys = q.keys || [];
  const hits = keys.filter(k => t.includes(norm(k)));
  const miss = keys.filter(k => !t.includes(norm(k)));
  const need = q.need || keys.length;
  const pass = hits.length >= need;

  let txt = "命中 " + hits.length + " / " + keys.length + " 个关键词（需要 " + need + " 个）\n";
  if (hits.length) txt += "✅ 命中：" + hits.join("、") + "\n";
  if (miss.length) txt += "❌ 漏掉：" + miss.join("、") + "\n";
  txt += "\n—— 参考答案 ——\n" + q.answer;

  el("exWhy").textContent = txt;
  el("exWhy").hidden = false;

  const dock = el("exDock");
  dock.innerHTML = "";
  const nextBtn = document.createElement("button");
  nextBtn.className = "primary";
  nextBtn.textContent = ex.i === EXAM.length - 1 ? "看结果" : "下一题";
  nextBtn.onclick = () => finishQuestion(pass);
  dock.appendChild(nextBtn);
}

function answerChoice(idx) {
  if (ex.answered) return;
  ex.answered = true;
  const q = EXAM[ex.i];
  const opts = el("exOpts").querySelectorAll(".opt");
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add("ok");
    if (i === idx && idx !== q.correct) b.classList.add("no");
  });
  el("exWhy").textContent = q.why || q.answer || "";
  el("exWhy").hidden = false;

  const dock = el("exDock");
  dock.innerHTML = "";
  const nextBtn = document.createElement("button");
  nextBtn.className = "primary";
  nextBtn.textContent = ex.i === EXAM.length - 1 ? "看结果" : "下一题";
  nextBtn.onclick = () => finishQuestion(idx === q.correct);
  dock.appendChild(nextBtn);
}

function finishQuestion(right) {
  if (right) ex.score++;
  else ex.wrongCards = ex.wrongCards.concat(EXAM[ex.i].cardIds || []);
  ex.i++;
  if (ex.i >= EXAM.length) showResult();
  else renderExam();
}

function showResult() {
  const total = EXAM.length;
  const pass = ex.score === total;
  el("exPos").textContent = "验收结束";
  el("exScore").textContent = "";
  el("exTag").textContent = pass ? "通关" : "未通过";
  el("exQ").textContent = "";
  el("exOpts").innerHTML = "";

  const uniq = [...new Set(ex.wrongCards)].sort((a, b) => a - b);
  let txt = "答对 " + ex.score + " / " + total + " 题\n";
  if (pass) {
    const d = new Date();
    const ds = (d.getMonth() + 1) + "-" + String(d.getDate()).padStart(2, "0");
    passInfo = { pass:true, date:ds, score:ex.score };
    try { localStorage.setItem(KEY_PASS, JSON.stringify(passInfo)); } catch (e) {}
    txt += "\n✅ 本节通关。7 天后再验一次。\n\n";
    txt += "额外一道人工关：拿张白纸，3 分钟写出这节结构，拍照发给教练。";
  } else {
    txt += "\n❌ 没过。错题对应的卡：卡 " + uniq.join("、卡 ") + "\n\n";
    txt += "回卡片区按编号核对，重点看这几张。";
  }

  const why = el("exWhy");
  why.textContent = txt;
  why.hidden = false;

  const dock = el("exDock");
  dock.innerHTML = "";
  const again = document.createElement("button");
  again.textContent = pass ? "再验一次" : "重来";
  again.onclick = () => startExam();
  const back = document.createElement("button");
  back.className = "primary";
  back.textContent = "回卡片";
  back.onclick = () => exitExam();
  dock.appendChild(again);
  dock.appendChild(back);
  renderBadge();
}

el("card").addEventListener("click", toggle);
el("flip").onclick = e => { e.stopPropagation(); toggle(); };
el("good").onclick = () => mark(1);
el("bad").onclick = () => mark(0);
el("prev").onclick = () => next(-1);
el("gateBtn").onclick = () => {
  if (el("exam").classList.contains("on")) exitExam(); else startExam();
};

document.querySelectorAll(".tools button[data-mode]").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".tools button[data-mode]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    mode = b.dataset.mode;
    buildQueue();
    render();
  };
});

let x0 = null;
el("card").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
el("card").addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 60) next(dx < 0 ? 1 : -1);
  x0 = null;
});

buildQueue();
render();
renderBadge();
</script>
</body>
</html>
