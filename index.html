Short":"马克思主义是由马克思、恩格斯创立并为后继者所不断发展的科学理论体系"},{"id":730,"subject":"马原","code":"15044","type":"essay","stem":"实践是检验真理的唯一标准。","options":[],"answer":"(1)这是由真理的本性和实践的特点决定的：真理是人们对客观事物及其发展规律的正确反映，其本性在于主观和客观相符合。实践具有直接现实性，这是它的客观实在性的具体表现。\n(2)已被逻辑证明了的东西，还必须经过实践的检验，并最终服从实践检验的结果。逻辑证明不能取代实践作为检验真理的标准，实践才是检验真理的唯一标准。","answerShort":"①这是由真理的本性和实践的特点决定的：真理是人们对客观事物及其发展规律…\n②已被逻辑证明了的东西，还必须经过实践的检验，并最终服从实践检验的结果"},{"id":731,"subject":"马原","code":"15044","type":"essay","stem":"货币的本质及职能。","options":[],"answer":"(1)货币：固定地充当一般等价物的商品。货币的产生和起源是商品交换长期发展的产物。\n(2)货币的职能：价值尺度职能，流通手段职能，贮藏手段职能，支付手段职能，世界货币职能。","answerShort":"①货币：固定地充当一般等价物的商品\n②货币的职能：价值尺度职能，流通手段职能，贮藏手段职能，支付手段职能"},{"id":732,"subject":"马原","code":"15044","type":"essay","stem":"资本主义国家如何利用利率调节经济?","options":[],"answer":"利率调节主要是通过利率高低和差别利率来实现某些宏观经济目标。例如，对国家支持的产业或企业给予优惠的信贷条件，鼓励其发展;相反，对国家要控制的经济活动则用较严格的信贷条件来制约。在经济过热时，适当提高利率，给经济降温;相反，在需要刺激经济发展、走出萧条与不景气阴影的时候，则适当降低利率来刺激投资与消费。","answerShort":"①利率调节主要是通过利率高低和差别利率来实现某些宏观经济目标\n②例如，对国家支持的产业或企业给予优惠的信贷条件，鼓励其发展\n③在经济过热时，适当提高利率，给经济降温"},{"id":733,"subject":"马原","code":"15044","type":"essay","stem":"马克思主义政党在社会主义建设和改革中的领导核心作用主要体现在哪些方面?","options":[],"answer":"(1)在思想方面，马克思主义政党要确保自己在意识形态领域的领导地位，确保马克思主义在社会主义国家的指导地位。\n(2)在政治方面，马克思主义政党要在社会主义民主政治建设和政治体制改革中起到领导核心作用，保证社会主义建设的正确方向。\n(3)在组织方面，马克思主义政党要领导全体人民有组织、有系统、有管理、有序地进行社会主义的各项建设事业。","answerShort":"①在思想方面，马克思主义政党要确保自己在意识形态领域的领导地位\n②在政治方面\n③在组织方面"},{"id":734,"subject":"马原","code":"15044","type":"essay","stem":"意识的能动性主要表现在哪些方面?在社会主义现代化建设中如何正确发挥人的主观能动性?","options":[],"answer":"(1)意识对物质具有反作用。这种反作用就是意识的能动作用，表现在：意识具有目的性和计划性、意识具有创造性、意识具有指导实践改造客观世界的作用、意识具有调控人的行为和生理活动的作用。\n(2)正确发挥人的主观能动性的前提是从实际出发;正确发挥人的主观能动性的根本途径是实践;正确发挥人的主观能动性，还依赖于的物质条件和物质手段。","answerShort":"①意识对物质具有反作用\n②正确发挥人的主观能动性的前提是从实际出发"},{"id":735,"subject":"马原","code":"15044","type":"essay","stem":"社会改革的实质是什么?社会改革在社会发展中的作用表现在哪些方面?","options":[],"answer":"(1)实质：是社会制度的自我调整和完善。\n(2)作用：\n①改革是社会制度的自我调整和完善，是推动社会发展的重要动力。\n②改革是解决社会基本矛盾、促进生产力发展、推动社会进步的有效途径和手段。\n③中国的社会主义改革是社会主义制度的自我完善和自我发展，改革是社会主义社会发展的强大动力。","answerShort":"①实质：是社会制度的自我调整和完善\n②改革是社会制度的自我调整和完善，是推动社会发展的重要动力\n③改革是解决社会基本矛盾、促进生产力发展、推动社会进步的有效途径和手段\n④中国的社会主义改革是社会主义制度的自我完善和自我发展"},{"id":736,"subject":"马原","code":"15044","type":"essay","stem":"试述劳动力商品的特点及价值决定。","options":[],"answer":"(1)像任何商品一样，劳动力商品也具有价值和使用价值。但是，劳动力是特殊的商品，它的价值和使用价值具有不同于普通商品的特点。“劳动力的价值，是由生产、发展、维持和延续劳动力所必需的生活必需品的价值决定的。”它包括三个部分：\n①维持劳动者本人生存所必需的生活资料的价值;\n②维持劳动者家属的生存所必需的生活资料的价值;\n③劳动者接受教育和训练所支出的费用。由于劳动力价值的构成包含历史和道德的因素，在不同的国家或在同一国家的不同历史时期，劳动者所必需的生活资料的数量和构成是有区别的，所以劳动力价值的最低界限是由生活上不可缺少的生活资料的价值决定的。一旦劳动力价值降低到这个界限以下，劳动力就只能在萎缩的状态下维持。\n(2)劳动力商品在使用价值上有一个很突出的特点，就是它的使用价值是价值的源泉，在消费过程中能够创造新的价值，而且这个新的价值比劳动力本身的价值更大。","answerShort":"①像任何商品一样，劳动力商品也具有价值和使用价值\n②维持劳动者本人生存所必需的生活资料的价值\n③维持劳动者家属的生存所必需的生活资料的价值\n④劳动者接受教育和训练所支出的费用\n⑤劳动力商品在使用价值上有一个很突出的特点"},{"id":737,"subject":"马原","code":"15044","type":"single","stem":"世界观是","options":["人们对整个世界的根本看法和观点","人们对精神世界的根本看法和观点","人们对物质世界的根本看法和观点","人们对外部世界的根本看法和观点"],"answer":"A"},{"id":738,"subject":"马原","code":"15044","type":"single","stem":"在平均利润形成以前，资本有机构成高的部门，它的利润率一般","options":["高于社会平均水平","低于社会平均水平","等于社会平均水平","等于其剩余价值率"],"answer":"B"},{"id":739,"subject":"马原","code":"15044","type":"single","stem":"为获取高额垄断利润，垄断组织在采购原材料时大多采取","options":["垄断高价","垄断低价","浮动价格","固定价格"],"answer":"B"},{"id":740,"subject":"马原","code":"15044","type":"single","stem":"提示事物发展趋势和道路的规律是","options":["否定之否定规律","质量互变规律","对立统一规律","内容和形式相互作用规律"],"answer":"A"},{"id":741,"subject":"马原","code":"15044","type":"single","stem":"在上层建筑的各种要素中，居于主导地位的是","options":["宗教","哲学","艺术","政治"],"answer":"D"},{"id":742,"subject":"马原","code":"15044","type":"single","stem":"劳动力在使用过程中实现了价值增殖，它能够创造出比劳动力本身价值更大的价值，而这个增殖的价值就被称为","options":["剩余价值","交换价值","超额价值","使用价值"],"answer":"A"},{"id":743,"subject":"马原","code":"15044","type":"single","stem":"真理既是绝对的，又是相对的。这是真理问题上的","options":["唯物论","辩论论","二元论","诡辩论"],"answer":"B"},{"id":744,"subject":"马原","code":"15044","type":"single","stem":"社会革命首要的基本的标志是","options":["先进的政治思想代替落后的政治思想","高效率的政治体制代替低效率的政治体制","国家政权从反动阶级手里转移到革命的进步的阶级手里","合理的经济体制代替不合理的经济体制"],"answer":"C"},{"id":745,"subject":"马原","code":"15044","type":"single","stem":"资本的价值构成是指","options":["固定资本和流动资本的比例","所用资本和所费资本的比例","生产资料和劳动力的比例","不变资本和可变资本的比例"],"answer":"D"},{"id":746,"subject":"马原","code":"15044","type":"single","stem":"旧唯物主义把哲学上的物质概念等同于自然科学上特定的历史条件下的具体物质，是缺乏辩证统一性的物质观。哲学上的物质范畴与自然科学上的物质范畴的关系正确的是","options":["本原和派生的关系","普遍和特殊的关系","本质和现象的关系","形式和内容的关系"],"answer":"B"},{"id":747,"subject":"马原","code":"15044","type":"single","stem":"社会革命的实质是","options":["消灭国家","消灭阶级","被统治阶级消灭统治阶级","革命阶级推翻反动阶级的统治，用新的社会制度代替旧的社会制度"],"answer":"D"},{"id":748,"subject":"马原","code":"15044","type":"single","stem":"社会形态的发展是一种自然历史过程，这种观点属于","options":["机械决定论","历史宿命论","历史唯物论","历史唯心论"],"answer":"C"},{"id":749,"subject":"马原","code":"15044","type":"multi","stem":"下列各项属于观念上层建筑的有","options":["军队和法庭","哲学和宗教","艺术和道德","逻辑学和语言学","无"],"answer":"BC"},{"id":750,"subject":"马原","code":"15044","type":"multi","stem":"实践是认识的基础，对认识有决定作用，表现在","options":["实践是认识的来源","实践是认识的本质","实践是检验认识的唯一标准","实践是认识的目的"],"answer":"ACD"},{"id":751,"subject":"马原","code":"15044","type":"judge","stem":"人民群众是指所有为社会历史发展起推动作用的人们，是社会人口的绝大多数。人民群众是一个历史范畴，在不同的历史时期，包含不同的对象。","options":["对","错"],"answer":"对"},{"id":752,"subject":"马原","code":"15044","type":"judge","stem":"19世纪30年代，英、法、德、俄同时完成了工业革命.","options":["对","错"],"answer":"错"},{"id":753,"subject":"马原","code":"15044","type":"judge","stem":"19世纪三、四十年代的三大工人运动，说明无产阶级已经成为一种独立的政治力量登上历史舞台，资产阶级和无产阶级的矛盾已经历史地上升为社会的主要矛盾。","options":["对","错"],"answer":"对"},{"id":754,"subject":"马原","code":"15044","type":"judge","stem":"劳动过程是劳动的一般性质和劳动的社会形式的统一。劳动的一般性质是指它是人与自然之间的物质变换过程。","options":["对","错"],"answer":"对"},{"id":755,"subject":"马原","code":"15044","type":"judge","stem":"客观性是马克思对自己哲学性质的一种根本性理解。","options":["对","错"],"answer":"错"},{"id":756,"subject":"马原","code":"15044","type":"essay","stem":"垄断资本主义的基本经济特征有哪些?其当代发展的新特点，新形式是什么?","options":[],"answer":"(1)垄断资本主义基本经济特征:①垄断在经济生活中占统治地位;② 金融资本和金融寡头的统治;③资本输出在经济生活中占重要地位;④国际垄断 同盟在经济上瓜分世界;⑤)垄断资本主义列强瓜分和重新瓜分世界。(2)二战后，私人垄断资本主义进一步发展为国家垄断资本主义，即垄断资本与国家政权相结合的资本主义。国家垄惭资本主义取代私人垄断成为主要资本主 义国家当代资本主义发展的新形式、新特征。具体表现在:①在生产力方面，劳 动生产率大幅度提高，社会财富迅猛增长,经济保持了较长时期的相对稳定发展。②当代资本主义国家在所有制关系、劳动关系和分配关系三方面都做了一系列调整。③资本主义发展到国家垄断资本主义阶段，已经建立起比较成熟的政治制度 和法制制度。","answerShort":"①垄断资本主义基本经济特征:\n②垄断在经济生活中占统治地位\n③金融资本和金融寡头的统治\n④资本输出在经济生活中占重要地位\n⑤国际垄断同盟在经济上瓜分世界"},{"id":757,"subject":"马原","code":"15044","type":"essay","stem":"简述内容和形式的含义以及二者的相互作用。","options":[],"answer":"(1)内容是指构成事物的一切要素的总和。形式是指把内容诸要素统一起来的结构或表现内容的方式.\n(2)内容和形式是对立的统一。内容决定形式，形式对内容有反作用，二者在一定条件下可以相互转化。\n(3)内容和形式的相互作用构成两者的矛盾运动，二者是由基本适合到基本不适合，再到新的基本适合的不断发展过程。","answerShort":"①内容是指构成事物的一切要素的总和\n②内容和形式是对立的统一\n③内容和形式的相互作用构成两者的矛盾运动，二者是由基本适合到基本不适合"},{"id":758,"subject":"马原","code":"15044","type":"essay","stem":"试述货币的起源、本质和职能","options":[],"answer":"货币起源于一般等价物。货币的本质: 货币的本质是一般等价物。它与一般等价物的区别:一是产生的时间不同;一般等价物产生在前，货币产生在后;二是一般等价物在时间、地域、材料的质地上是不固定的，而货币是由金银固定地充当的。 货而的职能:货币具有价值尺度、流通手段、(前面两是最基本的职能)贮藏手段、支付手段和世界货币五种职能，其中价值尺度和流通手段是货币两种基本职能。","answerShort":"①货币起源于一般等价物\n②货币的本质：货币的本质是一般等价物\n③它与一般等价物的区别：一是产生的时间不同"},{"id":759,"subject":"马原","code":"15044","type":"essay","stem":"试述两对社会基本矛盾之间的关系以及社会基本矛盾在社会发展中的作用","options":[],"answer":"(1)生产力决定生产关系、生产关系作为社会的经济基础又决定社会的上层建筑,所以生力与生产关系之间的矛盾起着主导作用(2)生产关系对生产力有反作用,上层建筑对经济基础有反作用,经济基础又是联系上层建筑和生产力的中间环节,所以生产力和生产关系之间的矛盾解决,又有赖于经济基础和上层建筑之间的矛盾的解决(3)社会的基本矛盾是社会发展的基本动力,制约和决定着其他名种社会矛盾,决定着整个社会的面貌,决定着社会发展的必然阶段和客观趋势,决定着社会形态由低级到高级的演进","answerShort":"①生产力决定生产关系、生产关系作为社会的经济基础又决定社会的上层建筑,…\n②生产关系对生产力有反作用,上层建筑对经济基础有反作用,经济基础又是联…\n③社会的基本矛盾是社会发展的基本动力,制约和决定着其他名种社会矛盾,决…"},{"id":760,"subject":"马原","code":"15044","type":"essay","stem":"试阐述矛盾的普遍性与特殊性原理是我国走建设有中国特色社会主义道路的哲学基础","options":[],"answer":"矛盾普遍性与特殊性辩证关系原理是建设有中国特色社会主义的重要哲学依据。\n:矛盾普遍性与特殊性是辩证统一的关系原理:\n(1)矛盾的普遍性和特殊性是相互联结的。\n1普遍性寓于特殊性之中，没有特殊性，就没有普遍性。\n2特殊性也离不开普通性，不包含普遍性的特殊性也是没有的。\n(2)矛盾的普遍性和特殊性不是凝固不变的;在不同的场合又是可以变化的。\n二:矛盾普遍性与特殊性辩证关系原理是建设有中国特色社会主义的重要哲学依据。\n1.只有坚持马克思主义普遍真理同各国革命和建设的县体实践相结合，才能找到适合自己国情的革命和建设的正确道路。建设有中国特色社会主义理论鲜明地体现了矛盾普遍性与特殊性的辩证统一。\n2.掌握矛盾普遍性和特殊性的辨证关系原理,对于建设中国特色的社会主义有两个含义:一是社会主义，一是中国特色\n作为社会主义,其基本特征是生产资料社会主义公有制,按劳分配剥削阶级和剥削制度的消灭，人民民主专政等等,从辨证法的观点看,这些就是矛盾的普遍性。\n所谓中国特色,就是中国的具体特点中国的国情,具体边县为中国的历史，文化,民族心理生活方式,传统习惯,政治经济现状等,从辨证法的观点看,这些就是矛盾的特殊性,\n邓小平同志提出的建设有中国特色的社会主义理论把作为矛盾普遍性的社会主义的原则同作为矛盾特殊性的中国国情结合起来了,充分提乡了矛盾普遍性和特殊性的辨证统一,是运用唯物辨证法的思想结晶,掌握了矛盾普遍性和特殊的辨证原理，才能深刻理解建设有中国特色社会主义的重大意义","answerShort":"①矛盾普遍性与特殊性辩证关系原理是建设有中国特色社会主义的重要哲学依据\n②矛盾的普遍性和特殊性是相互联结的\n③矛盾的普遍性和特殊性不是凝固不变的"},{"id":761,"subject":"马原","code":"15044","type":"essay","stem":"资本主义国家如何在私人企业外部进行管理和调控经济活动?","options":[],"answer":"(1)通过法律手段来规范私人企业的市场行为，使其运行符合国家垄断资本的要求\n(2)可以用经济手段来间接地调节私人企业的经济活动，诱导私人企业向国家希望的方向发展。如通过财政政策，以增税、减税或是补贴的方式，可以引导私人企业增加生产或是减少生产;\n(3)也可以通过货币金融政策，如放松还是收紧银根，实行差别利率等方式，引导企业的行为和发展方向:\n(4)还可以通过国家向私人企业加工订货来维持企业的生存和发展:\n(5)通过实行国民经济计划化，引导私人企业的发展:等等。","answerShort":"①通过法律手段来规范私人企业的市场行为，使其运行符合国家垄断资本的要求\n②可以用经济手段来间接地调节私人企业的经济活动，诱导私人企业向国家希望的方向发展\n③也可以通过货币金融政策，如放松还是收紧银根，实行差别利率等方式\n④还可以通过国家向私人企业加工订货来维持企业的生存和发展:\n⑤通过实行国民经济计划化，引导私人企业的发展:等等"},{"id":762,"subject":"马原","code":"15044","type":"single","stem":"在马克思主义理论体系中,马克思主义哲学、马克思主义政治经济学和科学社会主义共同构成其","options":["基本内涵","主要特征","根本性质","主体内容"],"answer":"D"},{"id":763,"subject":"马原","code":"15044","type":"single","stem":"下列选项属于为马克思主义的创立提供了直接理论来源的是","options":["古希腊罗马哲学","文艺复兴运动的思想成果","德国古典哲学","法国复辟时期历史学家的进步思想"],"answer":"C"},{"id":764,"subject":"马原","code":"15044","type":"single","stem":"唯物主义与唯心主义是两种根本对立的哲学派别,其形成的原因在于","options":["二者对客观实在性的认识不同","二者对主观能动性的认识不同","二者对物质和意识谁为本原问题的回答不同","二者对思维和存在有否同一性问题的回答不同"],"answer":"C"},{"id":765,"subject":"马原","code":"15044","type":"single","stem":"客观实在性作为物质的唯一特性,体现的是","options":["某种自然存在的个别特性","自然存在和社会存在的不同特性","几种自然存在的共同特性","自然存在和社会存在的共同特性"],"answer":"D"},{"id":766,"subject":"马原","code":"15044","type":"single","stem":"马克思指出:“观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已。”这就是说","options":["意识是人脑的分泌物","意识是客观世界的主观映象","意识是人脑的附属物","意识是客观世界的虚幻影像"],"answer":"B"},{"id":767,"subject":"马原","code":"15044","type":"single","stem":"在唯物辩证法体系中,反映事物的过去、现在和将来关系的一对范畴是","options":["内容和形式","本质和现象","原因和结果","现实和可能"],"answer":"D"},{"id":768,"subject":"马原","code":"15044","type":"single","stem":"“认识的本质是主体在实践基础上对客体的能动反映”,这是一种","options":["主观唯心主义认识论观点","客观唯心主义认识论观点","辩证唯物主义认识论观点","旧唯物主义认识论观点"],"answer":"C"},{"id":769,"subject":"马原","code":"15044","type":"single","stem":"轻视理性认识而片面夸大感性认识的作用,会导致实践中的","options":["实用主义","怀疑主义","教条主义","经验主义"],"answer":"D"},{"id":770,"subject":"马原","code":"15044","type":"single","stem":"实践是检验真理的唯一标准,这是因为","options":["实践是人类生存和发展的基础","实践是人类社会生活的本质","实践是真理和价值统一的基础","实践具有直接现实性的品格"],"answer":"D"},{"id":771,"subject":"马原","code":"15044","type":"single","stem":"中国共产党的思想路线的核心是","options":["自信自立","守正创新","实事求是","自我革命"],"answer":"C"},{"id":772,"subject":"马原","code":"15044","type":"single","stem":"社会历史观的基本问题是","options":["社会存在和社会意识的关系问题","物质文明和精神文明协调发展的问题","社会革命和社会改革的关系问题","群众、阶级、政党、领袖的关系问题"],"answer":"A"},{"id":773,"subject":"马原","code":"15044","type":"single","stem":"社会存在即社会物质生活条件,是社会生活的物质方面。下列选项中不属于社会存在的是","options":["自然地理环境","政治法律思想","物质生产方式","人口因素"],"answer":"B"},{"id":774,"subject":"马原","code":"15044","type":"single","stem":"下列各项正确说明经济基础与上层建筑的关系的是","options":["经济基础的性质决定上层建筑的性质","上层建筑的性质决定经济基础的性质","上层建筑的变化决定经济基础的变化","上层建筑各个部分都随经济基础的变化而同步变化"],"answer":"A"},{"id":775,"subject":"马原","code":"15044","type":"single","stem":"从商品二因素与劳动二重性的关系考察,商品经济中能够形成商品价值的劳动是","options":["具体劳动","体力劳动","抽象劳动","脑力劳动"],"answer":"C"},{"id":776,"subject":"马原","code":"15044","type":"single","stem":"下列关于商品价值量决定关系的表述中,正确的是","options":["商品的价值量与社会必要劳动时间成正比,与劳动生产率成反比","商品的价值量与社会必要劳动时间成反比,与劳动生产率成正比","商品的价值量与社会必要劳动时间成正比,与劳动生产率也成正比","商品的价值量与社会必要劳动时间成反比,与劳动生产率也成反比"],"answer":"A"},{"id":777,"subject":"马原","code":"15044","type":"single","stem":"资本主义社会中,劳动力成为商品要具备的基本条件,不包括","options":["劳动者在法律上是自由人","劳动者人身依附于资本家","劳动者没有生活资料来源","劳动者没有任何生产资料"],"answer":"B"},{"id":778,"subject":"马原","code":"15044","type":"single","stem":"资本主义社会经济危机会周期性爆发,但现实中资本主义的再生产周期不一定都要依次经过典型的四个阶段,其中有一个阶段是资本主义经济周期的必经阶段和基本阶段,这个阶段是","options":["危机阶段","萧条阶段","复苏阶段","高涨阶段"],"answer":"A"},{"id":779,"subject":"马原","code":"15044","type":"single","stem":"资本主义国家政权采取分权制衡的组织形式,即三权分立制度,下列选项中不属于这“三权”的是","options":["监督权","司法权","行政权","立法权"],"answer":"A"},{"id":780,"subject":"马原","code":"15044","type":"single","stem":"垄断资本主义形成于19世纪末20世纪初,由于这一时期的垄断资本主义主要以私人垄断资本为基础,因此又被称为","options":["私人垄断资本主义","垄断竞争资本主义","国家垄断资本主义","金融垄断资本主义"],"answer":"A"},{"id":781,"subject":"马原","code":"15044","type":"single","stem":"垄断资本主义国家的垄断组织虽然形式多种多样,但本质都是为了","options":["促进技术进步","获得垄断利润","控制销售市场","增加商品生产"],"answer":"B"},{"id":782,"subject":"马原","code":"15044","type":"single","stem":"第二次世界大战后,资本主义生产资料所有制发生了新的变化,成为居主导地位的所有制形式的是","options":["国家资本所有制","法人资本所有制","员工持股所有制","知识资本所有制"],"answer":"B"},{"id":783,"subject":"马原","code":"15044","type":"single","stem":"与通常意义上对金融资本概念的理解和使用不同,马克思主义政治经济学的金融资本概念有其独特内涵,它指的是垄断资本主义国家","options":["银行自有资本和借入资本的总和","银行和非银行金融机构资本的总和","资本市场上流通的所有货币资本的总和","工业垄断资本和银行垄断资本融合形成的垄断资本"],"answer":"D"},{"id":784,"subject":"马原","code":"15044","type":"single","stem":"无产阶级夺取政权的第一次伟大尝试是","options":["第一国际成立","巴黎公社革命","第二国际成立","十月革命"],"answer":"B"},{"id":785,"subject":"马原","code":"15044","type":"single","stem":"社会主义国家的最高政治领导力量是","options":["工会","社会党","共产党","共青团"],"answer":"C"},{"id":786,"subject":"马原","code":"15044","type":"single","stem":"共产主义社会的根本特征是","options":["人与自然和谐共生","人们的精神境界极大提高","社会关系高度和谐","实现人的自由而全面的发展"],"answer":"D"},{"id":787,"subject":"马原","code":"15044","type":"essay","stem":"简述马克思主义的基本特征","options":[],"answer":"（1）科学的理论(科学性)。马克思主义是对自然、社会和人类思维发展本质和规律的正确反；\n（2）人民的理论(人民性)。人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场；\n（3）实践的理论(实践性)。实践观点是马克思主义首要的和基本的观点；\n（4）发展的理论(发展性)。马克思主义具有与时俱进的理论品质。 马克思主义的基本特征概括就是科学性与革命性的统一。","answerShort":"①科学的理论(科学性)\n②人民的理论(人民性)\n③实践的理论(实践性)\n④发展的理论(发展性)"},{"id":788,"subject":"马原","code":"15044","type":"essay","stem":"如何理解真理与谬误的关系?","options":[],"answer":"它们之间既对立又统一\n（1）二者相互对立。在确定的对象和范围理与谬误的对立是绝对的，与对象相符合的 认识就是真理，与对象不相符合的认识就是谬误。\n（2）二者的对立又是相对的，它们在一定条件下能够相互转化。\n①真理在一定条件下会转化为谬误，任何真理都是在一定范围内、一定条件下才能够成立，超出这个范围，失去特定条件，就会变成谬误。\n②谬误在一定条件下能够向真理转化。任何人都有可能犯错误，但勇于正视、反省、修正错误，终能让错误转化为正确，谬误转化为真理。\n③在批判谬误中发展真理，是谬误向真理转化的另一种形式。谬误可以起到反面教员的作用，警示人们要更加正确地认识世界。","answerShort":"①二者相互对立\n②二者的对立又是相对的，它们在一定条件下能够相互转化\n③真理在一定条件下会转化为谬误\n④谬误在一定条件下能够向真理转化\n⑤在批判谬误中发展真理，是谬误向真理转化的另一种形式"},{"id":789,"subject":"马原","code":"15044","type":"essay","stem":"简述产业资本的运动中，实现资本顺利循环必须具备的两个基本前提条件","options":[],"answer":"产业资本的运动，必须具备两个基本前提条件是\n（1）是产业资本的三种职能形式必须在空间上并存，也就是说，产业资本必须按照一定比例同时存在于货币资本、生产资本和商品资本三种形式中；\n（2）是产业资本的三种职能形式必须在时间上继起，也就是说，产业资本循环中三种职能形式的转化必须保持时间上的依次连续性。","answerShort":"①产业资本的运动，必须具备两个基本前提条件是\n②是产业资本的三种职能形式必须在空间上并存\n③是产业资本的三种职能形式必须在时间上继起"},{"id":790,"subject":"马原","code":"15044","type":"essay","stem":"经济全球化的内涵和主要表现是什么?","options":[],"answer":"（1）含义:是在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产的社会化和国际化程度不断提高的情况下，世界各国，各地区的经济活动越来越超出某一国家和地区的范围而相互联系相互依存的过程。\n（2）表现：生产全球化，贸易全球化，金融全球化。","answerShort":"①含义：是在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生…\n②表现：生产全球化，贸易全球化，金融全球化"},{"id":791,"subject":"马原","code":"15044","type":"essay","stem":"简述马克思主义经典作家预见未来社会的方法论原则。","options":[],"answer":"（1）在揭示人类社会发展一般规律的基础上指明社会发展的方向；\n（2）在剖析资本主义旧世界的过程中阐发未来新世界的特点；\n（3）在社会主义社会发展中不断深化对未来共产主义社会的认识；\n（4）立足于揭示未来社会的一般特征，而不对各种细节作具体描绘。","answerShort":"①在揭示人类社会发展一般规律的基础上指明社会发展的方向\n②在剖析资本主义旧世界的过程中阐发未来新世界的特点\n③在社会主义社会发展中不断深化对未来共产主义社会的认识\n④立足于揭示未来社会的一般特征，而不对各种细节作具体描绘"},{"id":792,"subject":"马原","code":"15044","type":"essay","stem":"试述矛盾的普遍性、矛盾的特殊性的含义以及分析矛盾的特殊性的意义","options":[],"answer":"（1）二者是辩证统一关系。矛盾的普遍性即矛盾的共性，矛盾的特殊性即矛盾的全性矛盾的共性是无条件的，绝对的，矛盾的个性是有条件的、相对的。任何现实存在的事物的矛质都是共目和不性的有机统一，共性或于个性之中，没有离开个性的共性也没有离开共性的并个性一的关系，客现事物固有的辩证法，也是科学的认识方\n（2）省时证关系原理人内文基本原理同各国实际相结合的哲学基础。中国共产党坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，不断推进马克思主义中国化时代化，取得一系列重大理论成果，指引中国革命、建设、改革取得伟大胜利，同时又用中国经验和理论创新丰富发展了马克思主义。","answerShort":"①二者是辩证统一关系\n②省时证关系原理人内文基本原理同各国实际相结合的哲学基础"},{"id":793,"subject":"马原","code":"15044","type":"essay","stem":"什么是社会意识?如何理解社会意识相独立性的含义及表现。","options":[],"answer":"（1）社会意识:是社会存在的反映，是社会生活的精神方面。\n（2）含义:指社会意识在从根本上受到社会存在决定的同时，还具有自身特有的发展形式和发展规律。\n（3）表现:\n①社会意识与社会存在发展具有不完全同步性和不平衡性。\n②社会意识内部各种形式之间存在相互影响且各自具有历史继承性③社会意识对社会存在具有能动的反作用。","answerShort":"①社会意识：是社会存在的反映，是社会生活的精神方面\n②含义：指社会意识在从根本上受到社会存在决定的同时\n③社会意识与社会存在发展具有不完全同步性和不平衡性\n④社会意识内部各种形式之间存在相互影响且各自具有历史继承性\n⑤社会意识对社会存在具有能动的反作用"},{"id":794,"subject":"马原","code":"15044","type":"essay","stem":"试述资本主义为社会主义所代替的历史必然性。","options":[],"answer":"（1）资本主义基本矛盾包含着现代的一切冲突的萌芽\n（2）资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身。\n（3）国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏。","answerShort":"①资本主义基本矛盾包含着现代的一切冲突的萌芽\n②资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身\n③国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏"}];

const LS_PROG = 'bkk_progress_v2';
const LS_POS  = 'bkk_lastpos_v2';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_PROG)) || {}; } catch(e){ progress = {}; }

let curSubject='all', curType='all', curMode='all', order='seq';
let autoNext=false, recite=false;
let filtered=[], idx=0;
let examMode=false, examPaper=[], examIdx=0, examAnswers={};

const T_LABEL={single:'单选',multi:'多选',judge:'判断',essay:'简答',fill:'填空'};
const LETTERS=['A','B','C','D','E','F'];
const SUBJECTS=Array.from(new Set(DATA.map(q=>q.subject)));

function dateStr(off){const d=new Date();d.setDate(d.getDate()+(off||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const TODAY=dateStr(0), YESTERDAY=dateStr(-1);

function save(){ try{ localStorage.setItem(LS_PROG, JSON.stringify(progress)); }catch(e){} }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function isGraded(p){return p && typeof p.correct==='boolean';}
function isWrong(p){return p && p.correct===false;}
function isFav(p){return p && p.fav;}
function setChips(){document.querySelectorAll('.chip[data-t]').forEach(c=>c.classList.toggle('on',c.dataset.t===curType));}
function buildSubjSel(){const s=document.getElementById('subjSel');
  s.innerHTML=['<option value="all">全部科目</option>'].concat(SUBJECTS.map(x=>`<option value="${x}">${x}</option>`)).join('');
  s.value=curSubject;}

function modeMatch(q){
  const p=progress[q.id];
  if(curMode==='all') return true;
  if(curMode==='undone') return !(p&&p.seen);
  if(curMode==='wrongAll') return isWrong(p);
  if(curMode==='wrongToday') return isWrong(p)&&p.wrongDate===TODAY;
  if(curMode==='wrongYest') return isWrong(p)&&p.wrongDate===YESTERDAY;
  if(curMode==='fav') return isFav(p);
  return true;
}
function scopeMatch(q){
  if(curSubject!=='all'&&q.subject!==curSubject) return false;
  if(curType!=='all'&&q.type!==curType) return false;
  return true;
}

function applyFilter(){
  let arr=DATA.map((q,i)=>i).filter(i=>scopeMatch(DATA[i])&&modeMatch(DATA[i]));
  if(order==='rand') arr=shuffle(arr);
  filtered=arr; idx=0;
  savePos();
  renderAll();
}
function savePos(){ try{ localStorage.setItem(LS_POS, JSON.stringify({s:curSubject,t:curType,m:curMode,id: filtered[idx]!==undefined?DATA[filtered[idx]].id:null})); }catch(e){} }

function renderStats(){
  const total=DATA.length; let done=0,ok=0,bad=0,badToday=0,undone=0;
  Object.values(progress).forEach(p=>{ if(p.seen){done++; if(p.correct)ok++; else {bad++; if(p.wrongDate===TODAY)badToday++;}} else undone++; });
  const rate=done?Math.round(ok/done*100):0;
  document.getElementById('totalCount').textContent=total;
  // 备份提醒
  let bk=''; const lb=localStorage.getItem(LS_BK);
  if(!lb){ bk=`<span style="color:var(--bad)">⚠️ 还没备份过，点「💾 备份」存一份</span>`; }
  else {
    const days=Math.floor((new Date(TODAY)-new Date(lb))/86400000);
    bk = days<=0 ? `<span style="color:var(--ok)">✅ 今日已备份</span>`
       : days<=2 ? `<span>上次备份 ${days} 天前</span>`
       : `<span style="color:var(--warn)">⚠️ 已 ${days} 天没备份</span>`;
  }
  document.getElementById('stats').innerHTML=
    `<span>已完成 <b>${done}</b>/${total}</span>`+
    `<span>答对 <b style="color:var(--ok)">${ok}</b></span>`+
    `<span>未做 <b>${undone}</b></span>`+
    `<span>今日错题 <b style="color:var(--bad)">${badToday}</b></span>`+
    `<span>全部错题 <b style="color:var(--bad)">${bad}</b></span>`+
    `<span>正确率 <b>${rate}%</b></span>`+
    `<span>${bk}</span>`;
}

function renderAll(){renderQ();bindOpts();renderStats();renderIndex();updatePos();updateBatchLabel();updateFavBtn();savePos();}
function updateBatchLabel(){const b=document.getElementById('redoBatchBtn');if(b)b.textContent=`↻ 本组全部重做（${filtered.length}题）`;}
function updateFavBtn(){

}

function scopeCounts(){
  const rows=SUBJECTS.map(s=>{
    const o={}; ['single','multi','judge','essay','fill'].forEach(t=>{const n=DATA.filter(q=>q.subject===s&&q.type===t).length; if(n)o[t]=n;});
    return `<tr><td>${s}</td><td>${o.single||0}</td><td>${o.multi||0}</td><td>${o.judge||0}</td><td>${(o.essay||0)+(o.fill||0)}</td></tr>`;
  }).join('');
  return `<table><tr><th>科目</th><th>单选</th><th>多选</th><th>判断</th><th>简答/填空</th></tr>${rows}</table>`;
}

function renderQ(){

      <div class="muted" style="margin-top:8px">可能原因：① 该科目没有这个题型（例如消防经济学没有多选题）；② 错题/收藏还是空的；③ 该范围已全部做完。</div>

function qHTML(q,p){
  const graded=isGraded(p);
  const ansSet=new Set(String(q.answer).split(''));
  const chosenSet=new Set(String(p.chosen||'').split('').filter(Boolean));
  const showAns = graded || p.revealed || recite;
  let body=`<div class="qstem">${q.stem}</div>`;

  if(q.type==='essay'||q.type==='fill'){
    body+=`<div class="hint">先在下面把答案打出来（写要点就行），再点「对照参考答案」。</div>
      <textarea id="myAns" class="myans" placeholder="在这里输入你的答案…（可只写要点，不用写完）"></textarea>`;
    if(showAns){
      body+=`<div class="ansbox"><b>✅ 精简要点（背这个就够）</b>${q.answerShort||q.answer}</div>`;
      if(p.fullShown) body+=`<div class="ansbox full"><b>📖 完整答案（参考）</b>${q.answer||'（原文档未提供答案）'}</div>`;
    }
    if(!graded){
      body+=`<div style="margin-top:10px">
        <button class="btn primary" id="essayReveal">👁 对照参考答案</button>
        ${(q.answerShort&&q.answerShort!==q.answer)?'<button class="btn" id="essayFull">'+(p.fullShown?'收起完整答案':'📖 完整答案')+'</button>':''}
        <button class="btn" id="essayOk" style="color:var(--ok)">✔ 记住了</button>
        <button class="btn" id="essayNo" style="color:var(--bad)">✘ 没记住</button></div>`;
    } else {
      body+=`<div class="hint">你的答案：${(p.myText||'').trim()? '（见上方输入框，已保存）' : '（未输入）'}</div>`;
    }
  } else if(q.type==='judge'){
    const cls=v=>graded?(v===q.answer?'correct':(v===p.chosen?'wrong':'')):(p.chosen===v?'selected':'');
    body+=q.options.map((o,i)=>{const L=LETTERS[i];
      return `<button class="judge-btn ${cls(L)}" data-v="${L}" ${graded?'disabled':''}>${o}</button>`;}).join('');
  } else {
    body+=q.options.map((o,i)=>{
      const L=LETTERS[i]; let cls='';
      if(graded){ if(ansSet.has(L))cls='correct'; else if(chosenSet.has(L))cls='wrong'; cls+=' locked'; }
      else if(chosenSet.has(L))cls='selected';
      return `<div class="opt ${cls}" data-v="${L}"><span class="letter">${L}</span><span>${o}</span></div>`;
    }).join('');
  }

  let fb='';
  if(graded && q.type!=='essay' && q.type!=='fill'){
    if(p.correct) fb=`<div class="feedback ok">✔ 回答正确</div>`;
    else if(q.type==='multi'){
      let ws=false; chosenSet.forEach(c=>{if(!ansSet.has(c))ws=true;});
      fb=ws?`<div class="feedback bad">✘ 有错选（0分）　正确答案：<b>${q.answer}</b></div>`
           :`<div class="feedback reveal">⚠️ 部分正确：选对 ${chosenSet.size}/${ansSet.size} 项　完整答案：<b>${q.answer}</b></div>`;
    } else {
      const i=LETTERS.indexOf(q.answer); const at=q.options[i]?'（'+q.options[i]+'）':'';
      fb=`<div class="feedback bad">✘ 回答错误　正确答案：<b>${q.answer}</b>${at}</div>`;
    }
  } else if(p.revealed && q.type!=='essay' && q.type!=='fill' && !recite){
    fb=`<div class="feedback reveal">💡 参考答案：<b>${q.answer}</b></div>`;
  }
  if(recite && !graded && (q.type==='single'||q.type==='multi'||q.type==='judge')){
    fb=`<div class="feedback reveal">📖 背题模式：正确答案 <b>${q.answer}</b></div>`+fb;
  }

  const hint=(q.type==='multi'&&!graded)?`<div class="hint">多选题：点选所有正确选项，再点「✅ 确认答案」（快捷键 1/2/3/4 可切换）。</div>`
    :((q.type==='essay'||q.type==='fill')&&!graded?`<div class="hint">先自己回忆/口述一遍，再看参考答案，然后如实点「记住了 / 没记住」。</div>`:'');

  return `<div class="qcard">
    <div class="qmeta"><span class="tag ${q.type}">${T_LABEL[q.type]}</span><span class="tag subj">${q.subject}</span>${isFav(p)?'<span class="tag" style="background:#fff7ed;color:#d97706">★ 已收藏</span>':''}</div>
    ${hint}${body}${fb}
  </div>`;
}

function bindOpts(){
  if(!filtered.length||examMode) return;
  const q=DATA[filtered[idx]]; const p=progress[q.id]||{};
  const wrap=document.getElementById('qcardWrap');
  if(isGraded(p)){ addMultiConfirm(); return; }
  if(recite && q.type!=='essay' && q.type!=='fill'){ return; }   // 背题模式不判分
  if(q.type==='single'){ wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>grade(q.id,o.dataset.v)); }
  else if(q.type==='judge'){ wrap.querySelectorAll('.judge-btn').forEach(b=>b.onclick=()=>grade(q.id,b.dataset.v)); }
  else if(q.type==='multi'){
    const cur=new Set(String(p.chosen||'').split('').filter(Boolean));
    wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      const v=o.dataset.v; if(cur.has(v))cur.delete(v); else cur.add(v);
      progress[q.id]={chosen:Array.from(cur).sort().join(''),seen:true}; save(); renderAll();
    });
    addMultiConfirm();
  } else if(q.type==='essay'||q.type==='fill'){
    const ta=wrap.querySelector('#myAns');
    if(ta){
      ta.value=(progress[q.id]||{}).myText||'';
      let timer=null;
      ta.oninput=()=>{ const pp=progress[q.id]||{}; pp.myText=ta.value; progress[q.id]=pp;
        if(timer)clearTimeout(timer); timer=setTimeout(save,400); };
      ta.onblur=()=>{ save(); };
    }
    const rv=wrap.querySelector('#essayReveal'); if(rv)rv.onclick=()=>{const pp=progress[q.id]||{};pp.revealed=true;progress[q.id]=pp;save();renderAll();};
    const fu=wrap.querySelector('#essayFull'); if(fu)fu.onclick=()=>{const pp=progress[q.id]||{};pp.fullShown=!pp.fullShown;progress[q.id]=pp;save();renderAll();};
    const ok=wrap.querySelector('#essayOk'); if(ok)ok.onclick=()=>gradeEssay(q.id,true);
    const no=wrap.querySelector('#essayNo'); if(no)no.onclick=()=>gradeEssay(q.id,false);
  }
}
function addMultiConfirm(){
  if(!filtered.length) return;
  const q=DATA[filtered[idx]], p=progress[q.id]||{};
  if(q.type!=='multi'||isGraded(p)||!p.chosen) return;
  const card=document.getElementById('qcardWrap').querySelector('.qcard');
  if(!card||card.querySelector('.confirm-btn')) return;
  const btn=document.createElement('button');
  btn.className='btn primary confirm-btn'; btn.style.marginTop='10px'; btn.textContent='✅ 确认答案';
  btn.onclick=()=>grade(q.id,String(progress[q.id].chosen||'').split('').sort().join(''));
  card.appendChild(btn);
}

function grade(id,chosen){
  const q=DATA.find(x=>x.id===id); if(!q) return;
  let ok;
  if(q.type==='multi') ok=String(chosen).split('').sort().join('')===String(q.answer).split('').sort().join('');
  else ok=(chosen===q.answer);
  const prev=progress[id]||{};
  progress[id]={chosen,correct:ok,seen:true}; if(prev.fav)progress[id].fav=true;
  if(!ok) progress[id].wrongDate=TODAY;
  save(); renderAll();
  if(ok && autoNext) setTimeout(()=>{ if(idx<filtered.length-1){idx++;renderAll();} },350);
}
function gradeEssay(id,ok){
  const prev=progress[id]||{};
  progress[id]={chosen:ok?'记住了':'没记住',correct:ok,seen:true};
  if(prev.fav)progress[id].fav=true;
  if(!ok) progress[id].wrongDate=TODAY;
  save(); renderAll();
  if(ok && autoNext) setTimeout(()=>{ if(idx<filtered.length-1){idx++;renderAll();} },350);
}
function reveal(){
  if(!filtered.length) return;
  const q=DATA[filtered[idx]], p=progress[q.id]||{};
  if(isGraded(p)) return;
  p.revealed=true; progress[q.id]=p; save(); renderAll();
}
function toggleFav(){
  if(!filtered.length) return;
  const q=DATA[filtered[idx]], p=progress[q.id]||{};
  if(p.fav) delete p.fav; else p.fav=true;
  progress[q.id]=p; save(); renderAll();
}

function renderIndex(){
  const grid=document.getElementById('indexgrid');
  grid.innerHTML=filtered.map((qi,i)=>{
    const q=DATA[qi],p=progress[q.id]||{};
    let cls=''; if(isGraded(p))cls=p.correct?'done-ok':'done-bad'; if(i===idx)cls+=' cur'; if(isFav(p))cls+=' fav';
    return `<div class="idx ${cls}" data-i="${i}" title="#${q.id}">${i+1}</div>`;
  }).join('');
  grid.querySelectorAll('.idx').forEach(el=>el.onclick=()=>{idx=+el.dataset.i;renderAll();});
}
function updatePos(){
  const doneN=filtered.filter(i=>isGraded(progress[DATA[i].id])).length;
  document.getElementById('posLabel').textContent=filtered.length
    ? `第 ${idx+1} / ${filtered.length} 题　（本组已答 ${doneN}，未答 ${filtered.length-doneN}）` : '0 / 0 题';
  document.getElementById('pbar').style.width=filtered.length?Math.round((idx+1)/filtered.length*100)+'%':'0%';
}
function next(){ if(idx<filtered.length-1){idx++;renderAll();} }
function prev(){ if(idx>0){idx--;renderAll();} }
function skipUndone(){
  for(let k=1;k<=filtered.length;k++){
    const j=(idx+k)%filtered.length;
    if(!isGraded(progress[DATA[filtered[j]].id])){ idx=j; renderAll(); return; }
  }
  alert('本组题目都已作答完成 👍');
}

// ---------- exam ----------
function openExam(){document.getElementById('examModal').classList.remove('hidden');}
function startExam(){
  const ns=Math.max(0,+document.getElementById('nSingle').value),nm=Math.max(0,+document.getElementById('nMulti').value),nj=Math.max(0,+document.getElementById('nJudge').value);
  const pool=DATA.map((q,i)=>i).filter(i=>curSubject==='all'||DATA[i].subject===curSubject);
  const pick=(t,n)=>shuffle(pool.filter(i=>DATA[i].type===t)).slice(0,n);
  examPaper=shuffle([...pick('single',ns),...pick('multi',nm),...pick('judge',nj)]);
  if(!examPaper.length){alert('请设置抽题数量');return;}
  examAnswers={};examIdx=0;examMode=true;
  document.getElementById('examModal').classList.add('hidden');
  document.getElementById('revealBtn').textContent='🏁 交卷'; setExamNav(true); renderExam();
}
function setExamNav(on){
  const pf=()=>{if(examIdx>0){examIdx--;renderExam();}},nf=()=>{if(examIdx<examPaper.length-1){examIdx++;renderExam();}};
  ['prevBtn','prevBtn2'].forEach(id=>document.getElementById(id).onclick=on?pf:prev);
  ['nextBtn','nextBtn2'].forEach(id=>document.getElementById(id).onclick=on?nf:next);
  document.getElementById('skipUndoneBtn').onclick=on?()=>{}:skipUndone;
  document.getElementById('redoOneBtn').onclick=on?()=>{}:redoOne;
}
function renderExam(){
  const q=DATA[examPaper[examIdx]];
  document.getElementById('qcardWrap').innerHTML=qHTML(q,{chosen:examAnswers[q.id]||''});
  bindExamOpts();
  document.getElementById('posLabel').textContent=`考试中 · 第 ${examIdx+1} / ${examPaper.length} 题`;
  document.getElementById('pbar').style.width=Math.round((examIdx+1)/examPaper.length*100)+'%';
}
function bindExamOpts(){
  const q=DATA[examPaper[examIdx]],wrap=document.getElementById('qcardWrap');
  if(q.type==='single'){wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{examAnswers[q.id]=o.dataset.v;goNextExam();});}
  else if(q.type==='judge'){wrap.querySelectorAll('.judge-btn').forEach(b=>b.onclick=()=>{examAnswers[q.id]=b.dataset.v;goNextExam();});}
  else if(q.type==='multi'){
    const set=new Set(String(examAnswers[q.id]||'').split('').filter(Boolean));
    wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{const v=o.dataset.v;if(set.has(v))set.delete(v);else set.add(v);examAnswers[q.id]=Array.from(set).sort().join('');renderExam();});
    const card=wrap.querySelector('.qcard');
    if(card&&!card.querySelector('.confirm-btn')){
      const b=document.createElement('button');b.className='btn primary confirm-btn';b.style.marginTop='10px';b.textContent='✅ 确认并下一题';
      b.onclick=()=>{if(examAnswers[q.id]===undefined)examAnswers[q.id]='';goNextExam();};
      card.appendChild(b);
    }
  }
}
function goNextExam(){ if(examIdx<examPaper.length-1){examIdx++;} renderExam(); }
function multiScore(q,chosen){
  if(!chosen) return 0;
  const cs=new Set(String(chosen).split('').filter(Boolean)),as=new Set(String(q.answer).split(''));
  for(const c of cs){ if(!as.has(c)) return 0; }
  return 2*cs.size/as.size;
}
function submitExam(){
  let total=0; const by={single:{n:0,s:0,f:0},multi:{n:0,s:0,f:0},judge:{n:0,s:0,f:0}};
  examPaper.forEach(qi=>{
    const q=DATA[qi],a=examAnswers[q.id]||''; let s=0,full=false;
    if(q.type==='single'){s=(a===q.answer)?1:0;full=(a===q.answer);}
    else if(q.type==='judge'){s=(a===q.answer)?1:0;full=(a===q.answer);}
    else {s=multiScore(q,a);full=(String(a).split('').sort().join('')===String(q.answer).split('').sort().join(''));}
    total+=s;by[q.type].n++;by[q.type].s+=s;if(full)by[q.type].f++;
    const prev=progress[q.id]||{};
    progress[q.id]={chosen:a,correct:full,seen:true}; if(prev.fav)progress[q.id].fav=true;
    if(!full)progress[q.id].wrongDate=TODAY;
  });
  save();
  const max=by.single.n*1+by.multi.n*2+by.judge.n*1;
  const pct=max?Math.round(total/max*100):0,pass=total>=max*0.6,f=x=>Math.round(x*10)/10;
  document.getElementById('resultBody').innerHTML=`
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:44px;font-weight:700;color:${pass?'var(--ok)':'var(--bad)'}">${f(total)} / ${f(max)} 分</div>
      <div class="muted">正确率 ${pct}%　${pass?'✅ 达到及格线(60%)':'❌ 未达 60%，继续刷错题'}</div>
    </div>
    <table>
      <tr><th>题型</th><th>全对</th><th>得分</th></tr>
      <tr><td>单选</td><td>${by.single.f}/${by.single.n}</td><td>${f(by.single.s)}</td></tr>
      <tr><td>多选</td><td>${by.multi.f}/${by.multi.n}</td><td>${f(by.multi.s)}</td></tr>
      <tr><td>判断</td><td>${by.judge.f}/${by.judge.n}</td><td>${f(by.judge.s)}</td></tr>
      <tr><td><b>合计</b></td><td>—</td><td><b>${f(total)} / ${f(max)}</b></td></tr>
    </table>`;
  examMode=false; setExamNav(false);
  document.getElementById('revealBtn').textContent='💡 显示答案';
  document.getElementById('resultModal').classList.remove('hidden');
  applyFilter();
}

  document.getElementById('modeSel').value='wrongToday';curMode='wrongToday';

function redoOne(){

  delete progress[DATA[filtered[idx]].id]; save(); renderAll();
}
function redoBatch(){
  const ids=filtered.map(i=>DATA[i].id);
  if(!ids.length){alert('当前范围没有题目');return;}
  const inWrong=(curMode==='wrongToday'||curMode==='wrongYest'||curMode==='wrongAll');

  ids.forEach(id=>delete progress[id]); save();
  if(inWrong){curMode='all';document.getElementById('modeSel').value='all';}

function exportGroup(){
  if(!filtered.length){alert('当前范围没有题目');return;}

    lines.push(`> 答案：${q.answer.replace(/\n/g,'\n> ')}\n`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download=`导出_${curSubject}_${curType}_${filtered.length}题.md`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function exportProgress(){

  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});

  a.href=url;a.download='自考进度备份_'+dateStr(0)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  try{ localStorage.setItem(LS_BK, TODAY); }catch(e){}
  renderStats();
}
function importProgress(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);const p=(d&&typeof d==='object')?(d.progress||d):null;
    if(p&&typeof p==='object'&&!Array.isArray(p)){progress=p;save();applyFilter();alert('已恢复 '+Object.keys(progress).length+' 条记录');}
    else alert('备份文件格式不对');}catch(e){alert('读取失败：'+e.message);}};
  r.readAsText(file);
}

document.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{curType=c.dataset.t;setChips();applyFilter();});
document.getElementById('subjSel').onchange=e=>{curSubject=e.target.value;applyFilter();};
document.getElementById('modeSel').onchange=e=>{curMode=e.target.value;applyFilter();};
document.getElementById('orderSel').onchange=e=>{order=e.target.value;applyFilter();};
document.getElementById('autoNextChk').onchange=e=>{autoNext=e.target.checked;};
document.getElementById('reciteChk').onchange=e=>{recite=e.target.checked;renderAll();};
document.getElementById('prevBtn').onclick=prev; document.getElementById('nextBtn').onclick=next;
document.getElementById('prevBtn2').onclick=prev; document.getElementById('nextBtn2').onclick=next;
document.getElementById('skipUndoneBtn').onclick=skipUndone;

document.getElementById('resetBtn').onclick=()=>{if(confirm('确定清空全部进度和错题记录吗？')){progress={};save();applyFilter();}};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  if(examMode) return;
  if(e.key==='ArrowRight'){next();return;}
  if(e.key==='ArrowLeft'){prev();return;}
  if(e.key===' '){e.preventDefault();reveal();return;}
  if(e.key==='f'||e.key==='F'){toggleFav();return;}
  if(!filtered.length) return;
  const q=DATA[filtered[idx]], p=progress[q.id]||{};
  if(isGraded(p)) return;
  const n=parseInt(e.key,10);
  if(!isNaN(n)&&n>=1&&n<=q.options.length){
    const L=LETTERS[n-1];
    if(q.type==='single') grade(q.id,L);
    else if(q.type==='judge') grade(q.id,L);
    else if(q.type==='multi'){
      const cur=new Set(String(p.chosen||'').split('').filter(Boolean));
      if(cur.has(L))cur.delete(L);else cur.add(L);
      progress[q.id]={chosen:Array.from(cur).sort().join(''),seen:true}; if(p.fav)progress[q.id].fav=true;
      save(); renderAll();
    }
  }
  if((e.key==='Enter')&&q.type==='multi'&&p.chosen) grade(q.id,String(p.chosen).split('').sort().join(''));
});

// ---- init: 恢复上次筛选与位置 ----
(function init(){
  let pos=null; try{ pos=JSON.parse(localStorage.getItem(LS_POS)); }catch(e){}
  if(pos&&pos.s){ curSubject=pos.s; curType=pos.t||'all'; curMode=pos.m||'all'; }
  buildSubjSel(); setChips();
  document.getElementById('modeSel').value=curMode;
  applyFilter();
  if(pos&&pos.id){ const k=filtered.findIndex(i=>DATA[i].id===pos.id); if(k>=0){ idx=k; renderAll(); } }
})();
</script>
