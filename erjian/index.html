<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二建 · 知识卡</title>
<style>
  *{box-sizing:border-box}
  :root{--bg:#F2F2F7;--card:#FFF;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
        --sep:rgba(60,60,67,.29);--blue:#007AFF;--green:#34C759;--fill:rgba(120,120,128,.12)}
  @media (prefers-color-scheme: dark){
    :root{--bg:#000;--card:#1C1C1E;--label:#FFF;--label2:rgba(235,235,245,.6);
          --label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24)}
  }
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto;padding:12px 16px 28px;max-width:640px;background:var(--bg);color:var(--label);
       font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased}
  header{margin:8px 0 18px}
  h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .sub{font-size:13px;color:var(--label2);margin:0}
  a.subject{display:block;background:var(--card);border-radius:12px;padding:16px;margin-bottom:10px;
            text-decoration:none;color:var(--label);transition:transform .1s ease}
  a.subject:active{transform:scale(.99)}
  a.subject.off{opacity:.6}
  .row{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
  .name{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .ch{font-size:13px;color:var(--label2);background:var(--fill);border:0;border-radius:6px;
      padding:1px 8px;white-space:nowrap}
  .meta{font-size:13px;color:var(--label2);letter-spacing:-.01em}
  .bar{height:3px;background:var(--fill);border-radius:2px;margin-top:11px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
  footer{margin-top:18px;font-size:12px;color:var(--label3);line-height:1.8;text-align:center}
</style>
</head>
<body>
<header>
  <h1>二建 · 知识卡</h1>
  <p class="sub">2027 版教材 · 按节出卡 · 手机直接刷</p>
</header>

<a class="subject" href="sw/">
  <div class="row">
    <span class="name">机电工程管理与实务</span>
    <span class="ch">16 章</span>
  </div>
  <div class="meta">已开 12 节 · 411 张卡 · 72 道验收</div>
  <div class="bar"><i style="width:75%"></i></div>
</a>

<a class="subject off" href="#">
  <div class="row">
    <span class="name">建设工程施工管理</span>
    <span class="ch">8 章</span>
  </div>
  <div class="meta">未开始 · 计划 W1 起并行</div>
  <div class="bar"><i style="width:0%"></i></div>
</a>

<a class="subject off" href="#">
  <div class="row">
    <span class="name">建设工程法规及相关知识</span>
    <span class="ch">10 章</span>
  </div>
  <div class="meta">未开始 · 计划 W14 起并行</div>
  <div class="bar"><i style="width:0%"></i></div>
</a>

<footer>
  先看问题自己答，再翻面核对。<br>
  每节右上角「验收」，6 题全对才算通关。<br>
  进度存在本机浏览器，换设备不同步。
</footer>
</body>
</html>
