<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自考本科 · 四科刷题工具 v2</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--text:#1f2933;--muted:#7b8794;--brand:#2563eb;--brand-dk:#1d4ed8;
    --ok:#16a34a;--ok-bg:#e7f6ec;--bad:#dc2626;--bad-bg:#fdeaea;--warn:#b45309;--warn-bg:#fdf3e3;--fav:#d97706;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
  header{background:var(--brand-dk);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .sub{font-size:12px;opacity:.85}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .toolbar label{font-size:13px;color:var(--muted)}
  select,input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;user-select:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:var(--brand-dk)}
  .btn.danger{color:var(--bad);border-color:#f3c1c1}
  .btn.redo-btn{color:#475569;border-color:#b9c6d6;border-style:dashed}
  .btn.fav-on{color:var(--fav);border-color:#f3cf9a;background:#fffaf0}
  .switch{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
  .stats b{color:var(--text);font-size:15px}
  .progressbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .progressbar>div{height:100%;background:var(--brand);transition:width .2s}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px}
  .qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .tag{font-size:12px;padding:2px 9px;border-radius:6px;background:#eef2f7;color:#49586a}
  .tag.single{background:#e0edff;color:#1d4ed8}
  .tag.multi{background:#fdf0e0;color:#b45309}
  .tag.judge{background:#e7f6ec;color:#15803d}
  .tag.essay,.tag.fill{background:#f3e8ff;color:#7e22ce}
  .tag.subj{background:#e0f2fe;color:#0369a1}
  .tag.no{background:#f1f5f9;color:#94a3b8}
  .qstem{font-size:16px;font-weight:500;margin-bottom:12px;white-space:pre-wrap}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .opt:hover{border-color:#bcd;background:#fafcff}
  .opt .letter{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
  .opt.selected{border-color:var(--brand);background:#eff4ff}
  .opt.selected .letter{background:var(--brand);color:#fff}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .letter{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .letter{background:var(--bad);color:#fff}
  .opt.locked{cursor:default}
  .judge-btn{display:inline-flex;padding:10px 30px;border-radius:9px;border:1.5px solid var(--line);cursor:pointer;font-size:15px;margin-right:10px;font-weight:600;background:#fff}
  .judge-btn.selected{border-color:var(--brand);background:#eff4ff;color:var(--brand)}
  .judge-btn.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .judge-btn.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .feedback{margin-top:12px;padding:11px 13px;border-radius:9px;font-size:14px}
  .feedback.ok{background:var(--ok-bg);color:#14532d;border:1px solid #bfe6c9}
  .feedback.bad{background:var(--bad-bg);color:#7f1d1d;border:1px solid #f3c1c1}
  .feedback.reveal{background:var(--warn-bg);color:#713f12;border:1px solid #f2d7a8}
  .feedback.answer{background:#eef4ff;color:#1e3a8a;border:1px solid #c7d7f5;margin-top:8px;white-space:pre-wrap}
  .myans{width:100%;min-height:96px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
    font-size:15px;line-height:1.7;font-family:inherit;resize:vertical;background:#fcfdff}
  .myans:focus{outline:none;border-color:var(--brand);background:#fff}
  .ansbox{margin-top:8px;padding:11px 13px;border-radius:9px;background:#eef4ff;color:#1e3a8a;border:1px solid #c7d7f5;white-space:pre-wrap;font-size:14.5px}
  .ansbox.full{background:#f8fafc;color:#334155;border-color:#e2e8f0;font-size:13.5px}
  .ansbox b{display:block;margin-bottom:4px}
  .nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
  .empty{text-align:left}
  .empty h3{margin:0 0 8px;color:var(--text)}
  .empty table{margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600}
  .indexgrid{display:flex;flex-wrap:wrap;gap:4px;max-height:230px;overflow:auto}
  .idx{width:31px;height:31px;border-radius:6px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;position:relative}
  .idx.done-ok{background:var(--ok-bg);border-color:#9fd6b0;color:#14532d}
  .idx.done-bad{background:var(--bad-bg);border-color:#f0b4b4;color:#7f1d1d}
  .idx.fav::after{content:'★';position:absolute;top:-6px;right:-3px;font-size:10px;color:var(--fav)}
  .idx.cur{outline:2px solid var(--brand)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .panel h3{margin:0 0 8px;font-size:15px}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:#fff;border-radius:14px;max-width:660px;width:100%;max-height:85vh;overflow:auto;padding:22px}
  .modal h2{margin:0 0 12px}
  .hint{font-size:12px;color:var(--muted);margin-bottom:8px}
  kbd{background:#eef2f7;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px;font-family:inherit}
  .btn,.chip,.opt,.judge-btn,.idx{touch-action:manipulation}
  html{-webkit-text-size-adjust:100%}

  /* ============ 手机适配 ============ */
  @media (max-width: 760px){
    body{font-size:15px}
    header{padding:8px 12px;gap:6px}
    header h1{font-size:15px}
    header .sub{font-size:11px;line-height:1.35}
    .wrap{padding:10px 10px 92px}
    .toolbar{padding:8px;gap:6px;border-radius:9px;margin-bottom:8px}
    .toolbar label{font-size:12px}
    select{font-size:15px;padding:7px 8px;flex:1 1 auto;min-width:0}
    .chip{padding:7px 12px;font-size:14px}
    .btn{padding:10px 12px;font-size:14px}
    .hintbar{display:none}                 /* 手机没有键盘，隐藏快捷键提示 */
    .stats{gap:8px;font-size:12px;margin-bottom:8px}
    .stats b{font-size:14px}
    .progressbar{margin-bottom:8px}
    .nav{gap:6px}
    .nav>div{display:flex;gap:6px;flex:1;justify-content:center}
    .nav .btn{flex:1;text-align:center;justify-content:center}
    #posLabel{font-size:12px}
    .qcard{padding:14px 13px;border-radius:11px}
    .qmeta{margin-bottom:8px}
    .qstem{font-size:16.5px;line-height:1.65;margin-bottom:12px}
    .opt{padding:13px 12px;min-height:48px;font-size:15.5px;margin-bottom:10px}
    .opt .letter{width:26px;height:26px;font-size:14px}
    .judge-btn{flex:1;margin-right:0;padding:14px 0;font-size:16px}
    .feedback{font-size:14.5px;padding:11px 12px}
    .hint{font-size:12px}
    .indexgrid{max-height:170px;gap:5px}
    .idx{width:35px;height:35px;font-size:12px}
    .panel{padding:12px}
    .modal{padding:16px;border-radius:12px}
    .modal h2{font-size:16px}
    #examModal table input[type=number]{width:78px;font-size:16px}
    /* 底部固定操作栏，拇指可达 */
    #navBottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
      padding:8px 10px;margin:0;box-shadow:0 -2px 10px rgba(15,23,42,.06);
      padding-bottom:calc(8px + env(safe-area-inset-bottom))}
    #navBottom .btn{padding:12px 10px;font-size:15px}
  }
  @media (max-width: 400px){
    .qstem{font-size:16px}
    .opt{font-size:15px}
    .btn{padding:9px 10px;font-size:13.5px}
  }
</style>
</head>
<body>
<header>
  <h1>自考本科 · 四科刷题工具</h1>
  <span class="sub">消防经济学 · 习概 · 近代史纲要 · 马原　共 <span id="totalCount"></span> 题</span>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <label>科目</label>
    <select id="subjSel"></select>
    <label>题型</label>
    <span class="chip on" data-t="all">全部</span>
    <span class="chip" data-t="single">单选</span>
    <span class="chip" data-t="multi">多选</span>
    <span class="chip" data-t="judge">判断</span>
    <span class="chip" data-t="essay">简答</span>
    <label>范围</label>
    <select id="modeSel">
      <option value="all">全部题目</option>
      <option value="undone">只看未做</option>
      <option value="wrongToday">今日错题</option>
      <option value="wrongYest">昨日错题</option>
      <option value="wrongAll">全部错题</option>
      <option value="fav">★ 我的收藏</option>
    </select>
    <label>顺序</label>
    <select id="orderSel"><option value="seq">顺序</option><option value="rand">随机</option></select>
    <label class="switch"><input type="checkbox" id="autoNextChk"> 答对自动下一题</label>
    <label class="switch"><input type="checkbox" id="reciteChk"> 背题模式</label>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="examBtn">📝 模拟考试</button>
    <button class="btn" id="wrongbookBtn">📕 今日错题</button>
    <button class="btn" id="favBtn">★ 收藏本题</button>
    <button class="btn" id="exportBtn">⬇ 导出本组</button>
    <button class="btn" id="backupBtn">💾 备份</button>
    <button class="btn" id="restoreBtn">📥 恢复</button>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
    <button class="btn danger" id="resetBtn">清空进度</button>
  </div>
  <div class="muted hintbar" style="font-size:12px;margin-bottom:12px">
    快捷键：<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 选答案　<kbd>空格</kbd> 显示答案　<kbd>→</kbd> 下一题　<kbd>←</kbd> 上一题　<kbd>F</kbd> 收藏
    ｜进度存在本机浏览器，每天刷完点「💾 备份」
  </div>

  <div class="progressbar"><div id="pbar" style="width:0%"></div></div>

  <div class="nav">
    <button class="btn" id="prevBtn">← 上一题</button>
    <div><span id="posLabel" class="muted"></span></div>
    <div>
      <button class="btn" id="skipUndoneBtn">跳到未做</button>
      <button class="btn" id="nextBtn">下一题 →</button>
    </div>
  </div>

  <div id="qcardWrap"></div>

  <div class="nav" id="navBottom">
    <button class="btn" id="prevBtn2">← 上一题</button>
    <div>
      <button class="btn primary" id="revealBtn">💡 显示答案</button>
      <button class="btn red" id="redoOneBtn">↩ 重做本题</button>
    </div>
    <button class="btn" id="nextBtn2">下一题 →</button>
  </div>

  <div class="panel">
    <h3>答题卡（绿=对 · 红=错 · ★=收藏 · 白=未做）
      <button class="btn redo-btn" id="redoBatchBtn" style="float:right;padding:4px 12px">↻ 本组全部重做（N题）</button>
    </h3>
    <div class="indexgrid" id="indexgrid"></div>
  </div>
</div>

<div class="modal-bg hidden" id="examModal">
  <div class="modal">
    <h2>模拟考试设置（选择题计分）</h2>
    <p class="muted">按当前科目抽题；简答/填空建议用「题型=简答」单独背诵自评。</p>
    <table>
      <tr><th>题型</th><th>抽题数</th><th>每题分值</th></tr>
      <tr><td>单选题</td><td><input type="number" id="nSingle" value="30" min="0" max="400"></td><td>1分</td></tr>
      <tr><td>多选题</td><td><input type="number" id="nMulti" value="10" min="0" max="400"></td><td>2分</td></tr>
      <tr><td>判断题</td><td><input type="number" id="nJudge" value="10" min="0" max="400"></td><td>1分</td></tr>
    </table>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="examCancel">取消</button>
      <button class="btn primary" id="examStart">开始考试</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="resultModal">
  <div class="modal">
    <h2>考试结果</h2>
    <div id="resultBody"></div>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="resultClose">关闭</button>
    </div>
  </div>
</div>

系数简明易懂易运用"},{"id":36,"subject":"消防经济学","code":"14434","type":"essay","stem":"某大型商场安装水喷淋系统的每年成本是40万元。当安装水喷淋系统时，全额投保年保险费用是208万元；当不安装水喷淋时全额投保的年保险费用是542万元；当安装水喷淋系统不投保时，火灾年损失是44万元；当不安装水喷淋系统且不投保时，火灾年损失是354万元。据此计算年总成本并分析方案。","options":[],"answer":"根据上述数据可知：\n方案1：无水喷淋，全额投保\n总年成本=542万元\n方案2：有水喷淋、全额投保\n总年成本=40+208=248万元\n方案3：无水喷淋、不投保\n总年成本=354万元\n方案4 ：有水喷淋、不投保\n总年成本=40+44=84万元\n根据以上结果分析所得；\n当不投保时，方案4总年成本＜方案3总年成本，故安装水喷淋系统是合适的。\n当全额投保时，方案2的总年成本＜ 方案1总年成本，故安装水喷淋系统是合适的。\n当没有水喷淋系统时候，方案3所年成本＜ 方案1总年成本，该厂房不投保是合适的。\n当有水喷淋系统时候，方案4总年成本＜ 方案2总年成本，该厂房不投保是合适的。\n故该厂房应安装水喷淋系统不投保。","answerShort":"①根据上述数据可知：方案1：无水喷淋\n②当不投保时，方案4总年成本＜方案3总年成本，故安装水喷淋系统是合适的\n③当全额投保时，方案2的总年成本＜方案1总年成本，故安装水喷淋系统是合适的"},{"id":37,"subject":"消防经济学","code":"14434","type":"single","stem":"下面哪项不是研究消防经济学重要作用的体现","options":["有助于科学认识消防投资的经济效益","为消防投资决策提供理论和方法上的指导","为性能化防火设计提供指导","盲目增加消防投资"],"answer":"D"},{"id":38,"subject":"消防经济学","code":"14434","type":"single","stem":"发现潜在火源属于","options":["灾前风险管理","火灾时的风险管理","火灾后的风险管理","火灾风险评估"],"answer":"A"},{"id":39,"subject":"消防经济学","code":"14434","type":"single","stem":"下面关于火灾与社会经济发展之间的总体规律表述正确的是","options":["经济发展初期，火灾次数以及造成的损失相对较小","经济发展初期，火灾次数以及造成的损失相对较大","经济平稳发展期间，火灾发生率持续上涨","经济平稳发展期间，火灾损失逐步增加"],"answer":"A"},{"id":40,"subject":"消防经济学","code":"14434","type":"single","stem":"消防工程费用的预算主要包括直接费、间接费和","options":["人工费","材料费","计划利润","施工管理费"],"answer":"C"},{"id":41,"subject":"消防经济学","code":"14434","type":"single","stem":"下列可以提高最优安全度的是","options":["降低边际效益","提高边际成本","提高边际效益的同时降低边际成本","降低边际效益的同时提高边际成本"],"answer":"C"},{"id":42,"subject":"消防经济学","code":"14434","type":"single","stem":"工程类的消防技术措施主要可分为主动性措施和被动性措施，以下属于被动性措施的是","options":["提高建筑构件耐火性能的技术","购买全额保险","提高火灾探测报警技术","提高烟气控制技术"],"answer":"A"},{"id":43,"subject":"消防经济学","code":"14434","type":"single","stem":"下列不是设置水喷淋系统的优势的是","options":["减少人员的伤亡","减少经济损失","增加保险费","提高建筑物的整体消防安全"],"answer":"C"},{"id":44,"subject":"消防经济学","code":"14434","type":"single","stem":"消防投资预测的方法主要分为数学方法、计算机分析方法等，最常用的数学预测方法是","options":["时间序列法","回归分析法","灰色预测法","模糊数学法"],"answer": ubject":"消防经济学","code":"14434","type":"essay","stem":"简述影响灭火经济效益的因素","options":[],"answer":"灭火救援人员的因素，主要是消防警力严重不足和灭火指挥员素质有待加强\n消防装备建设存在的问题\n城市消防站布局不合理\n消防灭火救援力量配置不合理\n资源配置水平有待提高\n其他问题","answerShort":"灭火救援人员的因素"},{"id":69,"subject":"消防经济学","code":"14434","type":"essay","stem":"该表是某厂房考虑水喷淋和保险的四种选择方案，计算各方案的总年成本并进行分析。","options":[],"answer":"方案 A 无水喷淋，不投保\n总年成本=火灾年损失=21240 元\n方案 B 有水喷淋、不投保\n总年成本=水喷淋年成本+火灾年损失=2400+2640=5040 元\n方案 C 无水喷淋、全额投保\n总年成本=全额投保的年保险费用=32500 元\n方案 D 有水喷淋、全额投保\n总年成本=2400+1250=14900 元\n根据以上结果分析所得；\n当不投保时，B 方案总年成本＜ A 方案总年成本，故安装水喷淋系统是合适的。\n当投保时，D 方案所年成本＜ C 方案总年成本，故安装水喷淋系统是合适的。\n当没有水喷淋系统时候，A 方案所年成本＜ C 方案总年成本，该厂房不投保是合\n适的。\n当有水喷淋系统时候，D 方案总年成本＜ B 方案总年成本，该厂房不投保是合适\n的。\n故该厂房应安装水喷淋系统不投保。","answerShort":"①方案A无水喷淋\n②当不投保时，B方案总年成本＜A方案总年成本，故安装水喷淋系统是合适的\n③当投保时，D方案所年成本＜C方案总年成本，故安装水喷淋系统是合适的"},{"id":70,"subject":"消防经济学","code":"14434","type":"single","stem":"我国第一部比较系统的对消防经济学领域进行研究的专著是","options":["罗云《安全经济学》","徐凤臣《消防经济学》","田玉敏《消防经济学》","赵国杰《工程经济学》"],"answer":"B"},{"id":71,"subject":"消防经济学","code":"14434","type":"single","stem":"下列属于火灾保险被保险方义务的是","options":["按时交纳保险费","保险标的如果变更用途可不通知保险方","一旦发生火灾，被保险方不用采取措施进行抢救，等着赔付即可","不需要对火灾风险进行及时排除"],"answer":"A"},{"id":72,"subject":"消防经济学","code":"14434","type":"single","stem":"自留风险的等级在保险合同上称为","options":["保险金","免赔额","折扣率","收益率"],"answer":"B"},{"id":73,"subject":"消防经济学","code":"14434","type":"single","stem":"火灾保险的特点是","options":["承保财产金额巨大","承保财产的存放地点不是固定的","保险标的可以是处于流动状态的货物","保险标的相当广泛"],"answer":"D"},{"id":74,"subject":"消防经济学","code":"14434","type":"single","stem":"合理设置自动探测系统的条件是","options":["安装自动探测系统得到的效益<设置自动探测系统的成本费用","安装自动探测系统得到的效益=设置自动探测系统的成本费用","安装自动探测系统得到的效益>设置自动探测系统的成本费用","安装自动探测系统得到的效益>设置自动探测系统后的保险费用"],"answer":"C"},{"id":75,"subject":"消防经济学","code":"14434","type":"single","stem":"根据生命价值的保险评价法，假设一个人有x 元的保险单，那么这个人隐含的生命价值为","options":["x元","2x元","x²元","x³元"],"answer":"A"},{"id":76,"subject":"消防经济学","code":"14434","type":"single","stem":"图为边际投入MC与边际效益MR的关系，最优安全度为","options":["0","S0","S1","S2"],"answer":"B"},{"id":77,"subject": ct":"消防经济学","code":"14434","type":"single","stem":"设备从全新投入使用开始，到不能再使用而报废为止的全部时间称为","options":["经济寿命","技术寿命","折旧寿命","物理寿命"],"answer":"D"},{"id":142,"subject":"消防经济学","code":"14434","type":"judge","stem":"对整机性能尚可，有局部缺陷，个别技术经济指标落后的设备，应该采用较先进的设备尽早替代。","options":["对","错"],"answer":"错"},{"id":143,"subject":"消防经济学","code":"14434","type":"judge","stem":"消防投资预测的基本方法主要分为数学方法、计算机分析方法等。","options":["对","错"],"answer":"对"},{"id":144,"subject":"消防经济学","code":"14434","type":"judge","stem":"安全等级越高的建筑物，其资产所有者对保险公司的依赖性就越强。","options":["对","错"],"answer":"错"},{"id":145,"subject":"消防经济学","code":"14434","type":"judge","stem":"随着火灾发生概率的降低，最佳防火间距随之增加。","options":["对","错"],"answer":"错"},{"id":146,"subject":"消防经济学","code":"14434","type":"essay","stem":"稀缺法则","options":[],"answer":"个人期望得到许多商品和追求许多目标，对每个人来说，至少有些商品是稀缺的，在一个社会里，每个人每个人都不可能满足自己的全部需要。因此社会中的稀缺是普遍存在的。","answerShort":"①个人期望得到许多商品和追求许多目标，对每个人来说，至少有些商品是稀缺的\n②因此社会中的稀缺是普遍存在的"},{"id":147,"subject":"消防经济学","code":"14434","type":"essay","stem":"总效用","options":[],"answer":"是指消费者在一定时间内从一定数量的消防产品（或一定消防投资额）消费中所得到的效用量的总和。","answerShort":"是指消费者在一定时间内从一定数量的消防产品（或一定消防投资额）消费中所得到的效用…"},{"id":148,"subject":"消防经济学","code":"14434","type":"essay","stem":"简述火灾保险被保险方的义务。","options":[],"answer":"根据保险费率规章的规定，按时交纳保险费；\n遵守国家有关的《消防法规》，维护劳动者和保险财产的安全，对火灾风险及时排除，否则保险方不负责赔偿；\n保险标的如果变更用途或增加危险程度，应及时告知保险方，按照规定增收保险费，否则由此引起的火灾损失，保险方不负责赔偿；\n一旦发生火灾，被保险方必须首先采取一切措施进行抢救，避免扩大损失，同时及时向保险方通报，以便及时处理，由此产生的费用又保险方负责，否则由被保险方自负。","answerShort":"①根据保险费率规章的规定，按时交纳保险费\n②遵守国家有关的《消防法规》，维护劳动者和保险财产的安全，对火灾风险及时排除\n③保险标的如果变更用途或增加危险程度，应及时告知保险方，按照规定增收保险费"},{"id":149,"subject":"消防经济学","code":"14434","type":"essay","stem":"简述新中国建立以来不同阶段火灾发生的特征。","options":[],"answer":"改革开放之前\n我国从建国开始到改革开放之前的这段时期，由于社会整体经济水平处于较低的状态，相应时期的火灾发生总量和直接损失相应也比较低。\n改革开放以后\n改革开放以后，尤其是20世纪90年代以来，社会经济得到了迅速发展，致灾因素也大量增加，火灾损失也随之急剧上升。","answerShort":"①改革开放之前我国从建国开始到改革开放之前的这段时期\n②改革开放以后改革开放以后，尤其是20世纪90年代以来，社会经济得到了迅速发展"},{"id":150,"subject":"消防经济学","code":"14434","type":"essay","stem":"我国消防装备配置存在的问题。","options":[],"answer":"消防装备配置总体水平较低\n 底气、最大保证。","answerShort":"①党的十九届六中全会指出，党确立习同志党中央的核心、全党的核心地位\n②“两个确立”是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素"},{"id":264,"subject":"习概","code":"15040","type":"essay","stem":"简述新时代中国特色社会主义思想的历史地位。","options":[],"answer":"新时代中国特色社会主义思想是当代中国马克思主义、二十一世\n纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主\n义中国化时代化新的飞跃。\n(1)继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个\n代表”重要思想、科学发展观，是马克思主义在当代中国发展的最新\n理论成果，开辟了马克思主义中国化时代化新境界。\n(2)把马克思主义基本原理同中国具体实际相结合，同中华优秀传统\n文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内\n在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华\n文化和中国精神的时代精华。\n(3)是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指\n南，是新时代党和国家事业发展的根本遵循。","answerShort":"①新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义\n②继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思…\n③把马克思主义基本原理同中国具体实际相结合，同中华优秀传统文化相结合\n④是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南"},{"id":265,"subject":"习概","code":"15040","type":"essay","stem":"如何坚持人民立场?","options":[],"answer":"坚持人民立场，就要；始终牢记党的初心和使命：始终保持党同人民\n群众的血肉联系：热爱人民、尊重人民、敬畏人民。","answerShort":"①坚持人民立场，就要\n②始终牢记党的初心和使命：始终保持党同人民群众的血肉联系：热爱人民、尊重人民、敬畏…"},{"id":266,"subject":"习概","code":"15040","type":"essay","stem":"中华文明的特性有哪些?","options":[],"answer":"连续性、创新性、统一性、包容性、和平性。","answerShort":"连续性、创新性、统一性、包容性、和平性。"},{"id":267,"subject":"习概","code":"15040","type":"essay","stem":"结合材料回答问题站在新的历史起点，中国将坚持走和平发展之路。始终做世界和平的建设者、坚持走改革开放之路，始终做全球发展的贡献者；坚持走多边主义之路，始终做国际秩序的维护者；“青山一道月云雨，明月何曾是两乡”让我们携起手来，站在历史正确的一边站在人类进步的一边，为实现世界永续和平发展，为推动构建人类命运共同体而不懈奋斗!-摘自《著作选读》第二卷、人民出版社2023年版试述构建人类命运共同体的内涵和意义。","options":[],"answer":"(1)人类命运共同体，就是每个民族、每个国家的前途命运都紧紧\n联系在一起，把世界各国人民对美好生活的向往变成现实。构建人类\n命运共同体，就是要携手世界各国人民共同建设持久和平、普遍安\n全、共同繁荣、开放包容、清洁美丽的世界。(2)构建人类命运共同\n体理念顺应了历史潮流，回应了时代要求，凝聚了各国共识，为人类\n社会实现共同发展、持续繁荣、长治久安绘制了蓝图，对中国的和平\n发展、世界的繁荣进步都具有重大而深远的意义。","answerShort":"①人类命运共同体，就是每个民族、每个国家的前途命运都紧紧联系在一起\n②构建人类命运共同体理念顺应了历史潮流，回应了时代要求，凝聚了各国共识"},{"id":268,"subject":"习概","code":"15040","type":"single","stem":"习近平总书记在中央全面依法治国工作会议上强调， 推进全面依法治国， 以（ ） 为着力点","options":["共同富裕","解决法治领域突出问题","健全法制","依法行政"],"answer":"B"},{"id":269,"subject":"习概","code":"15040","type":"single","stem":"习近平总书记在中央全面依法治国工作会议上强调， 我们党历来重视法治建设。 党的十八大以来， 党中 央明确提出（ ） ， 并将其纳入“四个全面” 战略布局予以有力推进","opt ,"answer":"A"},{"id":338,"subject":"习概","code":"15040","type":"single","stem":"加强同发展中国家团结合作，我国秉持的理念是","options":["总体稳定","均衡发展","以邻为伴","真实亲诚"],"answer":"D"},{"id":339,"subject":"习概","code":"15040","type":"single","stem":"在全人类共同价值中，体现人类共同理想的是","options":["天下为公","民主自由","和平发展","公平正义"],"answer":"D"},{"id":340,"subject":"习概","code":"15040","type":"single","stem":"新时代党的建设的鲜明主题是","options":["调动积极性","全面从严治党","调动主动性","真抓敢抓狠抓"],"answer":"B"},{"id":341,"subject":"习概","code":"15040","type":"single","stem":"我们党最彻底的自我革命是","options":["反官僚主义","反形式主义","反腐败","反浪费"],"answer":"C"},{"id":342,"subject":"习概","code":"15040","type":"essay","stem":"“两个确立”是党在新时代取得的重大政治成果。怎样深刻领悟“两个确立”的决定性意义?","options":[],"answer":"（1）党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，反映了全党全军全国各族人民共同心愿。\n（2）“两个确立”，是党在新时代取得的重大政治成果，对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。新时代的伟大变革，是在以习近平同志为核心的党中央坚强领导下、在习近平新时代中国特色社会主义思想指引下全党全军全国各族人民团结奋斗取得的。\n（3）实践证明，“两个确立”是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素，是党和人民应对一切不确定性的最大确定性、最大底气、最大保证。","answerShort":"①党确立习近平同志党中央的核心、全党的核心地位\n②“两个确立”，是党在新时代取得的重大政治成果\n③实践证明"},{"id":343,"subject":"习概","code":"15040","type":"essay","stem":"如何理解人民对美好生活的向往就是党的奋斗目标?","options":[],"answer":"（1）坚持人民至上，必须始终把人民放在心中最高位置，想人民之所想，行人民之所嘱；\n（2）为人民谋幸福是党始终坚守的初心，让人民过上好日子是党一贯的追求；\n（3）人民对美好生活的向往就是党的奋斗目标，这体现了我国社会主要矛盾转化对党和国家工作的新要求。","answerShort":"①坚持人民至上，必须始终把人民放在心中最高位置，想人民之所想\n②为人民谋幸福是党始终坚守的初心，让人民过上好日子是党一贯的追求\n③人民对美好生活的向往就是党的奋斗目标"},{"id":344,"subject":"习概","code":"15040","type":"essay","stem":"党的十八大以来，我们党对社会主义基本经济制度作出了新概括。简述社会主义基本经济制度。","options":[],"answer":"（1）公有制为主体、多种所有制经济共同发展；\n（2）按劳分配为主体、多种分配方式并存；\n（3）社会主义市场经济体制；\n（4）这一基本经济制度，既体现了社会主义制度优越性，又同我国社会主义初级阶段社会生产力发展水平相适应，是党和人民的伟大创造。","answerShort":"①公有制为主体、多种所有制经济共同发展\n②按劳分配为主体、多种分配方式并存\n③社会主义市场经济体制\n④这一基本经济制度，既体现了社会主义制度优越性"},{"id":345,"subject":"习概","code":"15040","type":"essay","stem":"简述我国的根本政治制度和基本政治制度。","options":[],"answer":"（1）人民代表大会制度是我国的根本政治制度，是符合我国国情和实际、体现社会主义国家性质、保证人民当家作主、保障实现中华民族伟大复兴的好制度，是我们党领导人民在人类政治制度史上的伟大创造；\n（2）中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基本群众自治制度构成了我国的基本政治制度，反映了我国社会主义民主政治的独特优势，是保障各政党、各阶层、各民族和基层人民群众当家作主的重要基础。","answerShort":"①人民代表大会制度是我国的根本政治制度\n②中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基本群众自…"},{"id":346,"subject":"习概","code":"15040","type":"essay","stem":"简述中国特色社会主义法治道路的核心要义。","options":[],"answer":"（1）中国特色社会主义法治道路的核心要义，就是坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论；\n（2）党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证；\n（3）中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础，是全面推进依法治国的根本制度保障；\n（4）中国特色社会主义法治理论是中国特色社会主义法治体系的理论指导和学理支撑，是全面推进依法治国的行动指南。","answerShort":"①中国特色社会主义法治道路的核心要义，就是坚持党的领导\n②党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证\n③中国特色社会主义制度是中国特色社会主义法治体系的根本制度基础\n④中国特色社会主义法治理论是中国特色社会主义法治体系的理论指导和学理支…"},{"id":347,"subject":"习概","code":"15040","type":"essay","stem":"结合材料回答问题：在新中国成立特别是改革开放以来长期探索和实践基础上，经过十八大以来在理论和实践上的创新突破，我们党成功推进和拓展了中国式现代化。中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。—摘自《习近平著作选读》第一卷，人民出版社2023年版，第18页。试述中国式现代化的中国特色。","options":[],"answer":"（1）中国式现代化是人口规模巨大的现代化；联系实际论证\n（2）中国式现代化是全体人民共同富裕的现代化；联系实际论证\n（3）中国式现代化是物质文明和精神文明相协调的现代化；联系实际论证\n（4）中国式现代化是人与自然和谐共生的现代化；联系实际论证\n（5）中国式现代化是走和平发展道路的现代化。联系实际论证","answerShort":"①中国式现代化是人口规模巨大的现代化\n②中国式现代化是全体人民共同富裕的现代化\n③中国式现代化是物质文明和精神文明相协调的现代化\n④中国式现代化是人与自然和谐共生的现代化\n⑤中国式现代化是走和平发展道路的现代化"},{"id":348,"subject":"习概","code":"15040","type":"single","stem":"新时代坚持和发展中国特色社会主义，必须坚定“四个自信”。在四个自信中更基础,更广泛更深厚的自信是","options":["道路自信","理论自信","制度自信","文化自信"],"answer":"D"},{"id":349,"subject":"习概","code":"15040","type":"single","stem":"新时代我国社会主要矛盾是","options":["重点突破和整体推进的矛盾","各区域各领域之间发展不平衡的矛盾","人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需求和不平衡不充分的发展之间的矛盾"],"answer":"D"},{"id":350,"subject":"习概","code":"15040","type":"single","stem":"走和平发展道路是中国式现代化的一个特色其承继的中华优秀传统文化的理念是","options":["天人合一","协和万邦","革故鼎新","取长补短"],"answer":"B"},{"id":351,"subject":"习概","code":"15040","type":"single","stem":"党的领导的最高原则是","options":["巩固党执政的阶级基础","党中央集中统一领导","厚植党执政的群众基础","加强党执政的经济基础"],"answer":"B"},{"id":352,"subject":"习概","code":"15040","type":"single","stem":"我们党最大的政治优势是","options":["密切联系群众","批评与自我批评","理论联系实际","谦虚谨慎戒骄戒躁"],"answer":"A"},{"id":353,"subject":"习概","code":"15040","type":"si ject":"习概","code":"15040","type":"single","stem":"“一国两制”方针最高原则是","options":["维护国家主权、安全、发展利益","全面管治权和高度自治权相统","“爱国者治港”“爱国者治澳","依法治港治澳"],"answer":"A"},{"id":368,"subject":"习概","code":"15040","type":"single","stem":"新时代党解决台湾问题的总体方略中,统一的战略支撑是坚持","options":["推动两岸关系融合发展","粉碎“台独”分裂图谋","决不放弃使用武力","反对外部势力干涉"],"answer":"C"},{"id":369,"subject":"习概","code":"15040","type":"single","stem":"推动构建新型国际关系的原则是","options":["外交为民，共同发展","相互尊重、公平正义、合作共赢","总体稳定、均衡发展","反对冷战思维，反对双重标准"],"answer":"B"},{"id":370,"subject":"习概","code":"15040","type":"single","stem":"共建“一带一路”应该坚持的理念是","options":["双赢、多赢、共赢","平等、平均、平衡","互商、互谅、互利","开放、绿色、廉洁"],"answer":"D"},{"id":371,"subject":"习概","code":"15040","type":"single","stem":"摆在党的建设总体布局首位的是","options":["纪律建设","组织建设","思想建设","政治建设"],"answer":"D"},{"id":372,"subject":"习概","code":"15040","type":"single","stem":"我们党给出的跳出历史周期率的第二个答案是","options":["社会革命","民主","自我革命","集中"],"answer":"C"},{"id":373,"subject":"习概","code":"15040","type":"essay","stem":"“两个结合”的完整表述是什么?","options":[],"answer":"“两个结合”:马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。","answerShort":"“两个结合”:马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。"},{"id":374,"subject":"习概","code":"15040","type":"essay","stem":"实现第一个百年目标后，我们党协调推进的“四个全面”战略布局是什么?","options":[],"answer":"全面深化改革、全面依法治国、全面建设社会主义现代化国家、全面从严治党。","answerShort":"全面深化改革、全面依法治国、全面建设社会主义现代化国家、全面从严治党。"},{"id":375,"subject":"习概","code":"15040","type":"essay","stem":"如何构建新发展格局?","options":[],"answer":"(1)着力推动实施扩大内需战略同深化供给侧结构性改革有机结合;\n(2)着力发展实体经济;\n(3)着力加快科技自立白强;\n(4)着力推动产业链供应链优化升级","answerShort":"①着力推动实施扩大内需战略同深化供给侧结构性改革有机结合\n②着力发展实体经济\n③着力加快科技自立白强\n④着力推动产业链供应链优化升级"},{"id":376,"subject":"习概","code":"15040","type":"essay","stem":"新时代强军目标","options":[],"answer":"党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。","answerShort":"党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队"},{"id":377,"subject":"习概","code":"15040","type":"essay","stem":"怎样理解世界正经历百年未有之大变局","options":[],"answer":"(1)世界多极化、经济全球化、社会信息化、文化多样化深入发展，和平、发展、合作、共赢的历史潮流不可阻挡;世界面临的不稳定性不确定性突出，全球性问题加剧，人类处在一个危机交织叠加、风险日益增多的时代；\n(2)国际力量对比深刻变化；\n(3)新一轮科技革命和产业变革深入发展；\n(4)国际体系和国际秩序深度调整","answerShort":"①世界多极化、经济全球化、社会信息化、文化多样化深入发展\n②国际力量对比深刻变化\n③新一轮科技革命和产业变革深入发展\n④国际体系和国际秩序深度调整"},{"id":378,"subject":"习概","code":"15040","type":"essay","stem":"结合材料回答问题:不谋全局者，不足谋一域。改革推进到现在，必须在深入调查研究的基础上提出全面深化改革的顶层设计和总体规划，提出改革的战略目标、战略重点、优先顺序、主攻方向、工作机制、推进方式，提出改革总体方案、路线图、时间表。这也应该同“两个 一百年”奋斗目标相适应。实现“两个一百年”奋斗目标，要以改革开放为抓手，要有相应的改革开放举措。--摘自《习近平著作选读》第一卷，人民出版社2023年版 全面深化改革路线图的主要内容,","options":[],"answer":"①紧紧围绕使市场在资源配置中起决定性作用和更好发挥政府作用，深化经济体制改革;\n②紧紧围绕坚持党的领导、人民当家作主、依法治国有机统一，深化政治体制改革；\n③紧紧围绕建设社会主义核心价值体系社会主义文化强国，深化文化体制改革;\n④紧紧围绕更好保障和改善民生、促进社会公平正义，深化社会体制改革;\n⑤紧紧围绕建设美丽中国，深化生态文明体制改革；\n⑥紧紧围绕提高科学执政、民主执政、依法执政水平，深化党的建设制度改革。","answerShort":"①紧紧围绕使市场在资源配置中起决定性作用和更好发挥政府作用，深化经济体制改革\n②紧紧围绕坚持党的领导、人民当家作主、依法治国有机统一\n③紧紧围绕建设社会主义核心价值体系社会主义文化强国，深化文化体制改革\n④紧紧围绕更好保障和改善民生、促进社会公平正义，深化社会体制改革\n⑤紧紧围绕建设美丽中国，深化生态文明体制改革"},{"id":379,"subject":"近代史纲要","code":"15043","type":"single","stem":"第一次鸦片战争前，中国社会的主要矛盾是","options":["地主阶级和农民阶级的矛盾","地主阶级和资产阶级的矛盾","资产阶级和农民阶级的矛盾","工人阶级和资产阶级的矛盾"],"answer":"A"},{"id":380,"subject":"近代史纲要","code":"15043","type":"single","stem":"第二次鸦片战争中洗劫和烧毁圆明园的外国侵略者是","options":["日本侵略军","俄国侵略军","英法联军","八国联军"],"answer":"C"},{"id":381,"subject":"近代史纲要","code":"15043","type":"single","stem":"1901 年，清政府被迫与外国侵略者签订的不平等条约是","options":["《 天津条约》","《 北京条约》","《 辛丑条约》","《 马关条约》"],"answer":"C"},{"id":382,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国近代史上，人民群众第一次大规模反侵略的武装斗争是","options":["三元里人民的抗英斗争","台湾人民的抗日斗争","太平天国抗击洋枪队的斗争","义和团抗击八国联军的斗争"],"answer":"A"},{"id":383,"subject":"近代史纲要","code":"15043","type":"single","stem":"魏源在《海国图志》中提出的思想主张是","options":["物竞天择、适者生存","师夷长技以制夷","中学为体、西学为用","振兴中华"],"answer":"B"},{"id":384,"subject":"近代史纲要","code":"15043","type":"single","stem":"太平天国农民起义由盛而衰的转折点是","options":["安庆战役","长沙战役","北伐失利","天京事变"],"answer":"D"},{"id":385,"subject":"近代史纲要","code":"15043","type":"single","stem":"洋务派创办的第一个规模较大的近代军事工业是","options":["湖北枪炮厂","江南制造总局","马尾船政局","天津机器局"],"answer":"B"},{"id":386,"subject":"近代史纲要","code":"15043","type":"single","stem 代史纲要","code":"15043","type":"single","stem":"中共十八大确定的实现全面建成小康社会奋斗目标的时间是","options":["2020 年","2025 年","2030 年","2035 年"],"answer":"A"},{"id":400,"subject":"近代史纲要","code":"15043","type":"single","stem":"2013年11月，中共十八届三中全会审议通过的重要文件是","options":["《关于稳步推进农村集体产权制度改革的意见》","《关于全面深化改革若干重大问题的决定》","《关于全面推进依法治国若干重大问题的决定》","《 关于培育和践行社会主义核心价值观的意见》"],"answer":"B"},{"id":401,"subject":"近代史纲要","code":"15043","type":"single","stem":"将习近平新时代中国特色社会主义思想确立为党的行动指南的会议是","options":["中共十八大","中共十八届一中全会","中共十九大","中共十九届一中全会"],"answer":"C"},{"id":402,"subject":"近代史纲要","code":"15043","type":"single","stem":"中共十九大明确提出，我国要在21世纪中叶实现的战略目标是","options":["实现社会主义四个现代化","建成社会主义和谐社会","基本实现社会主义现代化","建成富强民主文明和谐美丽的社会主义现代化强国"],"answer":"D"},{"id":403,"subject":"近代史纲要","code":"15043","type":"single","stem":"自2010年以来，保持世界第二大经济体地位的国家是","options":["日本","德国","法国","中国"],"answer":"D"},{"id":404,"subject":"近代史纲要","code":"15043","type":"essay","stem":"戊戌维新运动失败的主要原因。","options":[],"answer":"戊戌维新运动失败的主要原因在于维新派自身的局限和以慈禧太后为首的强大的守旧势力的反对。\n维新派自身的弱点和局限主要有以下三个方面：第一，不敢否定封建主义。第二，对帝国主义抱有幻想。第三，脱离人民群众。\n戊戌维新是中国民族资产阶级登上政治舞台的第一次表演，显示了民族资产阶级及其知识分子的政治朝气，表达了这一新兴阶级的政治追求。戊戌维新以悲剧性的失败而告终，不仅暴露出这个阶级的软弱性，同时也说明在半殖民地半封建的中国，企图通过统治者进行自上而下的改良的道路是行不通的。要想实现国家的独立、民主、富强，必须采用革命的手段。","answerShort":"①戊戌维新运动失败的主要原因在于维新派自身的局限和以慈禧太后为首的强大的守旧势力的反对\n②不敢否定封建主义\n③对帝国主义抱有幻想\n④脱离人民群众"},{"id":405,"subject":"近代史纲要","code":"15043","type":"essay","stem":"清末“新政”实行的原因。","options":[],"answer":"《辛丑条约》的签订，标志着以慈禧太后为首的清政府已彻底放弃了抵抗外国侵略者的念头，甘为“洋人的朝廷”。清王朝为取得外国列强的信任，平息国内日益高涨的民怨，安抚统治阶级内部各派，拉拢民族资产阶级改良派，于1901年4月设立督办政务处，宣布实行“新政”。\n迫于内外压力，1906年清政府宣布“预备仿行宪政”，1908年颁布《钦定宪法大纲》，制定了一个学习日本实行君主立宪的宪法，且又规定了9年的预备立宪期限。","answerShort":"①《辛丑条约》的签订，标志着以慈禧太后为首的清政府已彻底放弃了抵抗外国侵略者的念头\n②清王朝为取得外国列强的信任，平息国内日益高涨的民怨，安抚统治阶级内部各派\n③迫于内外压力，1906年清政府宣布“预备仿行宪政”"},{"id":406,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国早期马克思主义思想运动的历史特点。","options":[],"answer":"第一，重视对马克思主义基本理论的学习，同第二国际的社会民主主义划清界限，坚持了马克思主义的革命原则和正确方向。\n第二，注意从中国的实际出发，初步形成了马克思主义应当与中国实际相结合的思想(尽管在当时还没有明确提出这个命题)。\n第三，开始提出知识分子应当忠于民众，到民间去，同劳动群众相结合的思想。","answerShort":"①重视对马克思主义基本理论的学习，同第二国际的社会民主主义划清界限\n②注意从中国的实际出发\n③开始提出知识分子应当忠于民众，到民间去，同劳动群众相结合的思想"},{"id":407,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中华苏维埃第一次全国代表大会的召开及其主要内容。","options":[],"answer":"1931年11月，中华苏维埃第一次全国代表大会在江西省瑞金县叶坪村举行。大会通过了《中华苏维埃共和国宪法大纲》以及土地法令、劳动法等法律文件;选举产生了中华苏维埃共和国中央执行委员会;宣告了中华苏维埃共和国临时中央政府的成立。毛泽东当选为中央执行委员会主席。","answerShort":"①1931年11月，中华苏维埃第一次全国代表大会在江西省瑞金县叶坪村举行\n②大会通过了《中华苏维埃共和国宪法大纲》以及土地法令、劳动法等法律文件\n③毛泽东当选为中央执行委员会主席"},{"id":408,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国人民抗日战争在世界反法西斯战争中的地位。","options":[],"answer":"第一，中国人民抗日战争是世界反法西斯战争的东方主战场。\n第二，中国人民的持久抗战，不仅遏制了日本的“北进”计划，迟滞了日本的“南进”步伐，而且大大减轻了其他战场的压力，制约和打乱了日本法西斯和德意法西斯战略配合的企图，在战略上策应和支持了盟国作战，配合了欧洲战场和太平洋战场的战略行动，为盟国军队完成战略转折和实施战略反攻创造了有利条件。\n第三，中国作为亚洲太平洋地区盟军对日作战的重要后方基地，还为盟国提供了大量战略物资和军事情报。中国军队出国作战，不仅打击了日军，还对盟军给予了实际支援。","answerShort":"①中国人民抗日战争是世界反法西斯战争的东方主战场\n②中国人民的持久抗战，不仅遏制了日本的“北进”计划\n③中国作为亚洲太平洋地区盟军对日作战的重要后方基地，还为盟国提供了大量战略物资和军事情报"},{"id":409,"subject":"近代史纲要","code":"15043","type":"essay","stem":"统一战线是新民主主义革命胜利的基本经验之一，其主要内容是什么?","options":[],"answer":"中国革命的胜利，首先，由于有了中国工人阶级的先锋队—中国共产党的领导。其次，由于帝国主义、封建主义、官僚资本主义的残酷压迫，中国人民走上了反帝反封建反官僚资本主义斗争的伟大时代。再次，中国革命的胜利，同国际无产阶级和人民群众的支持也是分不开的。\n中国共产党在领导人民革命的过程中，积累了丰富的经验。\n第一，建立广泛的统一战线，是坚持和发展革命的政治基础。第二，中国革命只能以长期的武装斗争作为主要形式。中国的武装斗争实质上是工人阶级领导的农民战争。第三，加强共产党自身建设。先着重党思想建设，党内斗争中实行“惩前毖后，治病救人”的方针;批评与自我批评进行马克思主义思想教育的整风形式等。人民民主专政的新中国的创建，标志着近代以来中国面临的争取民族独立、人民解放这个历史任务的基本完成。","answerShort":"①中国革命的胜利，首先，由于有了中国工人阶级的先锋队—中国共产党的领导\n②建立广泛的统一战线，是坚持和发展革命的政治基础\n③中国革命只能以长期的武装斗争作为主要形式\n④加强共产党自身建设"},{"id":410,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国共产党在过渡时期的总路线和总任务及其特点是什么?","options":[],"answer":"中共中央在1952年底开始酝酿并于1953年正式提出党在过渡时期的总路线，明确规定：“党在这个过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造。”这就是说：主要的任务是实现国家工业化。\n过渡时期总路线的特点是社会主义工业化和社会主义改造同时并举,以工业化为主体,三大改造为两翼,二者是相互适应,相互促进,协调发展.这条总路线的实质是改变生产资料的资本主义私有制为生产资料的社会主义公有制.","answerShort":"①中共中央在1952年底开始酝酿并于1953年正式提出党在过渡时期的总路线\n②”这就是说：主要的任务是实现国家工业化\n③过渡时期总路线的特点是社会主义工业化和社会主义改造同时并举,以工业化为主体,三大…"},{"id":411,"subject":"近代史纲要","code":"15043","type":"essay","stem":"为什么说中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折?","options":[],"answer":"(1)重新确立了马克思主义的思想路线。全会冲破长期\"左\"的错误的严重束缚，彻底否定了\"两个凡是\"的错误方针，高度评价了关于真理标准问题的讨论，并且断然否定\"以阶级斗争为纲\"的指导思想，恢复了马克思主义实事求是的思想路线。\n(2)全会全面分析了当前的主要矛盾和主要任务，作出了把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策。\n(3)全会恢复了党的民主集中制优良传统，审查解决了历史上遗留的一批重大问题和一些重要领导人功过是非问题。\n(4)为了适应社会主义现代化建设的需要，全会决定在党的生活和国家政治生活中加强民主，明确党思想路线，加强党的领导机构和成立中央纪律检查委员会。\n(5)中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折。全会结束了粉碎\"四人帮\"后在徘徊中前进的局面，开始了我党在思想、政治、组织等领域全面拨乱反正，形成了以邓小平为核心的党的中央领导集体，揭开了社会主义改革开放的序幕。以这次全会为起点，中国进入了改革开放和社会主义现代化建设新时期。","answerShort":"①重新确立了马克思主义的思想路线\n②全会全面分析了当前的主要矛盾和主要任务\n③全会恢复了党的民主集中制优良传统\n④为了适应社会主义现代化建设的需要\n⑤中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折"},{"id":412,"subject":"近代史纲要","code":"15043","type":"single","stem":"清王朝的统治由盛转衰是在","options":["乾隆朝后期","嘉庆朝后期","咸丰草后期","同治朝后期"],"answer":"A"},{"id":413,"subject":"近代史纲要","code":"15043","type":"single","stem":"19世纪，向中国大肆走私鸦片的主要国家是","options":["美国","英国","法国","俄国"],"answer":"B"},{"id":414,"subject":"近代史纲要","code":"15043","type":"single","stem":"日本迫使清朝政府签订的割让台湾的不平等条约是","options":["《南京条约》","《天津条约》","《马关条约》","《辛丑条约》"],"answer":"C"},{"id":415,"subject":"近代史纲要","code":"15043","type":"single","stem":"第一次鸦片战争时期，发生的人民群众大规模反侵略武装斗争是","options":["义和团抗击八国联军的斗争","太平天国抗击洋枪队的斗争","台湾人民抗击日本侵略者的斗争","三元里人民抗英斗争"],"answer":"D"},{"id":416,"subject":"近代史纲要","code":"15043","type":"single","stem":"鸦片战争后编纂《海国图志》，提出“师夷长技以制夷”思想主张的是（","options":["林则徐","魏源","龚自珍","郑观应"],"answer":"B"},{"id":417,"subject":"近代史纲要","code":"15043","type":"single","stem":"20世纪初，章炳麟撰写的歌颂革命是“启迪明智，除旧布新”的良药的著作是","options":["《驳康有为论革命书》","《中国问题的真解决》","《警世钟》","《猛回头》"],"answer":"A"},{"id":418,"subject":"近代史纲要","code":"15043","type":"single","stem":"1904年至1905年，为争夺在华利益而在中国东北进行战争的帝国主义国家是","options":["日本、美国","英国、俄国","日本、俄国","英国、法国"],"answer":"C"},{"id":419,"subject":"近代史纲要","code":"15043","type":"single","stem":"1919年爆发的五四运动的直接导火线是","options":["北洋军阀接受日本提出的“二十一条”","北洋军阀与日本签订“西原借款”合同","华盛顿会议上中国外交的受挫","巴黎和会上中国外交的失败"],"answer":"D"},{"id":420,"subject":"近代史纲要","code":"15043","type":"single","stem":"1921年9月，在浙江省萧山县衙前村组织成立中国第一个农民协会的是","options":["沈定一","澎湃","阮萧山","毛泽东"],"answer":"A"},{"id":421,"subject":"近代史纲要","code":"15043","type":"single","stem":"1927年，中共八七会议确定的总方针是","options":["推翻北洋军阀的统治","开展农民根据地建设","开展土地革命和武装斗争","建立工农民主统一战线"],"answer":"C"},{"id":422,"subject":"近代史纲要","code":"15043","type":"single","stem":"1930年8月，由邓演达领导成立的中间党派是","options":["中国国民党革命委员会","中国国民党临时行动委员会","中华职业教育社","中国青年党"],"answer":"B"},{"id":423,"subject":"近代史纲要","code":"15043","type":"single","stem":"1947年12月1日正式成立的民主党派是","options":["中国农工民主党","中国民主建国会","九三学社","台湾民主自治同盟"],"answer":"D"},{"id":424,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国人民解放军在1948年9月12日至11月2日进行的重大战役是","options":["平津战役","淮海战役","渡江战役","辽沈战役"],"answer":"D"},{"id":425,"subject":"近代史纲要","code":"15043","type":"single","stem":"1951年，中国大陆实现统一的标志是","options":["西藏和平解放","宁夏和平解放","新疆和平解放","青海解放"],"answer":"A"},{"id":426,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国共产党在1951年底至1952年春开展的运动是","options":["肃反运动","“五反”运动","“三反”运动","社会主义教育运动"],"answer":"C"},{"id":427,"subject":"近代史纲要","code":"15043","type":"single","stem":"为进行有计划的经济建设，我国开始实施发展国民经济第一个五年计划的时间是","options":["1950年","1951年","1952年","1953年"],"answer":"D"},{"id":428,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国共产党在过渡时期实施了“一化三改”的总路线，其中“一化”是","options":["实现国家社会主义工业化","实现农业现代化","实现科技现代化","实现国防现代化"],"answer":"A"},{"id":429,"subject":"近代史纲要","code":"15043","type":"single","stem":"在我国农业合作化过程中，具有社会主义萌芽性质的经济组织形式是","options":["变工队","初级生产合作社","互助组","高级生产合作社"],"answer":"C"},{"id":430,"subject":"近代史纲要","code":"15043","type":"single","stem":"揭开我国社会主义改革开放序幕的重要会议是","options":["中共十一大","中共十一届三中全会","中共十二大","中共十二届三中全会"],"answer":"B"},{"id":431,"subject":"近代史纲要","code":"15043","type":"single","stem":"1988年，我国决定建立的经济特区是","options":["汕头经济特区","厦门经济特区","深圳经济特区","海南经济特区"],"answer":"D"},{"id":432,"subject":"近代史纲要","code":"15043","type":"single","stem":"中共十三大正式制定的社会主义现代化建设发展战略是","options":["“两步走”","“两个飞跃”","“两个大局”","“三步走”"],"answer":"D"},{"id":433,"subject":"近代史纲要","code":"15043","type":"single","stem":"将建立社会主义市场经济体制确立为我国经济体制改革目标的会议是","options":["中共十二大","中共十四大","中共十六大","中共十七大"],"answer":"B"},{"id":434,"subject":"近代史纲要","code":"15043","type":"single","stem":"中共十七大明确提出，科学发展观的核心是","options":["统筹兼顾","以人为本","全面协调可持续","发展"],"answer":"B"},{"id":435,"subject":"近代史纲要","code":"15043","type":"single","stem":"2014年10月，《中共中央关于全面推进依法治国若干问题的重要决议》指出，中国特色社会主义法治道路的核心要义是","options":["实行全过程人民民主","实行共同富裕","坚持党的领导","坚持公平正义"],"answer":"C"},{"id":436,"subject":"近代史纲要","code":"15043","type":"single","stem":"2017年，中国的外汇储备量在世界上的排位是","options":["第一位","第二位","第三位","第四位"],"answer":"A"},{"id":437,"subject":"近代史纲要","code":"15043","type":"essay","stem":"辛亥革命时期资产阶级革命派的骨干力量。","options":[],"answer":"资产阶级革命派的骨干力量是一批资产阶级、小资产阶级知识分子。这个知识分子群体是19世纪末20世纪初随着清政府兴办新式学堂、派遣留学生而逐渐形成的。他们接触到近代西方资本主义思想文化，深感民族危难的加深，在群众斗争推动下，走向了清政府的对立面，开始探索救国救民的新道路。","answerShort":"①资产阶级革命派的骨干力量是一批资产阶级、小资产阶级知识分子\n②这个知识分子群体是19世纪末20世纪初随着清政府兴办新式学堂、派遣留学生而逐渐形…\n③他们接触到近代西方资本主义思想文化，深感民族危难的加深，在群众斗争推动下"},{"id":438,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国早期信仰马克思主义的三类代表人物。","options":[],"answer":"中国早期信仰马克思主义的人物，主要有三种类型∶一是五四运动前的新文化运动的精神领袖，其代表是李大钊、陈独秀。二是五四运动中的左翼骨干，其代表是毛泽东、杨匏安、蔡和森、周恩来等。三是一部分原中国同盟会会员、辛亥革命时期的活动家，以董必武、吴玉章、林伯渠等为代表。","answerShort":"①中国早期信仰马克思主义的人物\n②二是五四运动中的左翼骨干，其代表是毛泽东、杨匏安、蔡和森、周恩来等\n③三是一部分原中国同盟会会员、辛亥革命时期的活动家"},{"id":439,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中华苏维埃共和国实行的各级工农兵代表大会制度。","options":[],"answer":"先由苏维埃共和国公民直接选举产生乡工农兵代表大会代表，召开乡工农兵代表大会，选举产生乡苏维埃政府组成人员；在此基础上，逐级召开区、县、省和全国工农兵代表大会，选举产生区、县、省和全国苏维埃政府。各级苏维埃政府广泛吸收工农群众代表参加政权管理，行使当家作主的权利。中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，是中国共产党在局部地区执政的重要尝试。","answerShort":"①先由苏维埃共和国公民直接选举产生乡工农兵代表大会代表，召开乡工农兵代表大会\n②在此基础上，逐级召开区、县、省和全国工农兵代表大会\n③各级苏维埃政府广泛吸收工农群众代表参加政权管理，行使当家作主的权利"},{"id":440,"subject":"近代史纲要","code":"15043","type":"essay","stem":"抗日战争胜利后美国实施的扶蒋反共政策。","options":[],"answer":"美国继续采取自中国抗战后期就已确立的扶蒋反共政策。这一政策包含两个方面：一方面，在形势对国民党不利时，力促国共两党进行和平谈判，以期用和平手段诱骗中共向国民党投降，使美国不战而控制全中国 ；另一方面，从各方面大力加强国民党的力量，一旦和谈目的不能实现，便帮助国民党与中共决战，以期用武力打败中共，使中国成为美国的附庸。因此，无论美国采取何种手法扶蒋反共，中国共产党和中国人民都将面临两个前途、两种命运决战的严峻考验。","answerShort":"①美国继续采取自中国抗战后期就已确立的扶蒋反共政策\n②这一政策包含两个方面：一方面，在形势对国民党不利时，力促国共两党进行和平谈判\n③另一方面，从各方面大力加强国民党的力量，一旦和谈目的不能实现"},{"id":441,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中共十九大确定的决胜全面建成小康社会、开启全面建设社会主义现代化国家新征程的目标。","options":[],"answer":"第一个阶段，从2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化。第二阶段，从2035年到21世纪中叶，在基本实现看现代化的基础上，再奋斗十五年，把我国建成富强民主文明和谐美丽的社会主义现代化强国。","answerShort":"①第一个阶段，从2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年\n②第二阶段，从2035年到21世纪中叶，在基本实现看现代化的基础上，再奋斗十五年"},{"id":442,"subject":"近代史纲要","code":"15043","type":"essay","stem":"太平天国农民战争的历史意义。","options":[],"answer":"（1）它沉重打击了封建统治阶级，强烈撼动了清政府的统治根基。太平天国起义坚持了14年之久，革命势力扩展到18个省，规模大，时间长，影响深，加速了清王朝的衰败过程。\n（2）它是中国旧式农民战争最高峰，具有不同于以往农民战争的新的历史特点。太平天国建立了自己的政权，提出《天朝田亩制度》，比较完整地表达农民对土地的渴望。《资政新篇》是中国近代史上第一个具有资本主义色彩的方案，反映出太平天国新的历史特点。\n（3）太平天国对孔子和儒家经典予以严厉批判，在一定程度上削弱了封建统治的精神支柱。\n（4）太平天国起义还有力地打击了外国侵略势力。太平天国将领们拒绝不平等条约严禁鸦片贸易，与外国军队进行了英勇斗争。 第五，太平天国起义鼓舞和推动了当时的亚洲民族解放运动，冲击了西方殖民主义在亚洲的统治。","answerShort":"①它沉重打击了封建统治阶级，强烈撼动了清政府的统治根基\n②它是中国旧式农民战争最高峰，具有不同于以往农民战争的新的历史特点\n③太平天国对孔子和儒家经典予以严厉批判\n④太平天国起义还有力地打击了外国侵略势力\n⑤太平天国起义鼓舞和推动了当时的亚洲民族解放运动"},{"id":443,"subject":"近代史纲要","code":"15043","type":"essay","stem":"毛泽东在《论持久战》中关于“抗日战争是持久战”“最后战争胜利属于中国”的论述。","options":[],"answer":"中日双方存在着互相矛盾的四个特点∶敌强我弱，敌小我大，敌退步我进步，敌寡助我多助。一方面，日本是强国，中国是弱国，强国弱国的对比，决定了抗日战争只能是持久战。另一方面，日本是小国，发动的是退步的、野蛮的侵略战争，在国际上失道寡助 ；而中国是大国，进行的是进步的、正义的反侵略战争，在国际上得道多助。中国已经有了代表中华民族和中国人民根本利益的、政治上成熟的共产党及其领导的人民军队和抗日根据地。因此，最后胜利又将是属于中国的。","answerShort":"①中日双方存在着互相矛盾的四个特点∶敌强我弱，敌小我大，敌退步我进步，敌寡助我多助\n②一方面，日本是强国，中国是弱国，强国弱国的对比，决定了抗日战争只能是持久战\n③另一方面，日本是小国，发动的是退步的、野蛮的侵略战争，在国际上失道寡助"},{"id":444,"subject":"近代史纲要","code":"15043","type":"essay","stem":"改革开放前中国社会主义建设取得的主要成就。","options":[],"answer":"一是基本建立了独立的、比较完整的工业体系和国民经济体系，从根本上解决了工业化中“从无到有”的问题，使中国在赢得政治上的独立后也赢得了经济上的独立，为以后的发展奠定了牢固的物质技术基础。二是人民的基本生活需要得到保障，生活水平得到提高：文化、医疗、科技事业得以长足发展。三是国际地位得到提高，国际环境得以改善。我国坚持独立自主的外交方针，维护了世界和平，促进了人类进步事业的发展，努力为国内和平建设创造了良好的外部环境。","answerShort":"①一是基本建立了独立的、比较完整的工业体系和国民经济体系\n②二是人民的基本生活需要得到保障\n③三是国际地位得到提高，国际环境得以改善"},{"id":445,"subject":"近代史纲要","code":"15043","type":"single","stem":"鸦片战争前，中国封建文化的中心是（ ）","options":["儒家思想","法家思想","道家思想","墨家思想"],"answer":"A"},{"id":446,"subject":"近代史纲要","code":"15043","type":"single","stem":"1843年，魏源在《海国图志》中提出的主张是","options":["中学为体，西学为用","物竞天择，适者生存","救亡图存","师夷长技以制夷"],"answer":"D"},{"id":447,"subject":"近代史纲要","code":"15043","type":"single","stem":"洪秀全在广西省桂平县金田村发动起义的时间是()","options":["1851年","1853年","1856年","1858年"],"answer":"A"},{"id":448,"subject":"近代史纲要","code":"15043","type":"single","stem":"太平天国由盛转衰的转折点是()","options":["永安建制","天京事变","北伐失利","天京陷落"],"answer":"B"},{"id":449,"subject":"近代史纲要","code":"15043","type":"single","stem":"第二次鸦片战争期间，洗劫和焚毁圆明园的是()","options":["日本侵略军","俄国侵略军","英法联军","八国联军"],"answer":"C"},{"id":450,"subject":"近代史纲要","code":"15043","type":"single","stem":"太平天国农民运动失败的根本原因是()","options":["对外国资本主义列强缺乏理性认识","没有科学理论指导","缺乏先进阶级的领导","无法长期保持领导集团的团结"],"answer":"C"},{"id":451,"subject":"近代史纲要","code":"15043","type":"single","stem":"甲午战争后，日本迫使清政府签订的割让台湾的条约是()","options":["《南京条约》","《北京条约》","《天津条约》","《马关条约》"],"answer":"D"},{"id":452,"subject":"近代史纲要","code":"15043","type":"single","stem":"1895年，在《救亡决论》中喊出“救亡\"口号的是()","options":["康有为","严复","梁启超","孙中山"],"answer":"B"},{"id":453,"subject":"近代史纲要","code":"15043","type":"single","stem":"1919年，发表《我的马克思主义观》一文，对马克思主义基本内容作了比较确切阐述的是()","options":["毛泽东","李大钊","蔡和森","杨匏安"],"answer":"B"},{"id":454,"subject":"近代史纲要","code":"15043","type":"single","stem":"1923年，直系军阀吴佩孚镇压京汉铁路工人大罢工制造的惨案是()","options":["二七惨案","济南惨案","下关惨案","校场口惨案"],"answer":"A"},{"id":455,"subject":"近代史纲要","code":"15043","type":"single","stem":"1925年8月，广州国民政府将所辖各部队统一改编为()","options":["国民军","东征军","北伐军","国民革命军"],"answer":"D"},{"id":456,"subject":"近代史纲要","code":"15043","type":"single","stem":"大革命失败后，中共中央召开的确定土地革命和武装斗争的紧急会议是()","options":["古田会议","遵义会议","八七会议","洛川会议"],"answer":"C"},{"id":457,"subject":"近代史纲要","code":"15043","type":"single","stem":"中共中央政治局在遵义会议后成立了全权负责红军军事行动的新三人团，其成员是()","options":["毛泽东、朱德、周恩来","毛泽东、周恩来、王稼祥","毛泽东、朱德、王稼祥","毛泽东、张闻天、周恩来"],"answer":"B"},{"id":458,"subject":"近代史纲要","code":"15043","type":"single","stem":"1930年1月，毛泽东提出中国革命“以乡村为中心\"的思想，初步形成了农村包围城市、武装夺取政权理论的著作是","options":["《井冈山的斗争》","《星星之火，可以燎原》","《中国的红色政权为什么能够存在?》","《反对本本主义》"],"answer":"B"},{"id":459,"subject":"近代史纲要","code":"15043","type":"single","stem":"1936年5月，在共产党人积极参与下，宋庆龄等爱国民主人士发起成立的团体是()","options":["保卫中国同盟","全国各界救国联合会","中国民权保障同整","国民参政会"],"answer":"B"},{"id":460,"subject":"近代史纲要","code":"15043","type":"single","stem":"1937年3月，中国共产党在延安会议上通过的重要文件是()","options":["《为争取国共合作告全国同胞书》","《停战议和一致抗日通电》","《抗日救国十大纲领》","《关于若干历史问题的决议》"],"answer":"D"},{"id":461,"subject":"近代史纲要","code":"15043","type":"single","stem":"日本侵略者制造震惊中外的“南京大屠杀\"的时间是()","options":["1931年9月","1927年1月","1937年7月","1937年12月"],"answer":"D"},{"id":462,"subject":"近代史纲要","code":"15043","type":"single","stem":"1940年5月，在枣宜会战中以身殉国的国民党爱国将领是()","options":["张自忠","赵登禹","戴安澜","佟麟阁"],"answer":"A"},{"id":463,"subject":"近代史纲要","code":"15043","type":"single","stem":"1945年出席联合国制宪会议的中国代表团中，解放区的代表是()","options":["叶剑英","董必武","林伯渠","王若飞"],"answer":"B"},{"id":464,"subject":"近代史纲要","code":"15043","type":"single","stem":"中华人民共和国的成立标志着中国进入()","options":["旧民主主义革命向新民主主义革命的过渡时期","社会主义社会","新民主主义到社会主义的过渡时期","共产主义社会"],"answer":"C"},{"id":465,"subject":"近代史纲要","code":"15043","type":"single","stem":"我国在1957年6月开展的政治运动是()","options":["肃反运动","反右派运动","人民公社化运动","社会主义教育运动"],"answer":"B"},{"id":466,"subject":"近代史纲要","code":"15043","type":"single","stem":"文化大革命的导火线是()","options":["《评新编历史剧〈海瑞罢官>》","五一六通知\"的发表","\"十六条”的发表更多资","《炮打司令部-我的一张大字报》"],"answer":"A"},{"id":467,"subject":"近代史纲要","code":"15043","type":"single","stem":"1984年通过《中共中央关于经济体制改革的决定》的重要会议是()","options":["中共十一届三中全会","中共十一届六中全会","中共十二届三中全会","中共十二届六中全会"],"answer":"C"},{"id":468,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国正式加入世界贸易组织的时间是()","options":["1988年","1990年","1997年","2001年"],"answer":"D"},{"id":469,"subject":"近代史纲要","code":"15043","type":"single","stem":"明确提出我国在21世纪头二十年实现全面建设小康社会奋斗目标的会议是()","options":["中共十六大","中共十七大","中共十八大","中共十九大"],"answer":"A"},{"id":470,"subject":"近代史纲要","code":"15043","type":"essay","stem":"资产阶级维新派自身的弱点和局限的主要表现","options":[],"answer":"(1)不敢否定封建主义;(2)对帝国主义抱有幻想;(3)惧怕人民群众。","answerShort":"(1)不敢否定封建主义;(2)对帝国主义抱有幻想;(3)惧怕人民群众。"},{"id":471,"subject":"近代史纲要","code":"15043","type":"essay","stem":"新文化运动的历史意义","options":[],"answer":"(1)新文化运动的倡导者以进化论观点和个性解放思想为主要武器，猛烈抨击以孔子为代表的“往圣先贤\",大力提倡新道德、反对旧道德，提倡新文学、反对旧义学，包括提倡白话文、反对文言文。通过批判孔学，动摇了封建正统思想的统治地位，在中国社会掀起一股思想解放的潮流。\n(2)新文化运动的倡导者提倡民主、反对专制，提倡科学、反对迷信盲从，是切中时弊的。事实上，当封建主义还在政治和社会生活中占据支配地位时，对资产阶级民主主义的提倡，客观上仍然具有振聋发聩的作用。\n新文化运动在社会上掀起的思想解放潮流，冲决了禁锢人们思想的闸门。而这个闸门一被打开，各种新思想的涌流就不仅不可避免，而且是无法遏止的了。","answerShort":"①新文化运动的倡导者以进化论观点和个性解放思想为主要武器\n②新文化运动的倡导者提倡民主、反对专制，提倡科学、反对迷信盲从，是切中时弊的"},{"id":472,"subject":"近代史纲要","code":"15043","type":"essay","stem":"1927 年建立的国民党政权在全国实行的独裁统治的主要表现","options":[],"answer":"(1)建立了庞大的军队和全国性特务系统;\n(2)大力推行保甲制度;\n(3)厉行文化专制主义。","answerShort":"①建立了庞大的军队和全国性特务系统\n②大力推行保甲制度\n③厉行文化专制主义"},{"id":473,"subject":"近代史纲要","code":"15043","type":"essay","stem":"1952年我国开展的“五反”运动的内容","options":[],"answer":"(1)反对行贿;\n(2)反对偷税漏税;\n(3)反对盗窃国家财产;\n(4)反对偷工减料\n(5)反对盗窃经济情报科","answerShort":"①反对行贿\n②反对偷税漏税\n③反对盗窃国家财产\n④反对偷工减料\n⑤反对盗窃经济情报科"},{"id":474,"subject":"近代史纲要","code":"15043","type":"essay","stem":"1979年邓小平提出的坚持四项基本原则及其重要性","options":[],"answer":"(1)四项基本原则:坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东思想;\n(2)重要性:坚持四项基本原则是实现四个现代化的根本前提。如果动摇了这四项基本原则中的任何一项，那就动摇了整个社会主义事业，整个现代化建设事业。","answerShort":"①四项基本原则：坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东思想\n②重要性：坚持四项基本原则是实现四个现代化的根本前提"},{"id":475,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中华民国临时政府的成立性质及局限性","options":[],"answer":"(1)性质:南京临时政府是一个资产阶级共和国性质的革命政权。资产阶级革命派在这个政权中占有领导和主体的地位。南京临时政府制定的各项政策措施，集中代表和反映了中国民族资产阶级的愿望和利益，在相当程度上也符合广大中国人民的利益。\n(2)局限性:南京临时政府也有它的局限性。\n例如，在南京临时政府的《告友邦书》中，就试图用承认清政府与列强所订的一切不平等条约和清政府所欠的一切外债，来换取列强承认中华民国。南京临时政府也没有提出任何可以满足农民土地要求的政策和措施，反而以保护私有财产为借口，去维护封建土地制度以及官僚、地主所占有的土地和财产。","answerShort":"①性质：南京临时政府是一个资产阶级共和国性质的革命政权\n②局限性：南京临时政府也有它的局限性"},{"id":476,"subject":"近代史纲要","code":"15043","type":"essay","stem":"抗日战争胜利后，中国国内的三种建国方案","options":[],"answer":"(1)地主阶级与买办性大资产阶级的建国方案。他维护地主阶级和大资产阶级的根本利益，遭到中国人民的唾弃。(2)民族资产阶级的建国方案。这个方案在中国行不通，因为:帝国主义不允许中国成为一个独立、富强的资本主义国家:民族资产阶级在经济上、政治上的软弱性，使得他没有勇气和能力去领导人民进行彻底反帝反封建的斗争。(3)工人阶级、农民阶级、城市小资产阶级的建国方案。即中国共产党提出的建立一个工人阶级领导的，以工农联盟为基础的人民民主专政国家，是中国人民的历史选择。","answerShort":"①地主阶级与买办性大资产阶级的建国方案\n②民族资产阶级的建国方案\n③工人阶级、农民阶级、城市小资产阶级的建国方案"},{"id":477,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国共产党百年奋斗的历史意义和历史经验","options":[],"answer":"(1)百年奋斗的历史意义:党的百年奋斗从根本上改变了中国人民的前途命运、开辟了实现中华民族伟大复兴的正确道路、展示了马克思主义的强大生命力、深刻影响了世界历史进程、锻造了走在时代前列的中国共产党，阐述党对中国人民、对中华民族、对马克思主义、对人类进步事业、对马克思主义政党建设所作的历史性贡献。\n(2)历史经验:这就是坚持党的领导、坚持人民至上、坚持理论创新、坚持独立自主、坚持中国道路、坚持胸怀天下、坚持开拓创新、坚持敢于斗争，坚持统一战线、持自我革命。","answerShort":"①百年奋斗的历史意义：党的百年奋斗从根本上改变了中国人民的前途命运、开…\n②历史经验：这就是坚持党的领导、坚持人民至上、坚持理论创新、坚持独立自…"},{"id":478,"subject":"近代史纲要","code":"15043","type":"single","stem":"在中国近代史上，人民群众第一次大规模反侵略的武装斗争是","options":["三元里人民的抗英斗争","太平天国抗击洋枪队的斗争","台湾人民的抗日斗争","义和团抗击八国联军的斗争"],"answer":"A"},{"id":479,"subject":"近代史纲要","code":"15043","type":"single","stem":"19世纪60年代，洋务派最早从事的洋务事业是","options":["兴办民用工业","创立新式学堂","派遣留学生","兴办军用工业"],"answer":"D"},{"id":480,"subject":"近代史纲要","code":"15043","type":"single","stem":"1920年，陈独秀等人建立的中国共产党早期组织是","options":["上海共产主义小组","北京共产主义小组","武汉共产主义小组","广州共产主义小组"],"answer":"A"},{"id":481,"subject":"近代史纲要","code":"15043","type":"single","stem":"1947年，中国共产党在全国土地会议上制定的重要文件是","options":["《井冈山土地法》","《兴国土地法》","《关于清算、减租及土地问题的指示》","《中国土地法大纲》"],"answer":"D"},{"id":482,"subject":"近代史纲要","code":"15043","type":"single","stem":"抗日战争胜利后，国共两党在重庆签署《政府与中共代表会谈纪要》是在","options":["1945年8月15日","1945年9月3日","1945年10月10日","1945年10月25日"],"answer":"C"},{"id":483,"subject":"近代史纲要","code":"15043","type":"single","stem":"以 (     )为标志，中国形成了全方位、多层次、宽领域的对外开放格局.","options":["恢复在联合国的合法席位","1992年确定中国经济体制改革的目标是建立社会主义市场经济体制","1992年邓小平发表南方谈话","加入世界贸易组织"],"answer":"D"},{"id":484,"subject":"近代史纲要","code":"15043","type":"single","stem":"《天朝田亩制度》颁布于","options":["1850年","1851年","1852年","1853年"],"answer":"D"},{"id":485,"subject":"近代史纲要","code":"15043","type":"single","stem":"\"二次革命”又被称为","options":["赣宁之役","护国战争","第一次护法运动","第二次护法运动"],"answer":"A"},{"id":486,"subject":"近代史纲要","code":"15043","type":"single","stem":"第一次世界大战后，帝国主义形成的新秩序被称为","options":["维也纳体系","雅尔塔体系","凡尔赛--华盛顿体系","布雷斯顿体系"],"answer":"C"},{"id":487,"subject":"近代史纲要","code":"15043","type":"single","stem":"1935年6月，中央红军和红四方面军会师于","options":["四川懋功","陕北吴起镇","四川甘孜","甘肃会宁"],"answer":"A"},{"id":488,"subject":"近代史纲要","code":"15043","type":"single","stem":"在国民党统治区，以为先导的人民民主运动迅速发展，逐步形成配合人民解放战争的第二条战线","options":["工人运动","学生运动","农民运动","市民运动"],"answer":"D"},{"id":489,"subject":"近代史纲要","code":"15043","type":"single","stem":"鸦片战争爆发的根本原因是","options":["英国完成了工业革命，急需对外扩张","清政府统治腐朽","林则徐在广州的禁烟运动","英国为了扭转对华贸易逆差"],"answer":"A"},{"id":490,"subject":"近代史纲要","code":"15043","type":"single","stem":"19世纪40年代以后，帝国主义势力一次又一次的发动对中国的侵略战争，妄图瓜分中国，灭亡中国。但是，帝国主义列强并没有能够实现他们这一图谋，其根本原因是","options":["中西方文化存在巨大差异","中国经济政治发展不平衡","帝国主义列强之间的矛盾和相互制约","中华民族进行的不屈不挠的反侵略战争"],"answer":"D"},{"id":491,"subject":"近代史纲要","code":"15043","type":"single","stem":"鲁迅先生回顾历史时说:“中国太难改变了，不是很大的鞭子打在背上。中国自己是不肯动弹的。”第二次鸦片战争的'一鞭’使清朝一些有识之士认识到要利用西方先进生产技术富国强兵。于是开始了","options":["洋务运动","戊戌变法","辛亥革命","新文化运动"],"answer":"A"},{"id":492,"subject":"近代史纲要","code":"15043","type":"single","stem":"太平天国农民战争爆发的标志是","options":["金田起义","永安建制","长沙战役","定都南京"],"answer":"A"},{"id":493,"subject":"近代史纲要","code":"15043","type":"single","stem":"2005年10月，中共中央首次明确提出建设创新型国家任务的会议是","options":["十三大","十六大","十六届五中全会","十六届六中全会"],"answer":"C"},{"id":494,"subject":"近代史纲要","code":"15043","type":"multi","stem":"下列关于“三区革命”说法，正确的是","options":["指的是原新疆省的伊犁、塔城、阿山(今阿勒泰)3个专区","反对的是以军阀盛世才为代表的国民党反动派的压迫","爆发了一场有组织的大规模武装斗争","于1945年建立了革命政府","以上都不是"],"answer":"ABCD"},{"id":495,"subject":"近代史纲要","code":"15043","type":"multi","stem":"19世纪90年代，康有为发表的宣传变法维新主张的著作有","options":["《新学伪经考》","《孔子改制考》","《人类公理》","《变法通义》","无"],"answer":"ABC"},{"id":496,"subject":"近代史纲要","code":"15043","type":"multi","stem":"20世纪90年代，中国在推进祖国统一大业方面取得的重大进展有","options":["促成海峡两岸达成“九二共识”","粗曾海峡双边举行“汪辜会谈”","恢复对香港行使主权","恢复对澳门行使主权","无"],"answer":"ABCD"},{"id":497,"subject":"近代史纲要","code":"15043","type":"multi","stem":"以袁世凯为首的北洋军阀投靠帝国主义的表现为","options":["出卖路权、矿权，大肆借款，并签订众多不平等条约","与列强签订“善后大借款”合同，使列强控制和监督中国财政","基本接受日本提出的严重损害中国权益的“二十一条”","以各种手段兼并土地，对农民征收苛捐杂税"],"answer":"ABC"},{"id":498,"subject":"近代史纲要","code":"15043","type":"judge","stem":"1890年，在一定程度上缓解了清政府半殖民地半封建社会的危机。","options":["对","错"],"answer":"错"},{"id":499,"subject":"近代史纲要","code":"15043","type":"judge","stem":"《辛丑条约》的签订标志着清政府已经成为“洋人的朝廷”。","options":["对","错"],"answer":"对"},{"id":500,"subject":"近代史纲要","code":"15043","type":"essay","stem":"近代中国工人阶级的特殊优点是什么？","options":[],"answer":"第一，深受帝国主义、封建势力和资产阶级的三重压迫与剥削，革命性最强。\n第二，人数虽少，但相对集中，主要集中在大城市和大企业中，便于形成革命的力量。\n第三，主要是由破产农民和家庭手工业者转化而来，同农民有着天然的联系，便于结成工农联盟。","answerShort":"①深受帝国主义、封建势力和资产阶级的三重压迫与剥削，革命性最强\n②人数虽少，但相对集中，主要集中在大城市和大企业中，便于形成革命的力量\n③主要是由破产农民和家庭手工业者转化而来，同农民有着天然的联系"},{"id":501,"subject":"近代史纲要","code":"15043","type":"single","stem":"从公元前5世纪的战国时期到1840年鸦片战争，中国社会的性质是","options":["奴隶社会","封建社会","资本主义社会","半殖民地半封建社会"],"answer":"B"},{"id":502,"subject":"近代史纲要","code":"15043","type":"single","stem":"资本-帝国主义列强对近代中国的侵略，首先和主要进行的是","options":["军事侵略","经济侵略","文化侵略","宗教侵略"],"answer":"A"},{"id":503,"subject":"近代史纲要","code":"15043","type":"single","stem":"第二次鸦片战争中洗劫和烧毁圆明园的是","options":["英军","法军","英法联军","八国联军"],"answer":"C"},{"id":504,"subject":"近代史纲要","code":"15043","type":"single","stem":"1894年，孙中山在檀香山建立的中国第一个资产阶级革命组织是","options":["兴中会","华兴会","光复会","同盟会"],"answer":"A"},{"id":505,"subject":"近代史纲要","code":"15043","type":"single","stem":"20世纪初,邹容发表的号召人民推翻清朝统治、建立\"中华共和国\"的著作是","options":["《猛回头》","《警世钟》","《革命军》","《驳康有为论革命书》"],"answer":"C"},{"id":506,"subject":"近代史纲要","code":"15043","type":"single","stem":"1905年中国同盟会成立，其机关报是","options":["《时务报》","《国闻报》","《新民丛报》","《民报》"],"answer":"D"},{"id":507,"subject":"近代史纲要","code":"15043","type":"single","stem":"1915年9月,在上海创办《青年杂志》的是","options":["李大钊","胡适","陈独秀","鲁 ptions":["《中华人民共和国宪法》","《中华人民共和国刑法》","《中华人民共和国民法典》","《反分裂国家法》"],"answer":"D"},{"id":521,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国特色社会主义进入新时代的标志是","options":["十五大","十六大","十七大","十八大"],"answer":"D"},{"id":522,"subject":"近代史纲要","code":"15043","type":"single","stem":"2013年11月，审议通过《中共中央关于全面深化改革若干重大问题的决定》的会议是","options":["十八届一中全会","十八届三中全会","十八届五中全会","十八届七中全会"],"answer":"B"},{"id":523,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国特色社会主义最本质的特征是","options":["中国共产党的领导","人民当家作主","依法治国","共同富裕"],"answer":"A"},{"id":524,"subject":"近代史纲要","code":"15043","type":"single","stem":"中共中央在2018年12月举行大会,庆祝我国实行改革开放","options":["30年","35年","40年","45年"],"answer":"C"},{"id":525,"subject":"近代史纲要","code":"15043","type":"single","stem":"中国共产党第二十次全国代表大会召开的时间是","options":["2020年","2021年","2023年","2022年"],"answer":"D"},{"id":526,"subject":"近代史纲要","code":"15043","type":"essay","stem":"旧民主主义时期中国人民反侵略斗争失败的主要原因","options":[],"answer":"一 、根本原因：社会制度腐败--封建专制统治集团为维护自身利益，妥协投降，压制民众抗 敌力量。\n二 、重要原因经济技术落后--自然经济占主导，军事装备、工业水平与列强差距悬殊。\n三 、直接原因列强军事优势与分化政策--船坚炮利，辅以扶植代理人、瓦解中国抵抗力量。","answerShort":"①根本原因：社会制度腐败--封建专制统治集团为维护自身利益，妥协投降\n②重要原因经济技术落后--自然经济占主导\n③直接原因列强军事优势与分化政策--船坚炮利"},{"id":527,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中共二大制定的党的最高纲领和最低纲领。","options":[],"answer":"中共二大(1922)最高纲领：实现社会主义、共产主义。\n最低纲领：打倒军阀，推翻帝国主义，统一中国为真正的民主共和国。","answerShort":"①中共二大(1922)最高纲领：实现社会主义、共产主义\n②最低纲领：打倒军阀，推翻帝国主义，统一中国为真正的民主共和国"},{"id":528,"subject":"近代史纲要","code":"15043","type":"essay","stem":"井冈山革命根据地创建的历史意义","options":[],"answer":"1 .开辟“农村包围城市、武装夺取政权”的正确道路，成为中国特色革命道路的起点。\n2. 奠定党领导下工农武装割据的雏形，为各地根据地建设提供样板。\n3.保存并壮大革命力量， 使红军在战略上由被动退却转入主动进攻的新阶段。","answerShort":"①1.开辟“农村包围城市、武装夺取政权”的正确道路，成为中国特色革命道路的起点\n②2.奠定党领导下工农武装割据的雏形，为各地根据地建设提供样板\n③3.保存并壮大革命力量，使红军在战略上由被动退却转入主动进攻的新阶段"},{"id":529,"subject":"近代史纲要","code":"15043","type":"essay","stem":"辛亥革命失败后资产阶级革命派为挽救共和而进行的武装斗争。","options":[],"answer":"1913年宋教仁被刺后,孙中山发动\"二次革命\";\n1915年为反对袁世凯称帝,蔡锷等发动护国运动;\n1917年为反对北洋政府拒绝恢复《临时约法》和国会,孙中山发动护法运动。","answerShort":"1913年宋教仁被刺后,孙中山发动\"二次革命\""},{"id":530,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国各民主党派在形成时期的社会基础及性质。","options":[],"answer":"社会基础:主要是民族资产阶级、城市小资产阶级以及同这些阶级相联系的知识分子和其他爱国分子。\n性质:是这些阶级、阶层的人们在反帝爱国和争取民主的共同要求基础上的联合,是阶级联盟性质的政党。在它们的成员和领导骨干中,还有一定数量的革命知识分子和少数共产党人。","answerShort":"①社会基础：主要是民族资产阶级、城市小资产阶级以及同这些阶级相联系的知识分子和其他…\n②性质：是这些阶级、阶层的人们在反帝爱国和争取民主的共同要求基础上的联合,是阶级联…\n③在它们的成员和领导骨干中,还有一定数量的革命知识分子和少数共产党人"},{"id":531,"subject":"近代史纲要","code":"15043","type":"essay","stem":"太平天国颁布的《天朝田亩制度》的意义及局限","options":[],"answer":"一 .意义\n1.革命性与反封建性：明确提出废除封建土地所有制，主张“凡天下田，天下人同耕” 否定地主阶级土地特权，反映了农民对土地的迫切要求。\n2.纲领性文件：是太平天国的建国纲领，系统规划了政治、经济、军事及社会生活的理想蓝图，体现了农民阶级改造社会的尝试。\n3.思想突破：提出“有田同耕，有饭同食”的平均主义理念，冲击了封建生产关系，鼓舞了农民 反抗斗争。\n二 .局限\n1.空想性与不可行性：绝对平均分配土地和产品的方案脱离生产力实际，违背经济发展规律， 无法长期推行。\n2.封建残余：仍沿用等级世袭制度，领导阶层享有特权，未摆脱传统君主专制模式\n3.实践失败： 因战争环境和内部矛盾未能真正实施，后期实际政策与纲领严重脱节。\n结论《天朝田亩制度》兼具反封建的革命性与空想性，其进步意义与历史局限共同反映了农民阶级的时代特征。","answerShort":"①一.意义1.革命性与反封建性：明确提出废除封建土地所有制，主张“凡天下田\n②2.纲领性文件：是太平天国的建国纲领\n③3.思想突破：提出“有田同耕，有饭同食”的平均主义理念，冲击了封建生产关系"},{"id":532,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国人民抗日战争胜利的主要原因。","options":[],"answer":"第一,以爱国主义为核心的民族精神是中国人民抗日战争胜利的决定因素。\n第二,中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键。\n第三,全民族抗战是中国人民抗日战争胜利的重要法宝。\n第四,中国人民抗日战争的胜利,同世界所有爱好和平与正义的国家和人民、国际组织以及各种反法西斯力量的同情与支持也是分不开的。","answerShort":"①以爱国主义为核心的民族精神是中国人民抗日战争胜利的决定因素\n②中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键\n③全民族抗战是中国人民抗日战争胜利的重要法宝\n④中国人民抗日战争的胜利,同世界所有爱好和平与正义的国家和人民、国际组…"},{"id":533,"subject":"近代史纲要","code":"15043","type":"essay","stem":"中国共产党提出的过渡时期总路线反映了历史的必然性","options":[],"answer":"(1)过渡时期总路线的制定是党依据新中国成立后的经济、政治条件的新变化作出的重大决策，是党的总路线、总任务及发展战略上的重大转变，是符合新中国社会发展的实际和规律的；\n(2)社会主义工业化是国家独立富强的首要条件；\n(3)资本主义经济力量弱小，发展困难，不可能成为中国工业起飞的基础；\n(4)对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的一个必要条件；\n(5)当时的国际环境也促使中国选择社会主义。","answerShort":"①过渡时期总路线的制定是党依据新中国成立后的经济、政治条件的新变化作出…\n②社会主义工业化是国家独立富强的首要条件\n③资本主义经济力量弱小，发展困难，不可能成为中国工业起飞的基础\n④对个体农业进行社会主义改造\n⑤当时的国际环境也促使中国选择社会主义"},{"id":534,"subject":"近代史纲要","code":"15043","type":"single","stem":"最能体现太平天国的社会理想的纲领性文件是","options":["资政新篇","原道救世歌 A"},{"id":662,"subject":"马原","code":"15044","type":"single","stem":"实现了阶级的消灭和国家的消亡的社会是","options":["社会主义社会","共产主义社会","民主法治社会","信息网络社会"],"answer":"B"},{"id":663,"subject":"马原","code":"15044","type":"essay","stem":"简述马克思主义的科学内涵以及学习马克思主义的根本方法。","options":[],"answer":"(1)马克思主义的科学内涵:马克思主义是由马克思，恩格斯创立的，为他们的后继者所发展的，以反对资本主义，建设社会主义和共产主义为目标的科学理论体系，或者简要地说，是关于无产阶级和人类解放的科学。\n（2）学习马克思主义的根本方法：理论联系实际。反对教条主义和经验主义，理论联系实际就是把马克思主义的基本原理作为指导，去观察和分析社会实际、工作实际和思想实际。","answerShort":"①马克思主义的科学内涵：马克思主义是由马克思，恩格斯创立的\n②学习马克思主义的根本方法：理论联系实际"},{"id":664,"subject":"马原","code":"15044","type":"essay","stem":"如何理解真理与谬误相互依存并在一定条件下相互转化?","options":[],"answer":"（1）真理：真理是指正确地反映客体的认识。\n（2）谬误：谬误是指歪曲地反映客体的认识。\n（3）真理与谬误的关系：真理和谬误的关系是既对立又统一。\n（4）相互转化的意义：\n①相互依存。\n②互相包含、互相渗透。\n③相对真理向绝对真理转化：真理的发展是由相对真理走向绝对真理的过程。","answerShort":"①真理：真理是指正确地反映客体的认识\n②谬误：谬误是指歪曲地反映客体的认识\n③真理与谬误的关系：真理和谬误的关系是既对立又统一\n④相互转化的意义\n⑤相互依存"},{"id":665,"subject":"马原","code":"15044","type":"essay","stem":"简述不变资本和可变资本的划分根据及其各自的含义。","options":[],"answer":"(1)根据资本在剩余价值生产中所起的作用不同，区分为不变资本和可变资本.\n①不变资本是以生产资料形式存在的这部分资本，在生产过程中不会发生价值量的变化\n②可变资本是以劳动力形式存在的资本、不仅再生产出劳动力的价值,井且生产出利余价值，在生产过程中发生了量的变化，实现了价值增值。\n(2)划分不变资本和可变资本的含义\n①揭露了剩余价值的源泉和资本主义的剥削实质。\n②为揭示资本家对工人的剥削程度提供了科学依据。","answerShort":"①根据资本在剩余价值生产中所起的作用不同，区分为不变资本和可变资本\n②不变资本是以生产资料形式存在的这部分资本\n③可变资本是以劳动力形式存在的资本、不仅再生产出劳动力的价值,井且生产…\n④划分不变资本和可变资本的含义\n⑤揭露了剩余价值的源泉和资本主义的剥削实质"},{"id":666,"subject":"马原","code":"15044","type":"essay","stem":"什么是经济全球化?其消极影响有哪些?","options":[],"answer":"一、经济全球化的内容：经济全球化本质上是资源配置的国际化，\n①生产全球化。生产领域的国际分工以及协作加强各国在生产上结合紧密。\n②贸易全球化。随着生产的发展，消费水平的提高，国际贸易壁垒减少，贸易全球化迅猛发展。\n③资本全球化。资本规模的扩大,资本全球化程度日益提高\n二、经济全球化的消极影响的表现是：\n(1）在经济全球化进程中，发达国家与发展中国家的差距在许多方面和领域不是缩小而是扩大了。\n(2）在经济增长中忽视社会进步，环境恶化、资源浪费与经济全球化同时发生。\n(3）在经济全球化的冲击下，各个国家内部和国际社会出现了不同程度的治理危机。\n(4）在经济全球化进程中相应的全球性协调机制没有建立起来，爆发全球性危机的风险有所增大。","answerShort":"①经济全球化的内容：经济全球化本质上是资源配置的国际化\n②生产全球化\n③贸易全球化\n④资本全球化\n⑤经济全球化的消极影响的表现是：(1）在经济全球化进程中"},{"id":667,"subject":"马原","code":"15044","type":"essay","stem":"如何探索适合本国国情的社会主义发展道路?","options":[],"answer":"第一，探索社会主义发展道路要以马克思主义理论为指导；\n第二，探索社会主义发展道路要从本国国情出发，把马克思主义基本原理同本国的社会主义建设实践结合起来；\n第三，探索社会主义发展道路要吸收人类一切文明成果。","answerShort":"①探索社会主义发展道路要以马克思主义理论为指导\n②探索社会主义发展道路要从本国国情出发\n③探索社会主义发展道路要吸收人类一切文明成果"},{"id":668,"subject":"马原","code":"15044","type":"essay","stem":"试述主要矛盾和次要矛盾关系的原理，并结合中国特色社会主义进入新时代的实际，谈谈正确把握社会主要矛盾及其转化的意义。","options":[],"answer":"(一) 原理:\n(1)  主要矛盾:主要矛盾是指居于支配地位。起决定作用的矛盾。\n(2)  次要矛盾:次要矛盾是指其他处于服从地位的矛盾.\n①两者相互影响.相互作用:主要矛盾规定和影响着次要矛盾的存在和发展，起决定作用，次要矛盾制约着主要矛盾。\n②在一定条件下相互转化。\n（二）相互转化的意义:\n（1）党对社会主义建设规律的探素要抓住主要矛盾。不忽略次要矛盾。要注意二者的转化。不失时机地转移工作重点。\n(3)  新时代，我国社会主要矛盾转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","answerShort":"①主要矛盾：主要矛盾是指居于支配地位\n②次要矛盾：次要矛盾是指其他处于服从地位的矛盾\n③两者相互影响.相互作用：主要矛盾规定和影响着次要矛盾的存在和发展\n④在一定条件下相互转化\n⑤党对社会主义建设规律的探素要抓住主要矛盾"},{"id":669,"subject":"马原","code":"15044","type":"essay","stem":"正确认识和评价杰出人物的历史作用，必须坚持哪些基本观点和方法?","options":[],"answer":"①杰出人物是一定历史条件下的产物。要正确认识杰出人物的历史作用。必须深入了解它们所处的历史条件，坚持历史主义原则。任何一个杰出人物的出现，都是时代的需要。\n②在阶级社会里的杰出人物。总是一定阶级的代：要正确认识杰出人物的历史作用，必须要对他们做阶级分析。\n③杰出人物的出现及其历史作用都是必然性与偶然性的辩证统一 。因此必须用必然性与偶然性辩证统一的观点来分析杰出人物及其历史作用。\n④任何杰出人物都有巨大的历史功绩，也必然会有这样那样的缺点或错误。对他们的历史作用要做全面的分析与评价，既不能肯定一切， 也不能否定一切。","answerShort":"①杰出人物是一定历史条件下的产物\n②在阶级社会里的杰出人物\n③杰出人物的出现及其历史作用都是必然性与偶然性的辩证统一\n④任何杰出人物都有巨大的历史功绩，也必然会有这样那样的缺点或错误"},{"id":670,"subject":"马原","code":"15044","type":"essay","stem":"什么是价值规律?它在商品经济中的作用及其表现形式是什么?","options":[],"answer":"（一）商品经济的基本规律是价值规律:\n（1）价值规律的内容：商品的价值是由生产商品的社会必要劳动时间决定；商品交换以价值为基础，实行等价交换。\n（2）价值规律作用的表现形式：价值制约着价格，价格以价值为基础；价格围绕价值上下波动。\n(一) 商品经济价值规律的作用:\n(1)  自身的作用:\n①是商品按照价值进行交换的客观必然性的实现。这种必然性越是得到贯彻，就越表明价值规律在发挥作用。商品经济得到顺利的发展。\n②忽视或否定价值规律的客观作用， 阳碍商品经济的发展。\n(2)  对社会经济发展的作用:\n①自发地调节生产资料和劳动力在社会生产各部门之间分配的比例:\n②自发地促进社会生产力发展:\n③会引起商品生产者的分化。","answerShort":"①（一）商品经济的基本规律是价值规律:\n②价值规律的内容：商品的价值是由生产商品的社会必要劳动时间决定\n③价值规律作用的表现形式：价值制约着价格，价格以价值为基础\n④自身的作用:\n⑤是商品按照价值进行交换的客观必然性的实现"},{"id":671,"subject":"马原","code":"15044","type":"single","stem":"马克思主义产生于19世纪，至今已经历()。","options":["150多年","170多年","190多年","200多年"],"answer":"B"},{"id":672,"subject":"马原","code":"15044","type":"single","stem":"在马克思主 1)从认识客体角度看(3分)\n①客观事物本身是多种矛盾的统一体;\n②事物的矛盾有展开和发展的过程;\n③任何事物都是具体的，存在于特定社会历史环境中。\n(2)从认识主体看(3分)\n人的认识受到主体生理因素、知识水平、生活经验、认识能力及其立场、观点、方法的限制。","answerShort":"①从认识客体角度看(3分)\n②客观事物本身是多种矛盾的统一体\n③事物的矛盾有展开和发展的过程\n④任何事物都是具体的，存在于特定社会历史环境中\n⑤从认识主体看(3分)人的认识受到主体生理因素、知识水平、生活经验、认…"},{"id":697,"subject":"马原","code":"15044","type":"essay","stem":"简述生产方式及其在社会发展的作用。","options":[],"answer":"生产方式是人类借以向自然界谋取必需的生活资料的方式，包括生产力和生产关系两个方面，是特定的生产力和生产关系的统一。(2分)\n生产方式在社会发展中起决定作用，主要表现在以下几个方面：(4分)\n(1)生产方式或生产活动，是人类从动物界分离出来的根本动力和人类区别于动物的根本标志;\n(2)生产方式或生产活动是人类和人类社会得以存在和发展的基础;\n(3)生产活动是形成人类社会关系的基础;\n(4)生产方式决定社会制度的性质和社会形态的更替。","answerShort":"①生产方式是人类借以向自然界谋取必需的生活资料的方式，包括生产力和生产关系两个方面\n②生产方式或生产活动，是人类从动物界分离出来的根本动力和人类区别于动物的根本标志\n③生产方式或生产活动是人类和人类社会得以存在和发展的基础\n④生产活动是形成人类社会关系的基础\n⑤生产方式决定社会制度的性质和社会形态的更替"},{"id":698,"subject":"马原","code":"15044","type":"essay","stem":"劳动二重性理论是“理解政治经济学的枢纽，请简要说明劳动二重性的含义。","options":[],"answer":"(1)具体劳动，是具有特定性质、目的和形式的劳动，创造商品的使用价值。具体劳动生产商品劳动的自然属性。(2分)\n(2)抽象劳动，撇开具体形式的、无差别的一般人类劳动，创造商品的价值。抽象劳动生产商品劳动的社会属性。(2分)\n(3)具体劳动和抽象劳动是商品生产者的同一劳动过程的不可分割的两个方面，在时间上和空间上是统一的，并不是各自独立存在的两种劳动或两次劳动，商品生产者在从事具体劳动的同时，也就支出了抽象劳动。(2分)","answerShort":"①具体劳动，是具有特定性质、目的和形式的劳动，创造商品的使用价值\n②抽象劳动，撇开具体形式的、无差别的一般人类劳动，创造商品的价值\n③具体劳动和抽象劳动是商品生产者的同一劳动过程的不可分割的两个方面"},{"id":699,"subject":"马原","code":"15044","type":"essay","stem":"简述资本主义国家宏观经济管理与调节的主要目标。","options":[],"answer":"资本主义国家宏观经济管理与调节的主要目标包括保持经济的稳定和一定程度的增长，保持币值和物价的稳定，实现充分就业，保持国际国内收支的大体平衡等。","answerShort":"资本主义国家宏观经济管理与调节的主要目标包括保持经济的稳定和一定程度的增长"},{"id":700,"subject":"马原","code":"15044","type":"essay","stem":"共产主义精神境界的极大提高表现在哪些方面?","options":[],"answer":"共产主义社会中人们精神境界的极大提高，表现在多方面：人们树立了高度，自觉的劳动态度，遵守社会纪律，团结互助，诚实友爱，完全从社会公共利益出发进行劳作和参加社会活动，人人都习惯于遵守社会公共生活的基本准则。(3分)人们既摆脱了封建的、保守的思想观念的束缚，又摒弃了以利已主义为核心的资产阶级思想意识，树立了以集体主义为核心的共产主义人生观、价值观和道德观。(3分)","answerShort":"①共产主义社会中人们精神境界的极大提高，表现在多方面：人们树立了高度\n②(3分)人们既摆脱了封建的、保守的思想观念的束缚\n③(3分)"},{"id":701,"subject":"马原","code":"15044","type":"essay","stem":"第二次世界大战后国家垄断资本主义大发展的原因是什么?","options":[],"answer":"(1)仅靠私人垄断资本的力量，无法满足大规模经济建设所需要的巨额资金;(2分)\n(2)在一些大规模公共设施的建设上，私人垄断资本无能为力或不愿进行建设;(2分)\n(3)一些大型、基础性、前导性的科学研究项目，也是私人垄断资本不愿涉足的领域;(2分)\n(4)日益严重的生产过剩问题仅靠私人垄断资本很难解决;(2分)\n(5)社会化大生产的发展要求国家出面进行某些宏观经济调控;(1分)\n(6)在经济利益关系的调整方面，国家的再分配功能也越来越重要。(1分)","answerShort":"①仅靠私人垄断资本的力量，无法满足大规模经济建设所需要的巨额资金\n②在一些大规模公共设施的建设上，私人垄断资本无能为力或不愿进行建设\n③一些大型、基础性、前导性的科学研究项目，也是私人垄断资本不愿涉足的领域\n④日益严重的生产过剩问题仅靠私人垄断资本很难解决\n⑤社会化大生产的发展要求国家出面进行某些宏观经济调控"},{"id":702,"subject":"马原","code":"15044","type":"essay","stem":"试述量变和质变的辩证关系原理及其对于社会主义建设的意义。","options":[],"answer":"量变和质变是辩证统一的。(1分)\n(1)二者区别：量变是事物数量的增减和场所的变更，以及事物构成成分在空间上排列组合的变化。质变是事物的根本性的变化，事物由一种质态向另一种质态的飞跃。(2分)\n(2)二者关系：(3分)\n①量变是质变的必要准备，质变以量变为前提和基础;\n②质变是量变的必然结果，量变达到一定程度必将会引起质变;\n③量变与质变相互渗透，质变体现和巩固量变的成果，为新量变开拓道路;总的量变过程中有阶段性和局部性质变。\n(3)质量互变规律要求我们在社会主义建设和改革过程中，把远大的理想和目标同“有步骤、分阶段的踏实肯干、稳步前进”的精神结合起来，反对急躁冒进、急于求成、否则会欲速则不达。(4分)","answerShort":"①量变和质变是辩证统一的\n②二者区别：量变是事物数量的增减和场所的变更，以及事物构成成分在空间上排列组合的变化\n③二者关系：(3分)\n④量变是质变的必要准备，质变以量变为前提和基础\n⑤质变是量变的必然结果，量变达到一定程度必将会引起质变"},{"id":703,"subject":"马原","code":"15044","type":"essay","stem":"相对剩余价值和超额剩余价值是怎样生产出来的?","options":[],"answer":"(1)相对剩余价值是在工作日长度不变的条件下，通过提高劳动生产率，缩短必要劳动时间，相对延长剩余劳动时间而生产的剩余价值。(3分)\n(2)超额剩余价值，是指商品个别价值低于社会价值的差额个别企业通过提高劳动生产率，使其个别劳动时间低于社会必要劳动时间，按照社会价值出售商品，资本家就能获得更高的剩余价值，即超额剩余价值。(3分)\n(3)相对剩余价值生产是在各个资本家追求超额剩余价值的过程中实现的。\n为了追求超额剩余价值，各个资本家之间进行激烈竞争。少数企业不可能长期垄断先进生产条件，当先进技术得到普及以后，该部门的平均劳动生产率将会提高，从而导致商品的社会价值下降，个别价值低于社会价值的差额便会消失，原来的超额剩余价值就不存在了。但是，由于劳动生产率普遍提高的结果，使单位商品价值降低，从而劳动力价值也相应降低，必要劳动时间缩短，剩余劳动时间延长。因此，超额剩余价值虽然在个别资本家那里消失了，但所有的资本家却都可以由于劳动生产率的普遍提高而得到相对剩余价值。(4分)","answerShort":"①相对剩余价值是在工作日长度不变的条件下，通过提高劳动生产率\n②超额剩余价值\n③相对剩余价值生产是在各个资本家追求超额剩余价值的过程中实现的"},{"id":704,"subject":"马原","code":"15044","type":"single","stem":"马克思主义是时代的产物。资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了()。","options":["阶级基础","客观条件","科学前提","思想渊源"],"answer":"B"},{"id":705,"subject":"马原","code":"15044","type":"single","stem":"马克思主义的基本特征用一句话来概括就是()。","options":["科学性与革命性的统一","科学性与人民性的统一","科学性与实践性的统一","科学性与发展性的统一"],"answer":"A"},{"id":706,"subject":"马原","code":"15044","type":"single","stem":"思维和存在的关系问题作为哲学的基本问题也称为()。","
