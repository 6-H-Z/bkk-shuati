<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二建 · 知识卡</title>
<style>
  *{box-sizing:border-box}
  :root{--ink:#12263A;--ink-2:#3C5A75;--paper:#FAFAF7;--line:#E2E0D6;--accent:#F2B01E;
        --ok:#1F7A4C;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto;padding:18px 14px 28px;max-width:640px;background:var(--paper);color:var(--ink);
       font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  h1{font-size:21px;margin:0 0 6px;font-weight:650;letter-spacing:.01em}
  .sub{font-size:11.5px;color:var(--ink-2);margin:0;font-family:var(--mono);letter-spacing:.02em}
  a.subject{position:relative;display:block;padding:14px 16px 13px 18px;margin-bottom:10px;
            background:#fff;border:1px solid var(--line);border-radius:2px;
            text-decoration:none;color:var(--ink)}
  a.subject::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}
  a.subject.off{opacity:.62}
  a.subject.off::before{background:var(--line)}
  a.subject:active{background:#FCFCF9}
  .row{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
  .name{font-size:16px;font-weight:600;letter-spacing:.01em}
  .ch{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);border:1px solid var(--line);
      padding:1px 6px;border-radius:2px;white-space:nowrap}
  .meta{font-size:11.5px;color:#8C897C;font-family:var(--mono);letter-spacing:.02em}
  .bar{margin-top:9px;height:2px;background:#EDEBE2;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  footer{margin-top:18px;font-size:11px;color:#9A9789;line-height:1.9;font-family:var(--mono);
         border-top:1px solid var(--line);padding-top:12px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>二建 · 知识卡</h1>
  <p class="sub">2027 版教材 · 按节出卡 · 手机直接刷</p>
</header>

<a class="subject" href="sw/">
  <div class="row">
    <span class="name">机电工程管理与实务</span>
    <span class="ch">16 章</span>
  </div>
  <div class="meta">已开 12 节 · 411 张卡 · 72 道验收</div>
  <div class="bar"><i style="width:75%"></i></div>
</a>

<a class="subject off" href="#">
  <div class="row">
    <span class="name">建设工程施工管理</span>
    <span class="ch">8 章</span>
  </div>
  <div class="meta">未开始 · 计划 W1 起并行</div>
  <div class="bar"><i style="width:0%"></i></div>
</a>

<a class="subject off" href="#">
  <div class="row">
    <span class="name">建设工程法规及相关知识</span>
    <span class="ch">10 章</span>
  </div>
  <div class="meta">未开始 · 计划 W14 起并行</div>
  <div class="bar"><i style="width:0%"></i></div>
</a>

<footer>
  先看问题自己答，再翻面核对。<br>
  每节右上角「验收」，6 题全对才算通关。<br>
  进度存在本机浏览器，换设备不同步。
</footer>
</body>
</html>
